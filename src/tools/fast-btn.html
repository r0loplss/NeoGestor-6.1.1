<!DOCTYPE html>
<html data-neo-theme="dark">
<head>
<meta charset="UTF-8">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
    #b {
        position: absolute; inset: 0; width: 100%; height: 100%;
        background: transparent; border: none; cursor: pointer;
        display: flex; align-items: center; justify-content: center;
        -webkit-app-region: no-drag;
    }
    #b .bolt-wrap {
        width: 18px; height: 92%;
        display: flex; align-items: center; justify-content: center;
        border-radius: 9px;
        background: linear-gradient(180deg, rgba(60,72,96,.86), rgba(30,38,54,.82));
        border: 1px solid rgba(255,255,255,.16);
        color: var(--neo-accent, #2fcbf1);
        box-shadow: 0 2px 10px rgba(0,0,0,.42), inset 0 1px 0 rgba(255,255,255,.25);
        -webkit-backdrop-filter: blur(10px) saturate(150%);
        backdrop-filter: blur(10px) saturate(150%);
        transition: all 0.15s ease;
    }
    html[data-neo-theme="light"] #b .bolt-wrap {
        background: linear-gradient(180deg, rgba(255,255,255,.9), rgba(255,255,255,.75));
        border-color: rgba(20,30,50,.16);
        box-shadow: 0 2px 10px rgba(0,0,0,.18), inset 0 1px 0 rgba(255,255,255,.8);
    }
    #b .bolt { font-size: 13px; line-height: 1; }
    #b:hover .bolt-wrap {
        border-color: var(--neo-accent, #2fcbf1);
        box-shadow: 0 2px 16px color-mix(in srgb, var(--neo-accent, #2fcbf1) 45%, transparent);
        transform: scale(1.06);
    }
    #b.active .bolt-wrap {
        color: #fbbf24; border-color: #fbbf24;
        box-shadow: 0 2px 16px rgba(251,191,36,.5);
        transform: scale(1.06);
    }
</style>
</head>
<body>
<button id="b" title="Abrir Fast (Ctrl+Shift+F)">
    <span class="bolt-wrap"><span class="bolt">⚡</span></span>
</button>
<script>
    const { ipcRenderer } = require('electron');
    const b = document.getElementById('b');
    b.addEventListener('click', () => ipcRenderer.send('fast-toggle'));
    ipcRenderer.on('fast-state', (e, s) => {
        b.classList.toggle('active', !!(s && s.visible));
        b.title = (s && s.visible) ? 'Cerrar Fast (Ctrl+Shift+F)' : 'Abrir Fast (Ctrl+Shift+F)';
    });
    ipcRenderer.send('fast-request-state');
</script>
</body>
</html>
