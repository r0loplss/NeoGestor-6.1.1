<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <title>Cambio de Ciclo</title>
    <style>
        /* ============================================================
               ROOT – Tema oscuro consistente con la app
               ============================================================ */
        :root {
            --bg: #0f1117;
            --surface: #161b27;
            --surface2: #1c2333;
            --surface3: #232c3f;
            --border: rgba(255, 255, 255, 0.07);
            --border2: rgba(255, 255, 255, 0.12);
            --text: #e2e8f0;
            --muted: #8892a4;
            --faint: #4a5568;
            --primary: #3b82f6;
            --success: #22c55e;
            --warning: #f59e0b;
            --danger: #ef4444;
            --font: 'Segoe UI', system-ui, sans-serif;
            --radius: 5px;
        }

        /* ============================================================
               RESET Y ESTRUCTURA BASE
               ============================================================ */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
            background: var(--bg);
            font-family: var(--font);
            font-size: 13px;
            color: var(--text);
        }

        body {
            display: flex;
            flex-direction: column;
            border: 1px solid var(--border2);
            border-radius: 6px;
        }

        /* ============================================================
               HEADER (frameless + drag)
               ============================================================ */
        #hdr {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 0 8px;
            height: 32px;
            flex-shrink: 0;
            background: #0d1220;
            border-bottom: 1px solid var(--border);
            border-radius: 6px 6px 0 0;
            -webkit-app-region: drag;
            user-select: none;
        }

        #hdr-title {
            flex: 1;
            font-size: 11px;
            font-weight: 700;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .hbtn {
            -webkit-app-region: no-drag;
            background: none;
            border: none;
            cursor: pointer;
            color: var(--faint);
            font-size: 12px;
            padding: 2px 6px;
            border-radius: 3px;
            transition: all 0.15s;
            font-family: var(--font);
        }

        .hbtn:hover {
            color: var(--text);
            background: rgba(255, 255, 255, 0.08);
        }

        .hbtn.danger:hover {
            color: var(--danger);
        }

        /* ============================================================
               CUERPO PRINCIPAL (scroll vertical)
               ============================================================ */
        #main {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        ::-webkit-scrollbar {
            width: 9px;
            height: 9px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--faint);
            border-radius: 5px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--muted);
        }

        #main::-webkit-scrollbar {
            width: 9px;
            height: 9px;
        }
        #main::-webkit-scrollbar-thumb {
            background: var(--faint);
            border-radius: 5px;
        }
        #main::-webkit-scrollbar-thumb:hover {
            background: var(--muted);
        }

        /* ============================================================
               CAMPOS DE ENTRADA
               ============================================================ */
        .field-row {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .field-row label {
            font-size: 11px;
            font-weight: 600;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        .field-row select,
        .field-row input[type="date"] {
            padding: 7px 10px;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text);
            font-size: 13px;
            font-family: var(--font);
            outline: none;
            transition: border-color 0.15s;
            color-scheme: dark;
        }

        .field-row select:focus,
        .field-row input[type="date"]:focus {
            border-color: var(--primary);
        }

        /* ============================================================
               BOTÓN CALCULAR
               ============================================================ */
        .btn-calc {
            padding: 10px 0;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: var(--radius);
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.15s;
            font-family: var(--font);
            margin-top: 4px;
        }

        .btn-calc:hover {
            background: #2563eb;
        }

        .btn-calc:active {
            transform: scale(0.98);
        }

        /* ============================================================
               RESULTADOS – DOS CUADROS LADO A LADO
               ============================================================ */
        .result-box {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 14px 16px;
            display: none;
            flex-direction: column;
            gap: 14px;
        }

        .result-box.show {
            display: flex;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .card-boleta {
            background: var(--surface2);
            border: 1px solid var(--border2);
            border-radius: var(--radius);
            padding: 14px 16px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .card-boleta .titulo {
            font-size: 13px;
            font-weight: 700;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .card-boleta .titulo .icon {
            font-size: 16px;
        }

        .card-boleta .campo {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            padding: 3px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }

        .card-boleta .campo .label {
            color: var(--muted);
        }

        .card-boleta .campo .valor {
            color: var(--text);
            font-weight: 600;
        }

        .card-boleta .campo .valor.destacado {
            color: var(--warning);
        }

        /* ============================================================
               SPEECH Y BOTÓN COPIAR
               ============================================================ */
        .speech-box {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 12px 14px;
            font-size: 12px;
            line-height: 1.6;
            color: var(--text);
            white-space: pre-wrap;
            word-break: break-word;
            max-height: 120px;
            overflow-y: auto;
        }

        .speech-box::-webkit-scrollbar {
            width: 9px;
            height: 9px;
        }
        .speech-box::-webkit-scrollbar-thumb {
            background: var(--faint);
            border-radius: 5px;
        }
        .speech-box::-webkit-scrollbar-thumb:hover {
            background: var(--muted);
        }

        .btn-copy {
            padding: 8px 0;
            background: var(--surface3);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text);
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.15s;
            font-family: var(--font);
            margin-top: 4px;
        }

        .btn-copy:hover {
            background: var(--surface2);
            border-color: var(--primary);
        }

        .btn-copy.copiado {
            background: rgba(34, 197, 94, 0.15);
            border-color: var(--success);
            color: var(--success);
        }

        /* ============================================================
               TOAST (notificación emergente)
               ============================================================ */
        #toast-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: none;
        }

        .toast {
            pointer-events: auto;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            color: #fff;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
            animation: toastIn 0.3s ease-out;
            max-width: 320px;
        }

        .toast.success {
            background: var(--success);
        }
        .toast.warning {
            background: var(--warning);
            color: #000;
        }
        .toast.error {
            background: var(--danger);
        }

        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ============================================================
               RESPONSIVE
               ============================================================ */
        @media (max-width: 500px) {
            .cards-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <!-- ============================================================
    HEADER
    ============================================================ -->
    <div id="hdr">
        <span id="hdr-title">🔄 Cambio de Ciclo de Facturación</span>
        <button class="hbtn" onclick="ipcRenderer.send('minimize-tool','ciclos')" title="Minimizar">—</button>
        <button class="hbtn" onclick="ipcRenderer.send('close-tool','ciclos')">✕</button>
    </div>

    <!-- ============================================================
    CUERPO
    ============================================================ -->
    <div id="main">

        <!-- Ciclo Actual -->
        <div class="field-row">
            <label for="ciclo-actual">📌 Ciclo Actual</label>
            <select id="ciclo-actual">
                <option value="50">50</option>
                <option value="51">51</option>
                <option value="52" selected>52</option>
                <option value="53">53</option>
                <option value="54">54</option>
            </select>
        </div>

        <!-- Nuevo Ciclo -->
        <div class="field-row">
            <label for="ciclo-nuevo">🔄 Nuevo Ciclo</label>
            <select id="ciclo-nuevo">
                <option value="52">52</option>
                <option value="53" selected>53</option>
                <option value="54">54</option>
            </select>
        </div>

        <!-- Fecha de la orden -->
        <div class="field-row">
            <label for="fecha-orden">📅 Fecha de la orden</label>
            <input type="date" id="fecha-orden" />
        </div>

        <!-- Botón Calcular -->
        <button class="btn-calc" id="btn-calcular">🔍 Calcular</button>

        <!-- Resultados (ocultos por defecto) -->
        <div class="result-box" id="resultados">

            <!-- Dos cuadros -->
            <div class="cards-grid">
                <!-- Boleta anterior -->
                <div class="card-boleta" id="card-anterior">
                    <div class="titulo"><span class="icon">📄</span> Boleta anterior</div>
                    <div class="campo"><span class="label">Ciclo</span><span class="valor" id="res-ciclo-ant">—</span></div>
                    <div class="campo"><span class="label">Período</span><span class="valor" id="res-periodo-ant">—</span></div>
                    <div class="campo"><span class="label">Días a cobrar</span><span class="valor destacado" id="res-dias-ant">—</span></div>
                    <div class="campo"><span class="label">Emisión</span><span class="valor" id="res-emision-ant">—</span></div>
                    <div class="campo"><span class="label">Vencimiento</span><span class="valor" id="res-vencimiento-ant">—</span></div>
                </div>

                <!-- Boleta nueva -->
                <div class="card-boleta" id="card-nueva">
                    <div class="titulo"><span class="icon">📄</span> Boleta nueva</div>
                    <div class="campo"><span class="label">Ciclo</span><span class="valor" id="res-ciclo-nue">—</span></div>
                    <div class="campo"><span class="label">Período</span><span class="valor" id="res-periodo-nue">—</span></div>
                    <div class="campo"><span class="label">Días a cobrar</span><span class="valor destacado" id="res-dias-nue">—</span></div>
                    <div class="campo"><span class="label">Emisión</span><span class="valor" id="res-emision-nue">—</span></div>
                    <div class="campo"><span class="label">Vencimiento</span><span class="valor" id="res-vencimiento-nue">—</span></div>
                    <div class="campo"><span class="label">Reinicio plan</span><span class="valor" id="res-reinicio-nue">—</span></div>
                </div>
            </div>

            <!-- Speech -->
            <div class="speech-box" id="speech-box">
                💬 Speech sugerido:
                <span id="speech-text">(Realiza un cálculo para generar el speech)</span>
            </div>

            <!-- Botón Copiar Speech -->
            <button class="btn-copy" id="btn-copy-speech">📋 Copiar Speech</button>

        </div>

    </div>

    <!-- ============================================================
    TOAST CONTAINER (notificaciones)
    ============================================================ -->
    <div id="toast-container"></div>

    <!-- ============================================================
    SCRIPT
    ============================================================ -->
    <script>
        const { ipcRenderer } = require('electron');

        // Referencias DOM
        const cicloActual = document.getElementById('ciclo-actual');
        const cicloNuevo = document.getElementById('ciclo-nuevo');
        const fechaOrden = document.getElementById('fecha-orden');
        const btnCalcular = document.getElementById('btn-calcular');
        const resultados = document.getElementById('resultados');
        const speechText = document.getElementById('speech-text');
        const btnCopySpeech = document.getElementById('btn-copy-speech');

        // ============================================================
        // TABLA DE CICLOS (con mesVenc)
        // ============================================================
        const CICLOS = {
            50: {
                inicio: 1,
                fin: 31,
                reinicio: 1,
                emision: 5,
                vencimiento: [21, 25, 30],
                vencimientoTxt: '21, 25 o 30',
                mesVenc: 0 // 0 = mismo mes, 1 = mes siguiente
            },
            51: {
                inicio: 1,
                fin: 31,
                reinicio: 1,
                emision: 13,
                vencimiento: [5, 8, 10, 12],
                vencimientoTxt: '5, 8, 10 o 12',
                mesVenc: 1
            },
            52: {
                inicio: 8,
                fin: 7,
                reinicio: 8,
                emision: 17,
                vencimiento: [28],
                vencimientoTxt: '28',
                mesVenc: 0
            },
            53: {
                inicio: 16,
                fin: 15,
                reinicio: 16,
                emision: 23,
                vencimiento: [6],
                vencimientoTxt: '06',
                mesVenc: 1
            },
            54: {
                inicio: 23,
                fin: 22,
                reinicio: 26,
                emision: 27,
                vencimiento: [13],
                vencimientoTxt: '13',
                mesVenc: 1
            }
        };

        // Ciclos disponibles para "nuevo" según el actual
        const NUEVOS_PERMITIDOS = {
            50: [52, 53, 54],
            51: [52, 53, 54],
            52: [53, 54],
            53: [52, 54],
            54: [52, 53]
        };

        // ============================================================
        // TOAST
        // ============================================================
        function showToast(msg, tipo = 'success', duracion = 2500) {
            const container = document.getElementById('toast-container');
            const el = document.createElement('div');
            el.className = 'toast ' + tipo;
            el.textContent = msg;
            container.appendChild(el);
            setTimeout(() => {
                el.style.opacity = '0';
                el.style.transform = 'translateY(10px)';
                el.style.transition = 'opacity 0.3s, transform 0.3s';
                setTimeout(() => el.remove(), 400);
            }, duracion);
        }

        // ============================================================
        // PERSISTENCIA (localStorage + IPC central)
        // ============================================================
        const STORAGE_KEY = 'ciclos-estado';

        function guardarEstado() {
            try {
                const data = {
                    actual: cicloActual.value,
                    nuevo: cicloNuevo.value,
                    fecha: fechaOrden.value
                };
                localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
                if (typeof ipcRenderer !== 'undefined') {
                    ipcRenderer.send('save-ciclos', data);
                }
            } catch (e) {}
        }

        function cargarEstado() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (!raw) return;
                const data = JSON.parse(raw);
                if (data.actual) cicloActual.value = data.actual;
                if (data.nuevo) cicloNuevo.value = data.nuevo;
                if (data.fecha) fechaOrden.value = data.fecha;
            } catch (e) {}
        }

        if (typeof ipcRenderer !== 'undefined') {
            ipcRenderer.on('init-ciclos', (e, state) => {
                if (state) {
                    if (state.actual) cicloActual.value = state.actual;
                    if (state.nuevo) cicloNuevo.value = state.nuevo;
                    if (state.fecha) fechaOrden.value = state.fecha;
                    actualizarOpcionesNuevo();
                    if (fechaOrden.value && cicloActual.value && cicloNuevo.value) {
                        calcular();
                    }
                }
            });
        }

        // Prellenar fecha de hoy
        function setFechaHoy() {
            if (fechaOrden.value) return;
            const hoy = new Date();
            const y = hoy.getFullYear();
            const m = String(hoy.getMonth() + 1).padStart(2, '0');
            const d = String(hoy.getDate()).padStart(2, '0');
            fechaOrden.value = `${y}-${m}-${d}`;
        }

        // ============================================================
        // ACTUALIZAR OPCIONES DE NUEVO CICLO SEGÚN ACTUAL
        // ============================================================
        function actualizarOpcionesNuevo() {
            const actual = parseInt(cicloActual.value);
            const permitidos = NUEVOS_PERMITIDOS[actual] || [52, 53, 54];
            const actualValue = parseInt(cicloNuevo.value);

            cicloNuevo.innerHTML = '';
            permitidos.forEach(c => {
                const opt = document.createElement('option');
                opt.value = c;
                opt.textContent = c;
                cicloNuevo.appendChild(opt);
            });

            if (!permitidos.includes(actualValue)) {
                cicloNuevo.value = permitidos[0] || 52;
            }
        }

        // ============================================================
        // CALCULAR
        // ============================================================
        function calcular() {
            const actual = parseInt(cicloActual.value);
            const nuevo = parseInt(cicloNuevo.value);
            const fechaOrd = fechaOrden.value;

            if (!fechaOrd) {
                showToast('⚠️ Por favor selecciona la fecha de la orden.', 'warning');
                return;
            }

            const fechaBase = new Date(fechaOrd + 'T12:00:00');
            const fechaEfectiva = new Date(fechaBase);
            fechaEfectiva.setDate(fechaEfectiva.getDate() + 1); // cambio al día siguiente

            const infoActual = CICLOS[actual];
            const infoNuevo = CICLOS[nuevo];

            // ============================================================
            // Período anterior
            // ============================================================
            let fechaInicioAnt = new Date(fechaBase.getFullYear(), fechaBase.getMonth(), infoActual.inicio);
            if (fechaInicioAnt > fechaBase) {
                fechaInicioAnt = new Date(fechaBase.getFullYear(), fechaBase.getMonth() - 1, infoActual.inicio);
            }
            const fechaFinAnt = new Date(fechaBase); // hasta el día de la orden

            // Días del período anterior
            const diffAnt = Math.floor((fechaFinAnt - fechaInicioAnt) / (1000 * 60 * 60 * 24)) + 1;

            // ============================================================
            // Período nuevo
            // ============================================================
            const fechaInicioNue = new Date(fechaEfectiva);
            const diaInicioNue = infoNuevo.inicio;

            let fechaFinNue;
            if (diaInicioNue <= 1) {
                // Ciclos que inician el 1: terminan el último día del mes actual
                fechaFinNue = new Date(fechaInicioNue.getFullYear(), fechaInicioNue.getMonth() + 1, 0);
            } else {
                // Ciclos que inician después del día 1: terminan en (diaInicio - 1)
                fechaFinNue = new Date(fechaInicioNue.getFullYear(), fechaInicioNue.getMonth(), diaInicioNue - 1);
                if (fechaFinNue < fechaInicioNue) {
                    fechaFinNue = new Date(fechaInicioNue.getFullYear(), fechaInicioNue.getMonth() + 1, diaInicioNue - 1);
                }
            }

            const diffNue = Math.floor((fechaFinNue - fechaInicioNue) / (1000 * 60 * 60 * 24)) + 1;

            // ============================================================
            // Calcular fechas de emisión y vencimiento
            // ============================================================
            // Para la boleta anterior: se emite según el ciclo actual
            let fechaEmisionAnt = new Date(fechaFinAnt.getFullYear(), fechaFinAnt.getMonth(), infoActual.emision);
            if (fechaEmisionAnt < fechaFinAnt) {
                fechaEmisionAnt = new Date(fechaFinAnt.getFullYear(), fechaFinAnt.getMonth() + 1, infoActual.emision);
            }

            // Vencimiento anterior:
            const diaVencAnt = infoActual.vencimiento[0];
            let fechaVencAnt = new Date(fechaEmisionAnt.getFullYear(), fechaEmisionAnt.getMonth() + infoActual.mesVenc, diaVencAnt);

            // Para la boleta nueva: se emite según el nuevo ciclo
            let fechaEmisionNue = new Date(fechaFinNue.getFullYear(), fechaFinNue.getMonth(), infoNuevo.emision);
            if (fechaEmisionNue < fechaFinNue) {
                fechaEmisionNue = new Date(fechaFinNue.getFullYear(), fechaFinNue.getMonth() + 1, infoNuevo.emision);
            }

            // Vencimiento nuevo:
            const diaVencNue = infoNuevo.vencimiento[0];
            let fechaVencNue = new Date(fechaEmisionNue.getFullYear(), fechaEmisionNue.getMonth() + infoNuevo.mesVenc, diaVencNue);

            // Reinicio del nuevo ciclo
            let fechaReinicio = new Date(fechaInicioNue.getFullYear(), fechaInicioNue.getMonth(), infoNuevo.reinicio);
            if (fechaReinicio < fechaInicioNue) {
                fechaReinicio = new Date(fechaInicioNue.getFullYear(), fechaInicioNue.getMonth() + 1, infoNuevo.reinicio);
            }

            // ============================================================
            // RENDERIZAR RESULTADOS (sin año en la interfaz)
            // ============================================================
            function fmtDM(fecha) {
                if (!fecha || isNaN(fecha)) return '—';
                const d = String(fecha.getDate()).padStart(2, '0');
                const m = String(fecha.getMonth() + 1).padStart(2, '0');
                return `${d}/${m}`;
            }

            function fmtDMY(fecha) {
                if (!fecha || isNaN(fecha)) return '—';
                const d = String(fecha.getDate()).padStart(2, '0');
                const m = String(fecha.getMonth() + 1).padStart(2, '0');
                const y = fecha.getFullYear();
                return `${d}/${m}/${y}`;
            }

            // Boleta anterior
            document.getElementById('res-ciclo-ant').textContent = actual;
            document.getElementById('res-periodo-ant').textContent = `${fmtDM(fechaInicioAnt)} → ${fmtDM(fechaFinAnt)}`;
            document.getElementById('res-dias-ant').textContent = diffAnt;
            document.getElementById('res-emision-ant').textContent = fmtDM(fechaEmisionAnt);
            document.getElementById('res-vencimiento-ant').textContent = fmtDM(fechaVencAnt);

            // Boleta nueva
            document.getElementById('res-ciclo-nue').textContent = nuevo;
            document.getElementById('res-periodo-nue').textContent = `${fmtDM(fechaInicioNue)} → ${fmtDM(fechaFinNue)}`;
            document.getElementById('res-dias-nue').textContent = diffNue;
            document.getElementById('res-emision-nue').textContent = fmtDM(fechaEmisionNue);
            document.getElementById('res-vencimiento-nue').textContent = fmtDM(fechaVencNue);
            document.getElementById('res-reinicio-nue').textContent = fmtDM(fechaReinicio);

            // ============================================================
            // GENERAR SPEECH (con año)
            // ============================================================
            const speech = `
        Su cambio de ciclo quedará aplicado desde el ${fmtDMY(fechaEfectiva)}.
        La boleta anterior considerará los consumos hasta el ${fmtDMY(fechaFinAnt)}.
        Luego, el nuevo ciclo comenzará el ${fmtDMY(fechaInicioNue)} y cubrirá el período hasta el ${fmtDMY(fechaFinNue)}.
        El vencimiento de la nueva boleta es el ${fmtDMY(fechaVencNue)}.
        `.trim();

            speechText.textContent = speech;

            // Mostrar resultados
            resultados.classList.add('show');

            // Guardar estado
            guardarEstado();
        }

        // ============================================================
        // COPIAR SPEECH
        // ============================================================
        function copiarSpeech() {
            const texto = speechText.textContent;
            if (!texto || texto === '(Realiza un cálculo para generar el speech)') {
                showToast('⚠️ No hay speech para copiar.', 'warning');
                return;
            }
            navigator.clipboard.writeText(texto).then(() => {
                btnCopySpeech.textContent = '✅ ¡Copiado!';
                btnCopySpeech.classList.add('copiado');
                setTimeout(() => {
                    btnCopySpeech.textContent = '📋 Copiar Speech';
                    btnCopySpeech.classList.remove('copiado');
                }, 2000);
                showToast('📋 Speech copiado al portapapeles.', 'success');
            }).catch(() => {
                showToast('❌ Error al copiar.', 'error');
            });
        }

        // ============================================================
        // EVENTOS
        // ============================================================
        cicloActual.addEventListener('change', () => {
            actualizarOpcionesNuevo();
            guardarEstado();
        });

        cicloNuevo.addEventListener('change', guardarEstado);
        fechaOrden.addEventListener('change', guardarEstado);

        btnCalcular.addEventListener('click', calcular);
        btnCopySpeech.addEventListener('click', copiarSpeech);

        // Enter en campos -> calcular
        fechaOrden.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') calcular();
        });

        // ============================================================
        // INICIALIZACIÓN
        // ============================================================
        cargarEstado();
        actualizarOpcionesNuevo();
        setFechaHoy();

        // Si hay datos guardados y fecha, calcular al abrir
        if (fechaOrden.value && cicloActual.value && cicloNuevo.value) {
            calcular();
        }
    </script>
</body>
</html>
