<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8"/>
    <style>
        :root {
            --bg: #0f1117;
            --surface: #161b27;
            --surface2: #1c2333;
            --surface3: #232c3f;
            --border: rgba(255,255,255,0.07);
            --border2: rgba(255,255,255,0.12);
            --text: #e2e8f0;
            --muted: #8892a4;
            --faint: #4a5568;
            --primary: #3b82f6;
            --success: #22c55e;
            --warning: #f59e0b;
            --danger: #ef4444;
            --font: 'Segoe UI', system-ui, sans-serif;
            --radius: 5px;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100%;
            overflow: hidden;
            background: var(--bg);
            font-family: var(--font);
            font-size: 13px;
            color: var(--text);
        }

        body {
            display: flex;
            flex-direction: column;
            border: 1px solid var(--border2);
            border-radius: 6px;
        }

        /* ============================================================
               HEADER (frameless + drag)
               ============================================================ */
        #hdr {
            display: flex;
            align-items: center;
            padding: 0 8px;
            height: 32px;
            flex-shrink: 0;
            background: #0d1220;
            border-bottom: 1px solid var(--border);
            border-radius: 6px 6px 0 0;
            -webkit-app-region: drag;
            user-select: none;
        }

        #hdr-title {
            flex: 1;
            font-size: 11px;
            font-weight: 700;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .hbtn {
            -webkit-app-region: no-drag;
            background: none;
            border: none;
            cursor: pointer;
            color: var(--faint);
            font-size: 12px;
            padding: 2px 6px;
            border-radius: 3px;
            transition: all 0.15s;
            font-family: var(--font);
        }

        .hbtn:hover {
            color: var(--text);
            background: rgba(255, 255, 255, 0.08);
        }

        .hbtn.danger:hover {
            color: var(--danger);
        }

        /* ============================================================
               CUERPO PRINCIPAL (scroll)
               ============================================================ */
        #main {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        #main::-webkit-scrollbar {
            width: 4px;
        }
        #main::-webkit-scrollbar-thumb {
            background: var(--faint);
            border-radius: 2px;
        }

        /* ============================================================
               ÁREA DE CARGA
               ============================================================ */
        .box {
            background: var(--surface);
            border: 1px solid var(--border2);
            border-radius: var(--radius);
            padding: 10px;
        }

        .box-desc {
            font-size: 11px;
            color: var(--muted);
            margin-bottom: 8px;
            line-height: 1.4;
        }

        .inp-area {
            width: 100%;
            height: 40px;
            background: var(--surface2);
            border: 1px dashed var(--border2);
            border-radius: 4px;
            color: var(--text);
            font-size: 11px;
            padding: 8px;
            resize: none;
            outline: none;
            font-family: var(--font);
            margin-bottom: 6px;
        }

        .inp-area:focus {
            border-color: var(--primary);
            border-style: solid;
        }

        .btn-row {
            display: flex;
            gap: 6px;
        }

        .btn-proc {
            flex: 1;
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 8px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.15s;
            font-family: var(--font);
            font-size: 12px;
        }

        .btn-proc:hover {
            background: #2563eb;
        }

        .btn-proc.secondary {
            background: var(--surface3);
            color: var(--text);
            border: 1px solid var(--border);
            flex: 0 0 auto;
            padding: 8px 16px;
        }

        .btn-proc.secondary:hover {
            background: var(--surface2);
        }

        /* ============================================================
               TABLA
               ============================================================ */
        #table-container {
            display: none;
            overflow-x: auto;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 6px;
        }

        #table-container.show {
            display: block;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 11px;
        }

        th,
        td {
            border: 1px solid var(--border);
            padding: 6px 4px;
            text-align: center;
        }

        th {
            background: var(--surface2);
            color: var(--muted);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 9px;
        }

        td {
            color: var(--text);
        }

        .hoy {
            background: rgba(59, 130, 246, 0.15);
            border: 1px solid var(--primary);
        }

        .badge-hoy {
            background: var(--primary);
            color: #fff;
            font-size: 8px;
            padding: 1px 4px;
            border-radius: 3px;
            display: inline-block;
            margin-top: 2px;
            font-weight: bold;
        }

        .empty-msg {
            text-align: center;
            color: var(--faint);
            padding: 20px 0;
            font-size: 12px;
        }

        /* ============================================================
               TOAST
               ============================================================ */
        #toast-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: none;
        }

        .toast {
            pointer-events: auto;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            color: #fff;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
            animation: toastIn 0.3s ease-out;
            max-width: 320px;
        }

        .toast.success {
            background: var(--success);
        }
        .toast.warning {
            background: var(--warning);
            color: #000;
        }
        .toast.error {
            background: var(--danger);
        }
        .toast.info {
            background: var(--primary);
        }

        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

    <!-- ============================================================
    HEADER
    ============================================================ -->
    <div id="hdr">
        <span id="hdr-title">📅 Horario Semanal</span>
        <button class="hbtn" onclick="ipcRenderer.send('close-tool','horario')">✕</button>
    </div>

    <!-- ============================================================
    CUERPO PRINCIPAL
    ============================================================ -->
    <div id="main">

        <!-- Área de carga -->
        <div class="box">
            <div class="box-desc">Pega aquí las filas de tu horario semanal copiadas directamente desde Excel:</div>
            <textarea class="inp-area" id="raw-tsv" placeholder="Ej: 25-ABRIL-2026	12:30	14:45..."></textarea>
            <div class="btn-row">
                <button class="btn-proc" id="btn-procesar">📥 Cargar Horario</button>
                <button class="btn-proc secondary" id="btn-limpiar">🗑 Limpiar</button>
            </div>
        </div>

        <!-- Tabla de horario -->
        <div id="table-container">
            <table id="horario-tb">
                <thead>
                    <tr>
                        <th>Día</th>
                        <th>Entrada</th>
                        <th>B1</th>
                        <th>Colación</th>
                        <th>B2</th>
                        <th>Salida</th>
                    </tr>
                </thead>
                <tbody id="tb-body">
                    <tr>
                        <td colspan="6" class="empty-msg">No hay horario cargado.</td>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>

    <!-- ============================================================
    TOAST CONTAINER
    ============================================================ -->
    <div id="toast-container"></div>

    <!-- ============================================================
    SCRIPT
    ============================================================ -->
    <script>
        const { ipcRenderer } = require('electron');

        function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }

        // ============================================================
        // REFERENCIAS DOM
        // ============================================================
        const rawInput = document.getElementById('raw-tsv');
        const btnProcesar = document.getElementById('btn-procesar');
        const btnLimpiar = document.getElementById('btn-limpiar');
        const tableContainer = document.getElementById('table-container');
        const tbody = document.getElementById('tb-body');

        // ============================================================
        // TOAST
        // ============================================================
        function showToast(msg, tipo = 'success', duracion = 2500) {
            const container = document.getElementById('toast-container');
            const el = document.createElement('div');
            el.className = 'toast ' + tipo;
            el.textContent = msg;
            container.appendChild(el);
            setTimeout(() => {
                el.style.opacity = '0';
                el.style.transform = 'translateY(10px)';
                el.style.transition = 'opacity 0.3s, transform 0.3s';
                setTimeout(() => el.remove(), 400);
            }, duracion);
        }

        // ============================================================
        // PROCESAR
        // ============================================================
        function procesar() {
            const raw = rawInput.value;
            if (!raw.trim()) {
                showToast('⚠️ No hay texto para procesar.', 'warning');
                return;
            }

            const data = {};
            const filas = raw.split('\n');

            const meses = {
                'ENERO': '01',
                'FEBRERO': '02',
                'MARZO': '03',
                'ABRIL': '04',
                'MAYO': '05',
                'JUNIO': '06',
                'JULIO': '07',
                'AGOSTO': '08',
                'SEPTIEMBRE': '09',
                'OCTUBRE': '10',
                'NOVIEMBRE': '11',
                'DICIEMBRE': '12'
            };
            const diasSemana = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];

            const fInp = (val) => {
                if (!val) return '-';
                const v = val.trim();
                return (v === '--' || v === '-') ? '-' : v;
            };

            let filasValidas = 0;

            filas.forEach(fila => {
                const rawCols = fila.split('\t').map(c => c.trim());
                const dateIndex = rawCols.findIndex(c => /^\d{2}-[A-Z]+-\d{4}/i.test(c));
                if (dateIndex !== -1) {
                    const cols = rawCols.slice(dateIndex);
                    if (cols.length >= 11) {
                        const partesFecha = cols[0].split('-');
                        if (partesFecha.length === 3) {
                            const dia = partesFecha[0].padStart(2, '0');
                            const mesStr = partesFecha[1].toUpperCase();
                            const anio = partesFecha[2];
                            const mesNum = meses[mesStr];
                            if (mesNum) {
                                const fechaIso = `${anio}-${mesNum}-${dia}`;
                                const dt = new Date(`${fechaIso}T12:00:00`);
                                const diaSemanaStr = diasSemana[dt.getDay()];
                                const mesCorto = mesStr.substring(0, 3);
                                const diaStr =
                                    `${diaSemanaStr} ${dia} ${mesCorto.charAt(0) + mesCorto.slice(1).toLowerCase()}`;

                                const inicio = fInp(cols[1]);
                                const b1s = fInp(cols[2]);
                                const b1e = fInp(cols[3]);
                                const ls = fInp(cols[4]);
                                let le = fInp(cols[5]);
                                if (cols[7] && cols[7] !== '' && cols[7] !== '--' && cols[7] !== '-') {
                                    le = fInp(cols[7]);
                                }
                                const b2s = fInp(cols[8]);
                                const b2e = fInp(cols[9]);
                                const fin = fInp(cols[10]);

                                data[fechaIso] = {
                                    diaStr: diaStr,
                                    inicio: inicio,
                                    b1: (b1s === '-' && b1e === '-') ? '-' : `${b1s}–${b1e}`,
                                    lunch: (ls === '-' && le === '-') ? '-' : `${ls}–${le}`,
                                    b2: (b2s === '-' && b2e === '-') ? '-' : `${b2s}–${b2e}`,
                                    fin: fin
                                };
                                filasValidas++;
                            }
                        }
                    }
                }
            });

            if (filasValidas === 0) {
                showToast('⚠️ No se encontraron filas válidas. Revisa el formato.', 'warning');
                return;
            }

            // Guardar y renderizar
            ipcRenderer.send('save-horario', { horario: data });
            renderTable(data);
            rawInput.value = '';
            showToast(`✅ Horario cargado: ${filasValidas} días.`, 'success');
        }

        // ============================================================
        // RENDERIZAR TABLA
        // ============================================================
        function renderTable(data) {
            tbody.innerHTML = '';

            const hoyObj = new Date();
            const year = hoyObj.getFullYear();
            const month = String(hoyObj.getMonth() + 1).padStart(2, '0');
            const day = String(hoyObj.getDate()).padStart(2, '0');
            const hoyStr = `${year}-${month}-${day}`;

            const keys = Object.keys(data).sort();
            if (keys.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="empty-msg">No hay horario cargado.</td></tr>`;
                tableContainer.classList.remove('show');
                return;
            }

            keys.forEach(fecha => {
                const d = data[fecha];
                // Fallback: datos guardados con formato anterior no traen diaStr
                let diaStr = d.diaStr;
                if (!diaStr) {
                    const p = fecha.split('-');
                    const diasSemanaF = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
                    const mesNombres = ['', 'Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'];
                    const dt = new Date(`${fecha}T12:00:00`);
                    diaStr = `${diasSemanaF[dt.getDay()]} ${parseInt(p[2], 10)} ${mesNombres[parseInt(p[1], 10)] || p[1]}`;
                }
                const isHoy = fecha === hoyStr;
                const tr = document.createElement('tr');
                if (isHoy) tr.className = 'hoy';
                tr.innerHTML = `
                    <td><b>${esc(diaStr)}</b>${isHoy ? '<br><span class="badge-hoy">HOY</span>' : ''}</td>
                    <td>${d.inicio === '-' ? '--' : esc(d.inicio)}</td>
                    <td>${d.b1 === '-' ? '--' : esc(d.b1.split('–')[0])}</td>
                    <td>${d.lunch === '-' ? '--' : esc(d.lunch.split('–')[0])}</td>
                    <td>${d.b2 === '-' ? '--' : esc(d.b2.split('–')[0])}</td>
                    <td>${d.fin === '-' ? '--' : esc(d.fin)}</td>
                `;
                tbody.appendChild(tr);
            });

            tableContainer.classList.add('show');
        }

        // ============================================================
        // LIMPIAR
        // ============================================================
        function limpiar() {
            rawInput.value = '';
            tbody.innerHTML = `<tr><td colspan="6" class="empty-msg">No hay horario cargado.</td></tr>`;
            tableContainer.classList.remove('show');
            // También limpiar en el almacenamiento
            ipcRenderer.send('save-horario', { horario: {} });
            showToast('🗑 Horario limpiado.', 'info');
        }

        // ============================================================
        // EVENTOS
        // ============================================================
        btnProcesar.addEventListener('click', procesar);
        btnLimpiar.addEventListener('click', limpiar);

        // Enter en el textarea para procesar
        rawInput.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.key === 'Enter') {
                e.preventDefault();
                procesar();
            }
        });

        // ============================================================
        // INIT (IPC)
        // ============================================================
        ipcRenderer.on('init-horario', (e, data) => {
            if (data && Object.keys(data).length > 0) {
                renderTable(data);
            } else {
                tbody.innerHTML = `<tr><td colspan="6" class="empty-msg">No hay horario cargado.</td></tr>`;
                tableContainer.classList.remove('show');
            }
        });

        // ============================================================
        // INICIO
        // ============================================================
        showToast('📅 Horario listo. Pega tus datos desde Excel.', 'info', 2000);
    </script>
</body>
</html>
