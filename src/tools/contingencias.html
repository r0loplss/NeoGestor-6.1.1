<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <title>Radar de Contingencias PRO</title>
    <style>
        /* ============================================================
               ROOT – Tema oscuro consistente con la app
               ============================================================ */
        :root {
            --bg: #0f1117;
            --surface: #161b27;
            --surface2: #1c2333;
            --surface3: #232c3f;
            --border: rgba(255, 255, 255, 0.07);
            --border2: rgba(255, 255, 255, 0.12);
            --text: #e2e8f0;
            --muted: #8892a4;
            --faint: #4a5568;
            --primary: #3b82f6;
            --success: #22c55e;
            --warning: #f59e0b;
            --danger: #ef4444;
            --font: 'Segoe UI', system-ui, sans-serif;
            --radius: 5px;
        }

        /* ============================================================
               RESET Y ESTRUCTURA BASE
               ============================================================ */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
            background: var(--bg);
            font-family: var(--font);
            font-size: 13px;
            color: var(--text);
        }

        body {
            display: flex;
            flex-direction: column;
            border: 1px solid var(--border2);
            border-radius: 6px;
        }

        /* ============================================================
               HEADER (frameless + drag)
               ============================================================ */
        #hdr {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 0 8px;
            height: 32px;
            flex-shrink: 0;
            background: #0d1220;
            border-bottom: 1px solid var(--border);
            border-radius: 6px 6px 0 0;
            -webkit-app-region: drag;
            user-select: none;
        }

        #hdr-title {
            flex: 1;
            min-width: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-size: 11px;
            font-weight: 700;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .hbtn {
            -webkit-app-region: no-drag;
            background: none;
            border: none;
            cursor: pointer;
            color: var(--faint);
            font-size: 12px;
            padding: 2px 6px;
            border-radius: 3px;
            transition: all 0.15s;
            font-family: var(--font);
        }

        .hbtn:hover {
            color: var(--text);
            background: rgba(255, 255, 255, 0.08);
        }

        .hbtn.danger:hover {
            color: var(--danger);
        }

        /* ============================================================
               TOOLBAR
               ============================================================ */
        #toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            padding: 8px 12px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            flex-shrink: 0;
            align-items: center;
        }

        #toolbar .status {
            font-size: 11px;
            color: var(--muted);
            flex: 1;
        }

        #toolbar .status b {
            color: var(--text);
        }

        .tb-btn {
            padding: 5px 14px;
            background: var(--surface3);
            border: 1px solid var(--border);
            border-radius: 5px;
            color: var(--text);
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            font-family: var(--font);
            transition: all 0.15s;
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .tb-btn:hover {
            background: var(--surface2);
            border-color: var(--primary);
        }

        .tb-btn.copy-det {
            background: rgba(59, 130, 246, 0.15);
            border-color: var(--primary);
            color: #bfdbfe;
        }
        .tb-btn.copy-det:hover {
            background: rgba(59, 130, 246, 0.3);
            box-shadow: 0 2px 8px rgba(59, 130, 246, 0.35);
        }
        .tb-btn.copy-breve {
            background: rgba(34, 197, 94, 0.12);
            border-color: var(--success);
            color: #86efac;
        }
        .tb-btn.copy-breve:hover {
            background: rgba(34, 197, 94, 0.22);
            box-shadow: 0 2px 8px rgba(34, 197, 94, 0.3);
        }
        .tb-btn.copy-breve .dropdown-arrow {
            font-size: 8px;
            margin-left: 2px;
            opacity: 0.8;
            transition: transform 0.2s ease;
            pointer-events: none;
        }
        .dropdown-wrapper.open .tb-btn.copy-breve .dropdown-arrow {
            transform: rotate(180deg);
        }
        .dropdown-wrapper {
            position: relative;
            display: inline-flex;
        }
        .dropdown-menu {
            position: absolute;
            top: calc(100% + 5px);
            right: 0;
            min-width: 185px;
            background: #151d30;
            border: 1px solid var(--border);
            border-radius: 7px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.6), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
            padding: 5px;
            display: none;
            flex-direction: column;
            gap: 3px;
            z-index: 1000;
        }
        .dropdown-wrapper.open .dropdown-menu {
            display: flex;
            animation: dropdownIn 0.15s ease-out forwards;
        }
        @keyframes dropdownIn {
            from {
                opacity: 0;
                transform: translateY(-4px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        .dropdown-item {
            display: flex;
            align-items: center;
            gap: 9px;
            width: 100%;
            padding: 6px 9px;
            background: transparent;
            border: 1px solid transparent;
            border-radius: 5px;
            color: var(--text);
            font-size: 11.5px;
            text-align: left;
            cursor: pointer;
            transition: all 0.15s ease;
            font-family: var(--font);
            user-select: none;
        }
        .dropdown-item:hover {
            background: rgba(34, 197, 94, 0.15);
            border-color: rgba(34, 197, 94, 0.35);
            color: #86efac;
        }
        .dropdown-item-icon {
            font-size: 13px;
            flex-shrink: 0;
            line-height: 1;
        }
        .dropdown-item-text {
            display: flex;
            flex-direction: column;
            gap: 1px;
            min-width: 0;
        }
        .dropdown-item-title {
            font-weight: 600;
            font-size: 11.5px;
            line-height: 1.2;
        }
        .dropdown-item-desc {
            font-size: 10px;
            color: var(--muted);
            line-height: 1.1;
        }
        .dropdown-item:hover .dropdown-item-desc {
            color: #a7f3d0;
        }
        .tb-btn.danger {
            background: transparent;
            color: var(--danger);
            border: 1px solid rgba(239, 68, 68, 0.35);
        }
        .tb-btn.danger:hover {
            color: var(--danger);
            border-color: var(--danger);
            background: rgba(239, 68, 68, 0.12);
        }

        /* ============================================================
               CUERPO PRINCIPAL (scroll)
               ============================================================ */
        #main {
            flex: 1;
            overflow-y: auto;
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        ::-webkit-scrollbar {
            width: 9px;
            height: 9px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--faint);
            border-radius: 5px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--muted);
        }

        #main::-webkit-scrollbar {
            width: 9px;
            height: 9px;
        }
        #main::-webkit-scrollbar-thumb {
            background: var(--faint);
            border-radius: 5px;
        }
        #main::-webkit-scrollbar-thumb:hover {
            background: var(--muted);
        }

        /* ============================================================
               ÁREA DE CARGA DE TEXTO
               ============================================================ */
        .input-area {
            background: var(--surface);
            border: 1px dashed var(--border2);
            border-radius: 8px;
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-area .input-hdr {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .input-area .input-title {
            font-size: 12px;
            font-weight: 700;
            color: var(--text);
            letter-spacing: 0.2px;
        }

        .input-area .input-sub {
            font-size: 10px;
            color: var(--muted);
            margin-top: 1px;
        }

        .input-area textarea {
            width: 100%;
            min-height: 80px;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            font-size: 12px;
            font-family: var(--font);
            padding: 8px 10px;
            resize: vertical;
            outline: none;
            line-height: 1.5;
        }

        .input-area textarea:focus {
            border-color: var(--primary);
            background: var(--surface3);
        }

        .input-area .btn-row {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .input-area .btn-row .btn {
            padding: 6px 16px;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            font-size: 12px;
            font-family: var(--font);
            transition: all 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .input-area .btn-row .btn:hover {
            background: #2563eb;
            box-shadow: 0 2px 8px rgba(59, 130, 246, 0.35);
        }

        .input-area .btn-row .btn.secondary {
            background: var(--surface3);
            color: var(--text);
            border: 1px solid var(--border);
        }

        .input-area .btn-row .btn.secondary:hover {
            background: var(--surface2);
            box-shadow: none;
        }

        /* ============================================================
               LISTA DE CONTINGENCIAS
               ============================================================ */
        .empty-state {
            text-align: center;
            color: var(--faint);
            font-size: 13px;
            padding: 30px 0;
            border: 1px dashed var(--border2);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.01);
        }

        .c-card {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px 12px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            transition: border-color 0.15s, background 0.15s;
            border-left: 3px solid rgba(245, 158, 11, 0.6);
        }

        .c-card:hover {
            border-color: var(--border2);
            border-left-color: var(--warning);
            background: var(--surface3);
        }

        .c-card .c-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }

        .c-card .c-row .c-zona {
            font-size: 12px;
            font-weight: 700;
            color: var(--warning);
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .c-card .c-row .c-id {
            font-size: 11px;
            color: var(--text);
            cursor: pointer;
            padding: 2px 8px;
            border-radius: 4px;
            transition: 0.15s;
            background: rgba(255, 255, 255, 0.04);
            font-family: 'Consolas', 'Courier New', monospace;
            border: 1px solid var(--border);
        }

        .c-card .c-row .c-id:hover {
            background: rgba(59, 130, 246, 0.15);
            color: var(--primary);
            border-color: var(--primary);
        }

        .c-card .c-actions {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .c-card .c-btn-edit {
            background: none;
            border: none;
            color: var(--muted);
            cursor: pointer;
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 4px;
            transition: 0.15s;
        }

        .c-card .c-btn-edit:hover {
            color: var(--primary);
            background: rgba(59, 130, 246, 0.15);
        }

        .c-card .c-row .c-del {
            background: none;
            border: none;
            color: var(--faint);
            cursor: pointer;
            font-size: 13px;
            padding: 2px 6px;
            border-radius: 4px;
            transition: 0.15s;
        }

        .c-card .c-row .c-del:hover {
            color: var(--danger);
            background: rgba(239, 68, 68, 0.12);
        }

        .c-card .c-detalle {
            font-size: 11.5px;
            color: #f1f5f9;
            line-height: 1.45;
            background: rgba(0, 0, 0, 0.22);
            border-left: 2px solid var(--primary);
            padding: 5px 8px;
            border-radius: 0 4px 4px 0;
            margin-top: 2px;
            word-break: break-word;
        }

        .c-card .c-meta {
            font-size: 10px;
            color: var(--faint);
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        .c-card .c-meta .c-pops {
            color: var(--muted);
            background: rgba(34, 197, 94, 0.08);
            padding: 2px 8px;
            border-radius: 4px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            border: 1px solid rgba(34, 197, 94, 0.15);
        }

        .c-card .c-meta .c-inc {
            color: #cbd5e1;
            background: rgba(255, 255, 255, 0.05);
            padding: 2px 8px;
            border-radius: 4px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            border: 1px solid var(--border);
            font-family: 'Consolas', monospace;
        }

        .c-card .c-meta .c-contexto {
            color: var(--primary);
            font-style: italic;
            background: rgba(59, 130, 246, 0.08);
            padding: 2px 8px;
            border-radius: 4px;
            border: 1px solid rgba(59, 130, 246, 0.15);
        }

        /* ============================================================
               MODAL EDICIÓN CONTINGENCIA
               ============================================================ */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(2px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 14px;
        }
        .modal-overlay.show { display: flex; }
        .modal-box {
            background: var(--surface);
            border: 1px solid var(--border2);
            border-radius: 8px;
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 14px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            animation: modalIn 0.2s ease-out;
        }
        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        .modal-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12.5px;
            font-weight: 700;
            color: var(--text);
            border-bottom: 1px solid var(--border);
            padding-bottom: 6px;
        }
        .modal-title .close-modal {
            background: none;
            border: none;
            color: var(--faint);
            font-size: 13px;
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 3px;
        }
        .modal-title .close-modal:hover {
            color: var(--danger);
            background: rgba(239, 68, 68, 0.12);
        }
        .modal-field {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }
        .modal-field label {
            font-size: 10.5px;
            color: var(--muted);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        .modal-field input, .modal-field textarea, .modal-field select {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 5px;
            color: var(--text);
            font-size: 12px;
            font-family: var(--font);
            padding: 6px 8px;
            outline: none;
            transition: border-color 0.15s;
        }
        .modal-field textarea {
            min-height: 80px;
            resize: vertical;
            line-height: 1.4;
        }
        .modal-field input:focus, .modal-field textarea:focus {
            border-color: var(--primary);
            background: var(--surface3);
        }
        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 6px;
        }

        /* ============================================================
               TOAST
               ============================================================ */
        #toast-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: none;
        }

        .toast {
            pointer-events: auto;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            color: #fff;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
            animation: toastIn 0.3s ease-out;
            max-width: 320px;
        }

        .toast.success {
            background: var(--success);
        }
        .toast.warning {
            background: var(--warning);
            color: #000;
        }
        .toast.error {
            background: var(--danger);
        }

        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ============================================================
               FILTROS / BÚSQUEDA / ORDEN
               ============================================================ */
        #filters {
            display: none;
            flex-direction: column;
            gap: 6px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px 10px;
            flex-shrink: 0;
        }
        #filters.visible { display: flex; }
        .chips { display: flex; flex-wrap: wrap; gap: 5px; }
        .chip {
            display: inline-flex; align-items: center; gap: 4px;
            padding: 3px 9px; border-radius: 999px;
            border: 1px solid var(--border); background: var(--surface2);
            color: var(--muted); font-size: 10.5px; font-weight: 600;
            cursor: pointer; transition: all .15s; user-select: none;
        }
        .chip:hover { border-color: var(--border2); color: var(--text); }
        .chip.active { color: #fff; border-color: transparent; }
        .chip[data-tipo="all"].active { background: var(--primary); }
        .chip[data-tipo="red"].active { background: #16a34a; }
        .chip[data-tipo="nacional"].active { background: #2563eb; }
        .chip[data-tipo="sistemas"].active { background: #9333ea; }
        .chip[data-tipo="otro"].active { background: #64748b; }
        .chip .chip-n { opacity: .85; font-weight: 700; }
        .filters-row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
        .filters-row input[type="text"] {
            flex: 1; min-width: 110px; background: var(--surface2);
            border: 1px solid var(--border); border-radius: 6px; color: var(--text);
            font-size: 11.5px; padding: 5px 8px; outline: none; font-family: var(--font);
        }
        .filters-row input[type="text"]:focus { border-color: var(--primary); background: var(--surface3); }
        .filters-row select {
            background: var(--surface2); border: 1px solid var(--border); border-radius: 6px;
            color: var(--text); font-size: 11px; padding: 5px 6px; outline: none; font-family: var(--font);
        }
        .mini-check {
            display: inline-flex; align-items: center; gap: 4px; font-size: 10.5px;
            color: var(--muted); cursor: pointer; white-space: nowrap; user-select: none;
        }
        .modo-check {
            display: inline-flex; align-items: center; gap: 5px; font-size: 11px;
            color: var(--muted); cursor: pointer; user-select: none; padding: 6px 4px;
        }
        .modo-check input { accent-color: var(--primary); }

        /* ============================================================
               TIPO / ESTADO en tarjetas
               ============================================================ */
        .c-card .c-top { display: flex; align-items: center; gap: 6px; }
        .c-check { width: 13px; height: 13px; accent-color: var(--primary); cursor: pointer; flex-shrink: 0; }
        .c-tags { display: inline-flex; align-items: center; gap: 5px; flex-wrap: wrap; }
        .tipo-chip {
            display: inline-flex; align-items: center; gap: 3px; padding: 2px 8px;
            border-radius: 999px; font-size: 10px; font-weight: 700; cursor: pointer;
            border: 1px solid transparent; transition: all .15s; user-select: none; white-space: nowrap;
        }
        .tipo-chip:hover { filter: brightness(1.22); }
        .tipo-chip[data-tipo="red"] { background: rgba(34,197,94,.16); color: #86efac; border-color: rgba(34,197,94,.35); }
        .tipo-chip[data-tipo="nacional"] { background: rgba(59,130,246,.16); color: #bfdbfe; border-color: rgba(59,130,246,.35); }
        .tipo-chip[data-tipo="sistemas"] { background: rgba(168,85,247,.16); color: #e9d5ff; border-color: rgba(168,85,247,.35); }
        .tipo-chip[data-tipo="otro"] { background: rgba(148,163,184,.14); color: #cbd5e1; border-color: rgba(148,163,184,.3); }
        .tipo-chip .auto-dot { opacity: .5; font-size: 8px; }
        .estado-chip {
            display: inline-flex; align-items: center; gap: 3px; padding: 2px 8px;
            border-radius: 999px; font-size: 10px; font-weight: 600; cursor: pointer;
            border: 1px solid var(--border); background: var(--surface3); color: var(--muted); user-select: none; white-space: nowrap;
        }
        .estado-chip[data-estado="activo"] { color: #fca5a5; border-color: rgba(239,68,68,.35); background: rgba(239,68,68,.08); }
        .estado-chip[data-estado="curso"] { color: #fcd34d; border-color: rgba(245,158,11,.35); background: rgba(245,158,11,.08); }
        .estado-chip[data-estado="normalizado"] { color: #86efac; border-color: rgba(34,197,94,.35); background: rgba(34,197,94,.08); }
        .c-card.normalizada { opacity: .6; }
        .c-card.normalizada .c-zona { text-decoration: line-through; text-decoration-color: rgba(255,255,255,.4); }
        .c-card.selected { border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary) inset; }
        .warn-parse { color: var(--warning); cursor: help; font-size: 11px; }
        .c-card [contenteditable="true"].inline-edit { outline: 1px dashed var(--primary); border-radius: 3px; padding: 1px 3px; background: rgba(59,130,246,.08); }

        /* ============================================================
               BARRA DE ACCIONES EN LOTE
               ============================================================ */
        #bulkbar {
            display: none; align-items: center; gap: 6px; flex-wrap: wrap;
            background: rgba(59,130,246,.1); border: 1px solid rgba(59,130,246,.35);
            border-radius: 8px; padding: 6px 10px; flex-shrink: 0;
        }
        #bulkbar.visible { display: flex; }
