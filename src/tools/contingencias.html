    <!-- ============================================================
    SCRIPT
    ============================================================ -->
    <script>
        const { ipcRenderer } = require('electron');

        function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }

        // ============================================================
        // TIPOS / ESTADOS
        // ============================================================
        const TIPOS = {
            red:      { label: 'Red',      icon: '🛰️', color: 'rgba(34,197,94,.75)' },
            nacional: { label: 'Nacional', icon: '🏛️', color: 'rgba(59,130,246,.75)' },
            sistemas: { label: 'Sistemas', icon: '🔌', color: 'rgba(168,85,247,.75)' },
            otro:     { label: 'Otro',     icon: '⚪', color: 'rgba(148,163,184,.65)' }
        };
        const ORDEN_TIPOS = { red: 0, nacional: 1, sistemas: 2, otro: 3 };
        const ESTADOS = { activo: 'Activo', curso: 'En curso', normalizado: 'Normalizado' };
        const ZONA_NACIONAL = ['Desconocida', 'Nacional', 'A-Nacional', 'Varias', ''];

        // ============================================================
        // ESTADO
        // ============================================================
        let contingencias = [];
        let overrides = {};          // { [id]: { tipo, tipoManual, estado } } — correcciones del usuario
        let undoStack = [];          // snapshots (JSON) para deshacer
        let filtroTipo = 'all';
        let textoBusqueda = '';
        let sortBy = 'fecha-desc';
        let ocultarNorm = false;
        let seleccionados = new Set();

        // ============================================================
        // REFERENCIAS DOM
        // ============================================================
        const rawInput = document.getElementById('raw-input');
        const btnProcesar = document.getElementById('btn-procesar');
        const btnLimpiarInput = document.getElementById('btn-limpiar-input');
        const btnLimpiarTodo = document.getElementById('btn-limpiar-todo');
        const btnLimpiar = document.getElementById('btn-limpiar');
        const btnCopyDet = document.getElementById('btn-copy-det');
        const btnCopyBreve = document.getElementById('btn-copy-breve');
        const dropdownBreveWrapper = document.getElementById('dropdown-breve-wrapper');
        const btnCopyBreveAZ = document.getElementById('btn-copy-breve-az');
        const btnCopyBreveFecha = document.getElementById('btn-copy-breve-fecha');
        const listContainer = document.getElementById('list-container');
        const countActives = document.getElementById('count-actives');
        const filtersBox = document.getElementById('filters');
        const filterChips = document.getElementById('filter-chips');
        const searchRadar = document.getElementById('search-radar');
        const sortSelect = document.getElementById('sort-select');
        const chkOcultarNorm = document.getElementById('chk-ocultar-norm');
        const chkMerge = document.getElementById('chk-merge');
        const bulkbar = document.getElementById('bulkbar');
        const bulkCount = document.getElementById('bulk-count');
        const btnUndo = document.getElementById('btn-undo');

        // ============================================================
        // CLASIFICACIÓN (tipo) + ESTADO helpers
        // ============================================================
        function esZonaComuna(zona) {
            const z = (zona || '').trim();
            return !!z && !ZONA_NACIONAL.includes(z);
        }
        function inferirTipo(c) {
            const zona = (c && c.zona) || '';
            const det = ((c && c.detalle) || '').toLowerCase();
            const sistemico = /(sistema de atenci|\bota\b|delivery|despacho|recaudaci|sitio web|\bapp\b|comercial|\bcrm\b|portal|facturaci|pago en l[íi]nea)/.test(det);
            const redKeyword = /(ca[íi]da de sitios|saturaci|degradaci|p[eé]rdida de conectividad|\bnodo\b|\bpop\b|\bolt\b|sitios|antena|cobertura)/.test(det);
            if (esZonaComuna(zona)) return 'red';
            if (redKeyword) return 'red';
            if (sistemico) return 'sistemas';
            return 'nacional';
        }
        function tipoEfectivo(c) {
            if (c && c.tipo && TIPOS[c.tipo]) return c.tipo;
            return inferirTipo(c);
        }
        function estadoEfectivo(c) {
            return (c && ESTADOS[c.estado]) ? c.estado : 'activo';
        }
        function clasificacionDudosa(c) {
            if (!c || c.tipoManual) return false;
            const zona = (c.zona || '').trim();
            const det = (c.detalle || '').toLowerCase();
            const redKeyword = /(ca[íi]da de sitios|saturaci|degradaci|p[eé]rdida de conectividad|\bnodo\b|\bpop\b|\bolt\b|sitios|antena|cobertura)/.test(det);
            if (!esZonaComuna(zona) && redKeyword) return true;   // dice Nacional pero el detalle parece red
            if (!zona || zona === 'Desconocida') return true;      // sin zona clara
            return false;
        }
        function guardarOverrides() {
            try { ipcRenderer.send('save-contingencias-overrides', overrides); } catch (e) {}
        }
        function aplicarOverrides() {
            contingencias.forEach(c => {
                if (!c.tipo || !TIPOS[c.tipo]) { if (!c.tipoManual) c.tipo = inferirTipo(c); }
                if (!ESTADOS[c.estado]) c.estado = 'activo';
                const o = overrides[c.id];
                if (o) {
                    if (o.tipo && TIPOS[o.tipo]) { c.tipo = o.tipo; c.tipoManual = true; }
                    if (o.estado && ESTADOS[o.estado]) c.estado = o.estado;
                }
            });
        }

        // ============================================================
        // UNDO
        // ============================================================
        function pushUndo() {
            undoStack.push(JSON.stringify({ c: contingencias, o: overrides }));
            if (undoStack.length > 40) undoStack.shift();
            actualizarUndoUI();
        }
        function actualizarUndoUI() {
            if (btnUndo) btnUndo.disabled = undoStack.length === 0;
        }
        function deshacer() {
            if (!undoStack.length) { showToast('Nada para deshacer.', 'warning'); return; }
            let snap = null;
            try { snap = JSON.parse(undoStack.pop()); } catch (e) { return; }
            if (Array.isArray(snap)) { contingencias = snap; }
            else if (snap && Array.isArray(snap.c)) {
                contingencias = snap.c;
                if (snap.o && typeof snap.o === 'object') overrides = snap.o;
            }
            seleccionados.clear();
            guardarOverrides(); guardarYNotificar(); actualizarUI();
            showToast('↶ Cambio deshecho.', 'success');
                actualizarUndoUI();
        }

        // ============================================================
        // TOAST
        // ============================================================
        function showToast(msg, tipo = 'success', duracion = 2500) {
            const container = document.getElementById('toast-container');
            const el = document.createElement('div');
            el.className = 'toast ' + tipo;
            el.textContent = msg;
            container.appendChild(el);
            setTimeout(() => {
                el.style.opacity = '0';
                el.style.transform = 'translateY(10px)';
                el.style.transition = 'opacity 0.3s, transform 0.3s';
                setTimeout(() => el.remove(), 400);
            }, duracion);
        }

        // ============================================================
        // FUNCIÓN ROBUSTA PARA PARSEAR FECHAS
        // ============================================================
        function parseFechaContingencia(fechaStr) {
            if (!fechaStr || typeof fechaStr !== 'string') return null;
            const match = fechaStr.trim().match(/(\d{1,2})[/-](\d{1,2})[/-](\d{4})(?:\s+(\d{1,2}):(\d{2})(?::(\d{2}))?)?/);
            if (!match) return null;

            const dia = parseInt(match[1], 10);
            const mes = parseInt(match[2], 10) - 1;
            const anio = parseInt(match[3], 10);
            const horas = match[4] ? parseInt(match[4], 10) : 0;
            const minutos = match[5] ? parseInt(match[5], 10) : 0;
            const segundos = match[6] ? parseInt(match[6], 10) : 0;

            if (isNaN(dia) || isNaN(mes) || isNaN(anio)) return null;
            return new Date(anio, mes, dia, horas, minutos, segundos);
        }

        function formatearFechaDisplay(fechaObj, originalStr) {
            if (!fechaObj || isNaN(fechaObj.getTime())) return originalStr || 'Fecha no especificada';
            const dia = String(fechaObj.getDate()).padStart(2, '0');
            const mes = String(fechaObj.getMonth() + 1).padStart(2, '0');
            const anio = fechaObj.getFullYear();
            const hora = String(fechaObj.getHours()).padStart(2, '0');
            const min = String(fechaObj.getMinutes()).padStart(2, '0');
            return `${dia}-${mes}-${anio} ${hora}:${min}`;
        }

        function calcularDiasTranscurridos(fechaObj) {
            if (!fechaObj || isNaN(fechaObj.getTime())) return '00 días';
            const ahora = new Date();
            const diffMs = ahora.getTime() - fechaObj.getTime();
            const dias = Math.max(0, Math.floor(diffMs / (1000 * 60 * 60 * 24)));
            if (dias === 1) return '01 día';
            return String(dias).padStart(2, '0') + ' días';
        }

        // ============================================================
        // FUNCIONES DE PROCESAMIENTO Y PARSER INTELIGENTE
        // ============================================================

        function limpiarZona(zonaRaw) {
            if (!zonaRaw || typeof zonaRaw !== 'string') return 'Nacional';
            let z = zonaRaw.trim();

            // 1. Quitar prefijo "A-" (ej: "A-Nacional" -> "Nacional")
            z = z.replace(/^A\s*[-–]\s*/i, '');

            // 2. Normalizar Nacional / Cobertura general
            if (/^(?:nacional|a-nacional|todo\s+el\s+pa[íi]s|pa[íi]s|chile)$/i.test(z)) {
                return 'Nacional';
            }

            // 3. Quitar prefijos como "Comuna:", "Sector:", "Zona:", "Localidad:", "Distrito:", "Ciudad:"
            z = z.replace(/^(?:comunas?|sectores?|zonas?|localidades?|distritos?|ciudades?)\s*[:—–-]\s*/i, '');

            // 4. Si es placeholder genérico "XX", "N/A", "Desconocida", "Sin comuna", "Varias", "Por definir" -> "Nacional"
            if (/^(?:xx|n\/?a|desconocida|sin\s+comuna|por\s+definir|\?+)$/i.test(z)) {
                return 'Nacional';
            }

            // 5. Quitar sufijos de región como ", XIV Región", ", RM", ", III R", ", V Región", ", Región Metropolitana", etc.
            z = z.replace(/[,\s-]+(?:\b[IVXLCDM]+\b(?:\s*R\b|\s*Regi[oó]n\b)?|\bRM\b|\bRegi[oó]n\s+Metropolitana\b|\bR\.?M\.?\b|\bRegi[oó]n\b).*$/i, '');

            // 6. Quitar códigos de POP/sitio pegados al final (ej: "Curanilahue GVB013" -> "Curanilahue")
            z = z.replace(/\s+[A-Z]{2,3}[0-9]{1,4}\b.*$/i, '');

            // 7. Quitar paréntesis o acotaciones secundarias
            z = z.replace(/\s*\([^)]*\)/g, '');

            // 8. Quitar prefijo 'X' por typo delante de comunas (ej: "XCamiña" -> "Camiña")
            if (/^X[A-ZÁÉÍÓÚ][a-záéíóúñ]+/.test(z) && !/^Xan\b/i.test(z)) {
                z = z.substring(1);
            }

            // 9. Quitar caracteres extraños o puntuación sobrante
            z = z.replace(/^[*#📍📌>–-]\s*/, '').replace(/[–—,;:\.\-]+$/, '').trim();

            if (!z || z.length < 2) return 'Nacional';

            // Normalizaciones de tildes en comunas chilenas frecuentes
            const tildesMap = {
                'hualaihue': 'Hualaihué',
                'longavi': 'Longaví',
                'treguaco': 'Treguaco',
                'trehuaco': 'Treguaco',
                'pucon': 'Pucón',
                'maipu': 'Maipú',
                'alhue': 'Alhué',
                'concepcion': 'Concepción',
                'curico': 'Curicó',
                'chanaral': 'Chañaral',
                'chañaral': 'Chañaral',
                'antofagasta': 'Antofagasta',
                'valparaiso': 'Valparaíso',
                'chillan': 'Chillán',
                'vallenar': 'Vallenar',
                'copiapo': 'Copiapó',
                'combarbala': 'Combarbalá',
                'quillon': 'Quillón',
                'vicuna': 'Vicuña',
                'tarapaca': 'Tarapacá'
            };
            const lowZ = z.toLowerCase();
            if (tildesMap[lowZ]) {
                return tildesMap[lowZ];
            }

            // Capitalizar si viene todo en mayúsculas o minúsculas
            if (z === z.toUpperCase() || z === z.toLowerCase()) {
                z = z.toLowerCase().replace(/(?:^|\s|-)[a-záéíóúñ]/g, char => char.toUpperCase());
            }

            return z || 'Nacional';
        }

        function esDetalleGenerico(texto) {
            if (!texto || typeof texto !== 'string') return true;
            const t = texto.trim().toLowerCase();
            if (!t || t === '(sin detalle adicional)' || t === 'sin detalle' || t === 'incidencia operacional en curso') return true;
            const genericos = [
                'comunicación voz', 'comunicacion voz', 'problemas de cobertura', 'serv. voz y datos congestión',
                'serv. voz y datos congestion', 'servicio tv', 'canal premium no disponible', 'dificultad canal digital',
                'gestionar mis recargas', 'no puede recargar', 'servicio de recarga', 'activación de móviles',
                'activacion de moviles', 'sistemas de atencion', 'sistemas de atención', 'dificultad sistema de atención',
                'escalamiento a sistema', 'trabajo programado', 'trabajo programado móvil', 'trabajo programado sistemas',
                'entel', 'integración', 'integracion', 'nacional', 'a-nacional', 'recaud externos'
            ];
            return genericos.includes(t);
        }

        function extraerPOPs(texto) {
            if (!texto) return [];
            const regex = /\b([A-Z]{2,3}[0-9]{1,4})\b/g;
            const matches = texto.match(regex);
            if (!matches) return [];
            const stopWords = ['TEC', 'SITIO', 'NOMBRE', 'COMUNA', 'REGION', 'POP', 'LTE', '3G', '4G', '5G', 'INC', 'UID', 'ID', 'CRM', 'APP', 'OT', 'NC', 'OCC'];
            const pops = matches
                .filter(p => !stopWords.includes(p))
                .map(p => p.toUpperCase());
            return [...new Set(pops)].sort();
        }

        // Limpiar prefijo de estados de Siebel (ej: "Cerrado - Nacional - Recaud externos - Resuelto - ... - ")
        function limpiarPrefijoEstadosSiebel(texto, zona = '') {
            if (!texto) return '';
            let t = texto.trim();

            // Normalizar variantes de A-Nacional a Nacional para evitar cortes indeseados por guion
            t = t.replace(/\bA\s*[-–]\s*Nacional\b/gi, 'Nacional');

            // Palabras / categorías de metadatos de Siebel que componen la cadena de estados repetidos
            const metaTokens = [
                'cerrado', 'resuelto', 'abierto', 'cancelado', 'pendiente', 'en proceso',
                'nacional', 'a-nacional',
                'recaud externos', 'recaud. externos',
                'recaudación', 'recaudacion',
                'sistemas de atencion', 'sistemas de atención',
                'trabajo programado móvil', 'trabajo programado movil',
                'trabajo programado sistemas', 'trabajo programado',
                'activación de móviles', 'activacion de moviles',
                'servicio de recarga', 'gestionar mis recargas',
                'serv. voz y datos congestión', 'serv. voz y datos congestion',
                'comunicación voz', 'comunicacion voz', 'problemas de cobertura',
                'redes', 'sistema'
            ];

            const lowZona = (zona || '').toLowerCase().trim();

            // Iterativamente remover prefijos de metadata: "[Token] - "
            let cambio = true;
            while (cambio && t.length > 0) {
                cambio = false;
                const match = t.match(/^([^–-]+?)\s*[-–]\s*(.+)$/);
                if (match) {
                    const token = match[1].trim().toLowerCase();
                    if (
                        metaTokens.includes(token) ||
                        token.startsWith('a-nacional') ||
                        token === lowZona ||
                        /^(?:cerrado|resuelto|abierto|cancelado|pendiente|en proceso)$/i.test(token)
                    ) {
                        t = match[2].trim();
                        cambio = true;
                    }
                }
            }

            // Corregir posibles erratas comunes en la descripción resultante
            t = t.replace(/[\s\-–]+$/, '').trim();
            t = t.replace(/\bDicultad\b/gi, 'Dificultad');
            t = t.replace(/\bintermitencias\b/gi, 'intermitencia');

            return t;
        }

        // Limpiar colas técnicas de sitios / tablas (ej: "Lista de sitios TEC SITIO...")
        function limpiarColasTecnicas(texto) {
            if (!texto) return '';
            let t = texto;
            t = t.replace(/\s*(?:Lista\s+de\s+[sS]itios|TEC\s+SITIO|TEC\s+NEM|<Nemónico|Lista\s+de\s+Sitios).*$/i, '');
            t = t.replace(/\s*Tecnolog[íi]as\s+Impactadas:.*$/i, '');
            return t.trim();
        }

        function extraerDetallePuntual(chunk, id, zona, inc) {
            if (!chunk) return 'Incidencia operacional en curso';
            const rawLines = chunk.split('\n').map(l => l.trim()).filter(l => l.length > 0);

            // 1. Filtrar líneas de script de atención, derivaciones o cabeceras tabuladas iniciales
            const cleanLines = rawLines.filter(line => {
                if (/^Hola\s+\(/i.test(line) || /^Estimado\b/i.test(line) || /^Hola\s+[a-zA-Z]/i.test(line)) return false;
                if (/^En estos momentos el servicio/i.test(line)) return false;
                if (/^En este momento\b/i.test(line)) return false;
                if (/^Protocolo\s+de\s+Comunicaci[oó]n/i.test(line)) return false;
                if (/^EJEC\./i.test(line)) return false;
                if (/presentamos\s+(?:una\s+)?intermitencia/i.test(line)) return false;
                if (/\bpronta\s+soluci[oó]n\b/i.test(line)) return false;
                if (/\bGracias\s+por\s+tu\s+comprensi[oó]n\b/i.test(line)) return false;
                if (/\bAgradecemos\s+tu\s+comprensi[oó]n\b/i.test(line)) return false;
                if (/\bnuestro equipo t[eé]cnico\b/i.test(line)) return false;
                if (/\best[aá]n?\s+trabajando\s+para\b/i.test(line)) return false;
                if (/^Debido al cambio de hora/i.test(line)) return false;
                if (/^Derivar\s+al\s+cliente/i.test(line)) return false;
                if (/^\s*INC\s?\d+\s*$/i.test(line)) return false;
                if (/^\s*\d{1,2}[/-]\d{1,2}[/-]\d{4}/.test(line)) return false;
                if (line.startsWith(id) || /^1-\d{11,12}\b/.test(line)) return false;
                if (/^(?:Serv\.\s+Voz|Comunicación\s+Voz|Problemas\s+de\s+cobertura|Sistemas\s+de\s+Atenci[oó]n|Activación\s+de\s+móviles|Servicio\s+de\s+Recarga|Trabajo\s+Programado\s+Móvil|Trabajo\s+Programado\s+Sistemas|Entel|Integración)$/i.test(line)) return false;
                return true;
            });

            // 2. Buscar líneas con Contingencia Preventiva explícita (incluso con typos de Siebel como CONTINGNECIA o entre corchetes)
            for (const line of cleanLines) {
                const cpMatch = line.match(/(?:\[?CONTING(?:EN|NE)CIA\s+PREVENTIVA\]?|CONTINGENCIA)\s*[-–:]\s*(.+)/i);
                if (cpMatch) {
                    let desc = cpMatch[1].trim();
                    desc = limpiarPrefijoEstadosSiebel(desc, zona);
                    desc = limpiarColasTecnicas(desc);
                    if (desc.length > 5) {
                        return `Contingencia Preventiva: ${desc}`;
                    }
                }
            }

            // 3. Buscar líneas técnicas de INC de Red (ej: INC000009433631, INC000009408613, etc.)
            for (const line of cleanLines) {
                const incIdx = line.search(/\bINC\s?\d{8,14}\b/i);
                if (incIdx !== -1) {
                    let textoInc = line.substring(incIdx).trim();
                    const guionIdx = textoInc.indexOf(' - ');
                    if (guionIdx !== -1) {
                        let cuerpo = textoInc.substring(guionIdx + 3).trim();
                        cuerpo = limpiarColasTecnicas(cuerpo);

                        // A. Extraer causa (debido a ... o Causa: ...)
                        let causa = '';
                        const debidoMatch = cuerpo.match(/debido\s+a\s+([^\n\r]+?)(?=\s+Lista\s+de|\s+TEC|\s*<Nemónico|\s*$)/i);
                        if (debidoMatch) {
                            causa = debidoMatch[1].trim();
                        } else {
                            const causaMatch = cuerpo.match(/Causa\s*[:\s]+([^\n\r]+?)(?=\s+Lista\s+de|\s+TEC|\s*<Nemónico|\s*$)/i);
                            if (causaMatch) causa = causaMatch[1].trim();
                        }

                        // Limpiar repeticiones o placeholders en causa
                        if (causa) {
                            if (causa.includes('Lista de') || causa.includes('Caída de')) {
                                causa = causa.split(/(?:Lista\s+de|Ca[íi]da\s+de)/i)[0].trim();
                            }
                            if (/^\(causa por definir\)$/i.test(causa) || /^por definir$/i.test(causa)) {
                                causa = '';
                            }
                            if (causa.length > 0) {
                                causa = causa.charAt(0).toUpperCase() + causa.slice(1);
                            }
                        }

                        // B. Extraer tipo de falla principal
                        let tipoFalla = '';
                        if (/Perdida\s+de\s+conectividad/i.test(cuerpo)) {
                            tipoFalla = 'Pérdida de conectividad';
                        } else if (/Degradaci[oó]n/i.test(cuerpo)) {
                            tipoFalla = 'Degradación de Sitios';
                        } else if (/Aumento\s+(?:de\s+)?reclamos/i.test(cuerpo)) {
                            tipoFalla = 'Aumento de Reclamos';
                        } else if (/Ca[íi]da\s+de\s+Sitios/i.test(cuerpo)) {
                            tipoFalla = 'Caída de Sitios';
                        } else if (/Saturaci[oó]n/i.test(cuerpo)) {
                            tipoFalla = 'Saturación de Nodo';
                        } else if (/\bOLT\b/i.test(cuerpo) && /PPP/i.test(cuerpo)) {
                            tipoFalla = 'OLT sin cuentas PPP activas';
                        } else {
                            const genericoMatch = cuerpo.match(/^([A-Za-z0-9áéíóúÁÉÍÓÚñÑ\s]+?)(?=\s+en\s+Comunas?|\s+en\s+[A-Z]|\s*Causa:|\s*$)/i);
                            if (genericoMatch) tipoFalla = genericoMatch[1].trim();
                        }

                        if (tipoFalla && causa) return `${tipoFalla} — ${causa}`;
                        if (tipoFalla) return tipoFalla;
                        if (causa) return causa;
                        if (cuerpo && cuerpo.length < 80) return cuerpo;
                    }
                }
            }

            // 3.5. Líneas con patrón de incidente + causa SIN prefijo INC (estado de Siebel)
            //      ej. "Abierto - San Bernardo - ... - Aumento de reclamos. en San Bernardo. - Caída de Sitios en Comuna: San Bernardo, RM Causa: Corte energía"
            for (const line of cleanLines) {
                const reInc = /(Ca[íi]da\s+de\s+Sitios|Aumento\s+(?:de\s+)?reclamos|Perdida\s+de\s+conectividad|Saturaci[oó]n(?:\s+de\s+Nodo)?|Degradaci[oó]n(?:\s+de\s+Sitios)?)/gi;
                let mInc; let lastIdx = -1; let lastTipoRaw = '';
                while ((mInc = reInc.exec(line)) !== null) { lastIdx = mInc.index; lastTipoRaw = mInc[1]; }
                if (lastIdx === -1) continue;

                let tipo = '';
                if (/Ca[íi]da\s+de\s+Sitios/i.test(lastTipoRaw)) tipo = 'Caída de Sitios';
                else if (/Aumento/i.test(lastTipoRaw)) tipo = 'Aumento de Reclamos';
                else if (/Perdida/i.test(lastTipoRaw)) tipo = 'Pérdida de conectividad';
                else if (/Saturaci/i.test(lastTipoRaw)) tipo = 'Saturación de Nodo';
                else if (/Degradaci/i.test(lastTipoRaw)) tipo = 'Degradación de Sitios';

                let cola = limpiarColasTecnicas(line.substring(lastIdx));
                let causa = '';
                const causaMatch = cola.match(/Causa\s*[:\s]+([^\n\r]+?)(?=\s+Lista\s+de|\s+TEC|\s*<Nem[oó]nico|\s*$)/i);
                if (causaMatch) causa = causaMatch[1].trim();
                if (causa) {
                    if (causa.includes('Lista de') || causa.includes('Caída de')) {
                        causa = causa.split(/(?:Lista\s+de|Ca[íi]da\s+de)/i)[0].trim();
                    }
                    if (/^\(causa por definir\)$/i.test(causa) || /^por definir$/i.test(causa)) causa = '';
                    if (causa.length > 0) causa = causa.charAt(0).toUpperCase() + causa.slice(1);
                }

                if (tipo && causa) return `${tipo} — ${causa}`;
                if (tipo) return tipo;
            }

            // 4. Buscar líneas de Trabajo Programado
            for (const line of cleanLines) {
                if (/Trabajo\s+Programado/i.test(line)) {
                    let tp = limpiarPrefijoEstadosSiebel(line, zona);
                    tp = limpiarColasTecnicas(tp);
                    if (tp && !esDetalleGenerico(tp)) return tp;
                }
            }

            // 5. Buscar en líneas de estados de Siebel (sistemas, comerciales, front)
            for (const line of cleanLines) {
                const limpia = limpiarPrefijoEstadosSiebel(line, zona);
                const sinTablas = limpiarColasTecnicas(limpia);
                if (sinTablas && sinTablas.length >= 6 && !esDetalleGenerico(sinTablas) && !sinTablas.startsWith('<') && !/^INC\s?\d/i.test(sinTablas)) {
                    return sinTablas;
                }
            }

            // 6. Si hay columnas tabuladas o candidatos sueltos
            for (const line of cleanLines) {
                const parts = line.split('\t').map(p => p.trim()).filter(p => p.length > 0);
                for (const part of parts) {
                    const cleanPart = limpiarColasTecnicas(limpiarPrefijoEstadosSiebel(part, zona));
                    if (cleanPart.length >= 6 && !esDetalleGenerico(cleanPart) && !cleanPart.startsWith('<') && !/^INC\s?\d/i.test(cleanPart) && !/^\d{1,2}[/-]\d{1,2}[/-]\d{4}/.test(cleanPart)) {
                        return cleanPart;
                    }
                }
            }

            // 7. Si hay categorías de CRM concatenadas
            const catMatch = chunk.match(/(?:Gestionar mis recargas|Escalamiento a sistema|Dificultad sistema de atención|Servicio de Recarga|Activación de móviles|Sistemas de Atencion|Servicio TV|Canal premium no disponible|Dificultad Canal Digital)/gi);
            if (catMatch && catMatch.length > 0) {
                return [...new Set(catMatch)].join(' — ');
            }

            // 8. Buscar descripciones técnicas de red
            const redDesc = chunk.match(/(?:Lentitud en OT|Caída de Sitios|Corte de Energía|Corte Energía|Intermitencia|Corte de fibra|Corte de Fibra|Falla HW)/i);
            if (redDesc) return redDesc[0];

            return 'Incidencia operacional en curso';
        }

        function procesarContingencias(raw) {
            if (!raw || !raw.trim()) {
                showToast('⚠️ No hay texto para procesar.', 'warning');
                return false;
            }

            const defaultDate = "Fecha no especificada";
            const nuevasContingencias = [];

            // Dividir por ID 1-XXXXXXXXXXXX
            const chunks = raw.split(/(?=(?:^|\n)\s*1-\d{11,12}\b)/).map(c => c.trim()).filter(c => c.length > 0);

            if (chunks.length > 0 && chunks.some(c => /1-\d{11,12}/.test(c))) {
                chunks.forEach(chunk => {
                    const idMatch = chunk.match(/\b(1-\d{11,12})\b/);
                    if (!idMatch) return;
                    const id = idMatch[1];

                    // Fecha
                    const dateMatch = chunk.match(/(\d{1,2}[/-]\d{1,2}[/-]\d{4}(?:\s+\d{1,2}:\d{2}(?::\d{2})?)?)/);
                    let fechaRaw = dateMatch ? dateMatch[1] : defaultDate;
                    const dtObj = parseFechaContingencia(fechaRaw);
                    const fechaDisplay = dtObj ? formatearFechaDisplay(dtObj, fechaRaw) : fechaRaw;

                    // Zona
                    let zona = "Nacional";
                    const tabParts = chunk.split('\t').map(p => p.trim());
                    if (tabParts.length >= 7) {
                        const candidateZona = tabParts[6];
                        if (candidateZona && !/^\d+$/.test(candidateZona) && candidateZona.length < 45) {
                            zona = candidateZona;
                        }
                    } else if (chunk.includes('|')) {
                        const pipeParts = chunk.split('|').map(p => p.replace(/[*#📍📌]/g, '').trim());
                        if (pipeParts.length >= 2 && pipeParts[1]) {
                            zona = pipeParts[1];
                        }
                    } else if (dateMatch) {
                        const textAfterDate = chunk.substring(chunk.indexOf(dateMatch[1]) + dateMatch[1].length).trim();
                        const zonaMatch = textAfterDate.match(/^([a-zA-ZáéíóúÁÉÍÓÚñÑ\s]+?)(?=\t|Serv\.|Trabajo|INC|En estos|$)/);
                        if (zonaMatch && zonaMatch[1].trim()) {
                            zona = zonaMatch[1].trim();
                        }
                    }

                    // Sanitizar zona (eliminar prefijos, sufijos de región, POPs pegados)
                    zona = limpiarZona(zona);

                    // POPs
                    const pops = extraerPOPs(chunk);

                    // INC
                    const incMatch = chunk.match(/\b(INC\s?\d{8,14})\b/i);
                    const inc = incMatch ? incMatch[1].replace(/\s+/g, '').toUpperCase() : '';

                    // Detalle puntual
                    let detalle = extraerDetallePuntual(chunk, id, zona, inc);
                    if (detalle) detalle = detalle.replace(/[.\s]+$/, '').trim();

                    const item = {
                        id,
                        zona: zona || 'Nacional',
                        inicio: fechaDisplay,
                        detalle: detalle || '',
                        pops: pops || [],
                        inc: inc || '',
                        textoCompleto: chunk,
                        tipoManual: false,
                        estado: 'activo'
                    };
                    item.tipo = inferirTipo(item);
                    nuevasContingencias.push(item);
                });
            } else {
                const lineas = raw.split('\n');
                lineas.forEach(linea => {
                    if (!linea.trim()) return;
                    const idMatch = linea.match(/\b(1-\d{11,12})\b/);
                    if (!idMatch) return;
                    const id = idMatch[1];
                    let zona = "Nacional";
                    let fecha = defaultDate;
                    let detalle = '';

                    if (linea.includes('|')) {
                        const partes = linea.split('|').map(p => p.replace(/[*#📍📌]/g, '').trim());
                        if (partes.length >= 2 && partes[1]) zona = partes[1];
                        if (partes.length >= 3 && partes[2]) fecha = partes[2];
                        if (partes.length >= 4 && partes[3]) detalle = partes[3];
                    } else if (linea.includes('📍') || linea.includes('📌') || linea.includes('*')) {
                        let texto = linea.replace(id, '').replace(/[📍📌]/g, '').trim();
                        const starMatch = texto.match(/\*([^*]+)\*/);
                        if (starMatch) {
                            texto = starMatch[1].trim();
                        }
                        if (texto.includes('—')) {
                            const parts = texto.split('—').map(p => p.trim());
                            zona = parts[0] || 'Nacional';
                            detalle = parts.slice(1).join(' — ');
                        } else if (texto.includes('-') && !texto.toLowerCase().startsWith('contingencia')) {
                            const parts = texto.split('-').map(p => p.trim());
                            zona = parts[0] || 'Nacional';
                            detalle = parts.slice(1).join(' - ');
                        } else {
                            const comunas = ['santiago', 'valparaíso', 'valparaiso', 'concepción', 'concepcion', 'antofagasta', 'temuco', 'rancagua', 'talca', 'arica', 'iquique', 'puerto montt', 'coquimbo', 'la serena', 'chillán', 'chillan', 'calama', 'copiapó', 'copiapo', 'osorno', 'quillota', 'curicó', 'curico', 'punta arenas', 'los ángeles', 'los angeles', 'coronel', 'san antonio', 'melipilla', 'linares', 'ovalle', 'quillota', 'quilpué', 'quilpue', 'villa alemana', 'maipú', 'maipu', 'puente alto', 'la florida', 'las condes', 'providencia', 'ñuñoa', 'nunoa', 'san bernardo'];
                            const low = texto.toLowerCase();
                            if (comunas.some(c => low === c || low.startsWith(c + ' '))) {
                                zona = texto;
                                detalle = '';
                            } else if (low === 'nacional' || low === 'desconocida') {
                                zona = 'Nacional';
                                detalle = '';
                            } else {
                                zona = 'Nacional';
                                detalle = texto;
                            }
                        }
                    }

                    zona = limpiarZona(zona);
                    if (!detalle) detalle = extraerDetallePuntual(linea, id, zona, '');
                    if (detalle) detalle = detalle.replace(/[.\s]+$/, '').trim();
                    const dtObj = parseFechaContingencia(fecha);
                    const fechaDisplay = dtObj ? formatearFechaDisplay(dtObj, fecha) : fecha;

                    const item = {
                        id,
                        zona,
                        inicio: fechaDisplay,
                        detalle,
                        pops: extraerPOPs(linea),
                        inc: (linea.match(/\b(INC\s?\d{8,14})\b/i) || [])[1] || '',
                        textoCompleto: linea,
                        tipoManual: false,
                        estado: 'activo'
                    };
                    item.tipo = inferirTipo(item);
                    nuevasContingencias.push(item);
                });
            }

            if (!nuevasContingencias.length) {
                showToast('⚠️ No se encontraron contingencias válidas en el texto.', 'warning');
                return false;
            }

            pushUndo();

            const modoMerge = !!(chkMerge && chkMerge.checked);
            if (modoMerge && contingencias.length) {
                const byId = {};
                nuevasContingencias.forEach(c => { byId[c.id] = c; });
                const merged = [];
                contingencias.forEach(old => {
                    if (byId[old.id]) {
                        const n = byId[old.id];
                        merged.push(Object.assign({}, n, {
                            tipo: old.tipoManual ? (old.tipo || n.tipo) : n.tipo,
                            tipoManual: !!old.tipoManual,
                            estado: old.estado || 'activo'
                        }));
                        delete byId[old.id];
                    } else {
                        merged.push(old);
                    }
                });
                Object.keys(byId).forEach(k => merged.push(byId[k]));
                contingencias = merged;
            } else {
                contingencias = nuevasContingencias;
            }

            aplicarOverrides();
            seleccionados.clear();

            guardarYNotificar();
            actualizarUI();
            showToast(modoMerge ? `✅ Radar actualizado (+${nuevasContingencias.length} del reporte).` : `✅ Radar actualizado: ${contingencias.length} casos activos.`, 'success');
            return true;
        }

        // ============================================================
        // ACTUALIZAR UI
        // ============================================================
        function cmpFechaDesc(a, b) {
            const x = parseFechaContingencia(a.inicio), y = parseFechaContingencia(b.inicio);
            if (!x && !y) return 0; if (!x) return 1; if (!y) return -1; return y - x;
        }
        function cmpFechaAsc(a, b) {
            const x = parseFechaContingencia(a.inicio), y = parseFechaContingencia(b.inicio);
            if (!x && !y) return 0; if (!x) return 1; if (!y) return -1; return x - y;
        }
        function contingenciaVisible(c) {
            const t = tipoEfectivo(c);
            if (filtroTipo !== 'all' && t !== filtroTipo) return false;
            if (ocultarNorm && estadoEfectivo(c) === 'normalizado') return false;
            if (textoBusqueda) {
                const q = textoBusqueda.toLowerCase();
                const blob = [c.id, c.zona, c.detalle, c.inc, (Array.isArray(c.pops) ? c.pops.join(' ') : ''), (TIPOS[t] ? TIPOS[t].label : '')].join(' ').toLowerCase();
                if (!blob.includes(q)) return false;
            }
            return true;
        }
        function ordenarLista(arr) {
            const copy = [...arr];
            if (sortBy === 'fecha-asc') copy.sort(cmpFechaAsc);
            else if (sortBy === 'zona') copy.sort((a, b) => (a.zona || '').localeCompare(b.zona || ''));
            else if (sortBy === 'tipo') copy.sort((a, b) => ((ORDEN_TIPOS[tipoEfectivo(a)] ?? 9) - (ORDEN_TIPOS[tipoEfectivo(b)] ?? 9)) || cmpFechaDesc(a, b));
            else copy.sort(cmpFechaDesc);
            return copy;
        }
        function findCard(id) { return Array.from(listContainer.querySelectorAll('.c-card')).find(c => c.dataset.id === id); }

        function renderChips() {
            const counts = { all: contingencias.length, red: 0, nacional: 0, sistemas: 0, otro: 0 };
            contingencias.forEach(c => { const t = tipoEfectivo(c); if (counts[t] != null) counts[t]++; });
            const defs = [['all', 'Todos', '🗂️'], ['red', 'Red', '🛰️'], ['nacional', 'Nacional', '🏛️'], ['sistemas', 'Sistemas', '🔌'], ['otro', 'Otro', '⚪']];
            filterChips.innerHTML = defs.map(([k, label, ic]) =>
                `<span class="chip ${filtroTipo === k ? 'active' : ''}" data-tipo="${k}">${ic} ${label} <span class="chip-n">${counts[k] || 0}</span></span>`
            ).join('');
            filterChips.querySelectorAll('.chip').forEach(el => el.addEventListener('click', () => {
                filtroTipo = el.dataset.tipo;
                actualizarUI();
            }));
        }

        function actualizarUI() {
            countActives.textContent = contingencias.length;

            if (!contingencias.length) {
                filtersBox.classList.remove('visible');
                bulkbar.classList.remove('visible');
                seleccionados.clear();
                listContainer.innerHTML = `<div class="empty-state">No hay contingencias cargadas.<br><span style="opacity:0.5;font-size:10px;">Pega un reporte para comenzar</span></div>`;
                actualizarUndoUI();
                return;
            }

            filtersBox.classList.add('visible');
            renderChips();

            const visibles = ordenarLista(contingencias.filter(contingenciaVisible));
            if (!visibles.length) {
                listContainer.innerHTML = `<div class="empty-state">Ningún caso coincide con el filtro/búsqueda.</div>`;
                actualizarBulkUI();
                actualizarUndoUI();
                return;
            }

            let html = '';
            visibles.forEach(c => {
                const t = tipoEfectivo(c);
                const T = TIPOS[t] || TIPOS.nacional;
                const fechaObj = parseFechaContingencia(c.inicio);
                const fechaDisplay = fechaObj ? formatearFechaDisplay(fechaObj, c.inicio) : (c.inicio || 'Sin fecha');
                const diasStr = calcularDiasTranscurridos(fechaObj);
                const pops = Array.isArray(c.pops) ? c.pops : extraerPOPs(c.textoCompleto || '');
                const detalle = (c.detalle || '').trim();
                const tieneDetalleRelevante = detalle && !esDetalleGenerico(detalle);
                const est = estadoEfectivo(c);
                const norm = est === 'normalizado';
                const sel = seleccionados.has(c.id);
                const dudoso = clasificacionDudosa(c);
                const estIcon = est === 'normalizado' ? '🟢' : est === 'curso' ? '🟡' : '🔴';

                html += `
                    <div class="c-card ${norm ? 'normalizada' : ''} ${sel ? 'selected' : ''}" data-id="${esc(c.id)}" style="border-left-color:${T.color}">
                        <div class="c-top">
                            <input type="checkbox" class="c-check" data-action="check" ${sel ? 'checked' : ''} title="Seleccionar" />
                            <span class="tipo-chip" data-action="tipo" data-tipo="${t}" title="Clic para cambiar la categoría (${TIPOS[t].label})">${T.icon} ${T.label}${c.tipoManual ? '' : ' <span class="auto-dot">auto</span>'}</span>
                            ${dudoso ? `<span class="warn-parse" title="Clasificación automática dudosa: revisá la categoría">⚠️</span>` : ''}
                            <span class="estado-chip" data-action="estado" data-estado="${est}" title="Clic para cambiar el estado">${estIcon} ${ESTADOS[est]}</span>
                            <span style="flex:1"></span>
                            <div class="c-actions">
                                <button class="c-btn-edit" data-action="edit" title="Editar contingencia">✏️</button>
                                <button class="c-del" data-action="del" title="Eliminar">✕</button>
                            </div>
                        </div>
                        <div class="c-row">
                            <span class="c-zona" data-action="inline-zona" title="Doble clic para editar la zona">📍 ${esc(c.zona || 'Nacional')}</span>
                            <span class="c-id" data-action="copy" title="Copiar ID">📋 ${esc(c.id)}</span>
                        </div>
                        <div class="c-row">
                            <span class="c-meta">${esc(fechaDisplay)} | ${esc(diasStr)}</span>
                        </div>
                        ${tieneDetalleRelevante ? `<div class="c-detalle" data-action="inline-detalle" title="Doble clic para editar">${esc(detalle)}</div>` : ''}
                        ${pops.length ? `<div class="c-meta" style="margin-top:2px;"><span class="c-pops">📡 POPs: ${esc(pops.join(', '))}</span></div>` : ''}
                        ${c.inc ? `<div class="c-meta" style="margin-top:2px;"><span class="c-inc">🎫 ${esc(c.inc)}</span></div>` : ''}
                    </div>
                `;
            });
            listContainer.innerHTML = html;
            attachCardHandlers();
            actualizarBulkUI();
            actualizarUndoUI();
        }

        function attachCardHandlers() {
            listContainer.querySelectorAll('.c-card').forEach(card => {
                const id = card.dataset.id;
                const check = card.querySelector('[data-action="check"]');
                if (check) check.addEventListener('change', (e) => { e.stopPropagation(); toggleSel(id, check.checked); });
                const tipoChip = card.querySelector('[data-action="tipo"]');
                if (tipoChip) tipoChip.addEventListener('click', (e) => { e.stopPropagation(); abrirMenuTipo(tipoChip, id); });
                const estadoChip = card.querySelector('[data-action="estado"]');
                if (estadoChip) estadoChip.addEventListener('click', (e) => { e.stopPropagation(); ciclarEstado(id); });
                card.querySelectorAll('[data-action="edit"]').forEach(b => b.addEventListener('click', (e) => { e.stopPropagation(); abrirEditorContingencia(id); }));
                card.querySelectorAll('[data-action="del"]').forEach(b => b.addEventListener('click', (e) => { e.stopPropagation(); eliminar(id); }));
                card.querySelectorAll('[data-action="copy"]').forEach(s => s.addEventListener('click', (e) => { e.stopPropagation(); copiarId(id); }));
                const zonaEl = card.querySelector('[data-action="inline-zona"]');
                if (zonaEl) zonaEl.addEventListener('dblclick', (e) => { e.stopPropagation(); editarInline(zonaEl, id, 'zona'); });
                const detEl = card.querySelector('[data-action="inline-detalle"]');
                if (detEl) detEl.addEventListener('dblclick', (e) => { e.stopPropagation(); editarInline(detEl, id, 'detalle'); });
            });
        }

        function toggleSel(id, on) {
            if (on) seleccionados.add(id); else seleccionados.delete(id);
            const card = findCard(id);
            if (card) card.classList.toggle('selected', on);
            actualizarBulkUI();
        }
        function actualizarBulkUI() {
            const n = seleccionados.size;
            if (bulkbar) {
                bulkbar.classList.toggle('visible', n > 0);
                if (bulkCount) bulkCount.textContent = n + ' seleccionada' + (n === 1 ? '' : 's');
            }
        }

        let tipoMenuEl = null;
        function abrirMenuTipo(anchor, id) {
            cerrarMenuTipo();
            const cur = tipoEfectivo(contingencias.find(c => c.id === id) || {});
            const menu = document.createElement('div');
            menu.className = 'dropdown-menu';
            menu.style.cssText = 'display:flex;position:fixed;z-index:3000;min-width:150px;';
            menu.innerHTML = Object.keys(TIPOS).map(k =>
                `<button class="dropdown-item" data-k="${k}"><span class="dropdown-item-icon">${TIPOS[k].icon}</span><div class="dropdown-item-text"><span class="dropdown-item-title">${TIPOS[k].label}${cur === k ? ' ✓' : ''}</span></div></button>`
            ).join('');
            document.body.appendChild(menu);
            const r = anchor.getBoundingClientRect();
            menu.style.left = Math.max(4, Math.min(r.left, window.innerWidth - 164)) + 'px';
            menu.style.top = (r.bottom + 4) + 'px';
            menu.querySelectorAll('[data-k]').forEach(b => b.addEventListener('click', (e) => {
                e.stopPropagation();
                cerrarMenuTipo();
                setTipo(id, b.dataset.k);
            }));
            tipoMenuEl = menu;
            setTimeout(() => document.addEventListener('click', cerrarMenuTipo, { once: true }), 0);
        }
        function cerrarMenuTipo() { if (tipoMenuEl) { tipoMenuEl.remove(); tipoMenuEl = null; } }

        function ciclarEstado(id) {
            const c = contingencias.find(x => x.id === id);
            if (!c) return;
            const orden = ['activo', 'curso', 'normalizado'];
            const cur = estadoEfectivo(c);
            const next = orden[(orden.indexOf(cur) + 1) % orden.length];
            setEstado(id, next);
        }

        function editarInline(el, id, campo) {
            const c = contingencias.find(x => x.id === id);
            if (!c) return;
            const original = (c[campo] || '');
            el.setAttribute('contenteditable', 'true');
            el.classList.add('inline-edit');
            el.focus();
            try {
                const range = document.createRange(); range.selectNodeContents(el);
                const s = window.getSelection(); s.removeAllRanges(); s.addRange(range);
            } catch (e) {}
            let done = false;
            const finish = (save) => {
                if (done) return; done = true;
                el.removeAttribute('contenteditable');
                el.classList.remove('inline-edit');
                if (save) {
                    let val = (el.textContent || '').replace(/^📍\s*/, '').trim();
                    if (val !== original) {
                        pushUndo();
                        c[campo] = val;
                        if (!c.tipoManual) c.tipo = inferirTipo(c);
                        if (campo === 'zona') { c.zona = c.zona || 'Nacional'; }
                        guardarYNotificar();
                    }
                }
                actualizarUI();
            };
            el.addEventListener('keydown', (ev) => {
                if (ev.key === 'Enter') { ev.preventDefault(); el.blur(); }
                else if (ev.key === 'Escape') { ev.preventDefault(); done = true; el.removeAttribute('contenteditable'); el.classList.remove('inline-edit'); actualizarUI(); }
                ev.stopPropagation();
            });
            el.addEventListener('blur', () => finish(true), { once: true });
        }

        // ============================================================
        // EDITOR DE TARJETAS
        // ============================================================
        let editingIndex = -1;

        function abrirEditorContingencia(id) {
            const idx = contingencias.findIndex(c => c.id === id);
            if (idx === -1) return;
            editingIndex = idx;
            const c = contingencias[idx];

            document.getElementById('edit-c-id').value = c.id || '';
            document.getElementById('edit-c-zona').value = c.zona || 'Nacional';
            document.getElementById('edit-c-tipo').value = (c.tipoManual && TIPOS[c.tipo]) ? c.tipo : '';
            document.getElementById('edit-c-estado').value = estadoEfectivo(c);
            document.getElementById('edit-c-fecha').value = c.inicio || '';
            document.getElementById('edit-c-detalle').value = c.detalle || '';
            document.getElementById('edit-c-pops').value = (c.pops || []).join(', ');
            document.getElementById('edit-c-inc').value = c.inc || '';

            document.getElementById('modal-edit-contingencia').classList.add('show');
            document.getElementById('edit-c-detalle').focus();
        }

        function cerrarEditorContingencia() {
            document.getElementById('modal-edit-contingencia').classList.remove('show');
            editingIndex = -1;
        }

        function guardarEdicionContingencia() {
            if (editingIndex < 0 || !contingencias[editingIndex]) return;
            const c = contingencias[editingIndex];

            const newId = document.getElementById('edit-c-id').value.trim();
            const newZona = document.getElementById('edit-c-zona').value.trim() || 'Nacional';
            const selTipo = document.getElementById('edit-c-tipo').value;
            const selEstado = document.getElementById('edit-c-estado').value || 'activo';
            const newFecha = document.getElementById('edit-c-fecha').value.trim();
            const newDetalle = document.getElementById('edit-c-detalle').value.trim().replace(/[.\s]+$/, '');
            const rawPops = document.getElementById('edit-c-pops').value;
            const newPops = rawPops.split(',').map(p => p.trim().toUpperCase()).filter(p => p.length > 0);
            const newInc = document.getElementById('edit-c-inc').value.trim().toUpperCase();

            if (!newId) {
                showToast('⚠️ El ID es obligatorio.', 'warning');
                return;
            }

            pushUndo();
            const oldId = c.id;
            c.id = newId;
            c.zona = newZona;
            c.inicio = newFecha || c.inicio;
            c.detalle = newDetalle;
            c.pops = newPops;
            c.inc = newInc;
            c.estado = ESTADOS[selEstado] ? selEstado : 'activo';

            if (selTipo && TIPOS[selTipo]) {
                c.tipo = selTipo; c.tipoManual = true;
                overrides[c.id] = Object.assign({}, overrides[c.id], { tipo: selTipo, tipoManual: true });
            } else {
                c.tipoManual = false; c.tipo = inferirTipo(c);
                if (overrides[c.id]) {
                    delete overrides[c.id].tipo; delete overrides[c.id].tipoManual;
                    if (!Object.keys(overrides[c.id]).length) delete overrides[c.id];
                }
            }
            overrides[c.id] = Object.assign({}, overrides[c.id], { estado: c.estado });
            if (oldId && oldId !== c.id) delete overrides[oldId];

            guardarOverrides();
            guardarYNotificar();
            actualizarUI();
            cerrarEditorContingencia();
            showToast('✅ Contingencia modificada guardada.', 'success');
        }

        // ============================================================
        // FUNCIONES DE ACCIÓN
        // ============================================================
        function eliminar(id) {
            pushUndo();
            contingencias = contingencias.filter(c => c.id !== id);
            seleccionados.delete(id);
            guardarYNotificar();
            actualizarUI();
            showToast('🗑 Contingencia eliminada.', 'success');
        }

        function copiarId(id) {
            navigator.clipboard.writeText(id).then(() => {
                showToast('📋 ID copiado.', 'success');
            }).catch(() => {});
        }

        function limpiarTodo() {
            if (!contingencias.length) {
                showToast('⚠️ No hay contingencias para limpiar.', 'warning');
                return;
            }
            if (confirm('¿Deseas limpiar todo el radar de contingencias?')) {
                pushUndo();
                contingencias = [];
                seleccionados.clear();
                guardarYNotificar();
                actualizarUI();
                showToast('🗑 Radar limpiado.', 'success');
            }
        }

        function setTipo(id, tipo) {
            const c = contingencias.find(x => x.id === id);
            if (!c || !TIPOS[tipo]) return;
            pushUndo();
            c.tipo = tipo; c.tipoManual = true;
            overrides[id] = Object.assign({}, overrides[id], { tipo, tipoManual: true });
            guardarOverrides(); guardarYNotificar(); actualizarUI();
            showToast(`${TIPOS[tipo].icon} ${TIPOS[tipo].label}.`, 'success');
        }
        function setEstado(id, estado) {
            const c = contingencias.find(x => x.id === id);
            if (!c || !ESTADOS[estado]) return;
            pushUndo();
            c.estado = estado;
            overrides[id] = Object.assign({}, overrides[id], { estado });
            guardarOverrides(); guardarYNotificar(); actualizarUI();
            const ic = estado === 'normalizado' ? '🟢' : estado === 'curso' ? '🟡' : '🔴';
            showToast(`${ic} Estado: ${ESTADOS[estado]}.`, 'success');
        }
        function bulkMarcarTipo(tipo) {
            if (!seleccionados.size || !TIPOS[tipo]) return;
            pushUndo();
            seleccionados.forEach(id => {
                const c = contingencias.find(x => x.id === id);
                if (!c) return;
                c.tipo = tipo; c.tipoManual = true;
                overrides[id] = Object.assign({}, overrides[id], { tipo, tipoManual: true });
            });
            seleccionados.clear();
            guardarOverrides(); guardarYNotificar(); actualizarUI();
            showToast(`${TIPOS[tipo].icon} ${TIPOS[tipo].label}: aplicado en lote.`, 'success');
        }
        function bulkNormalizar() {
            if (!seleccionados.size) return;
            pushUndo();
            seleccionados.forEach(id => {
                const c = contingencias.find(x => x.id === id);
                if (!c) return;
                c.estado = 'normalizado';
                overrides[id] = Object.assign({}, overrides[id], { estado: 'normalizado' });
            });
            seleccionados.clear();
            guardarOverrides(); guardarYNotificar(); actualizarUI();
            showToast('🟢 Normalizadas.', 'success');
        }
        function bulkEliminar() {
            if (!seleccionados.size) return;
            if (!confirm(`¿Eliminar ${seleccionados.size} contingencia(s)?`)) return;
            pushUndo();
            const sel = new Set(seleccionados);
            contingencias = contingencias.filter(c => !sel.has(c.id));
            seleccionados.clear();
            guardarYNotificar(); actualizarUI();
            showToast('🗑 Eliminadas.', 'success');
        }

        function guardarYNotificar() {
            ipcRenderer.send('save-contingencias', contingencias);
            ipcRenderer.send('contingencias-updated', contingencias);
        }

        // ============================================================
        // FORMATOS DE COPIA
        // ============================================================

        function contingenciasParaCopiar() {
            return contingencias.filter(c => estadoEfectivo(c) !== 'normalizado');
        }

        function generarDetallado() {
            const base = contingenciasParaCopiar();
            if (!base.length) {
                showToast('⚠️ No hay contingencias activas para copiar.', 'warning');
                return null;
            }

            const conComuna = base.filter(c => tipoEfectivo(c) === 'red' && c.zona);
            const comunasUnicas = [...new Set(conComuna.map(c => c.zona))].sort();
            const totalComunas = comunasUnicas.length;
            const totalContingencias = base.length;

            let lines = [];
            lines.push('📌 *CONTINGENCIAS ACTIVAS* ✍');
            lines.push('');
            lines.push(
                `🗺 *COMUNAS/DISTRITOS AFECTADOS (${totalComunas}) | CONTINGENCIAS ÚNICAS (${totalContingencias}) :*`
            );
            lines.push('');
            if (comunasUnicas.length > 0) {
                lines.push(`> *${comunasUnicas.join(', ')}*`);
            } else {
                lines.push(`> *Nacional / Sistemas de Atención*`);
            }
            lines.push('');
            lines.push('**Detalle ordenado de forma descendente por fecha de apertura** 👇🏻');
            lines.push('');

            const sorted = [...base].sort(cmpFechaDesc);

            sorted.forEach(c => {
                const zona = c.zona || 'Nacional';
                const fechaObj = parseFechaContingencia(c.inicio);
                const fechaDisplay = fechaObj ? formatearFechaDisplay(fechaObj, c.inicio) : c.inicio;
                const diasStr = calcularDiasTranscurridos(fechaObj);
                const pops = Array.isArray(c.pops) ? c.pops : extraerPOPs(c.textoCompleto || '');
                const detalle = (c.detalle || '').trim();
                const tieneDetalleRelevante = detalle && !esDetalleGenerico(detalle);

                lines.push(`📍 ${c.id} | *${zona}* | ${fechaDisplay} | ${diasStr}`);
                if (pops.length > 0) {
                    lines.push(`> POP afectados: ${pops.join(', ')}`);
                    if (tieneDetalleRelevante) {
                        lines.push(`> Detalle: ${detalle}`);
                    }
                } else if (tieneDetalleRelevante) {
                    lines.push(`> ${detalle}`);
                } else {
                    lines.push(`> (Sin detalle adicional)`);
                }
                lines.push('');
            });

            return lines.join('\n');
        }

        function generarBreve(criterio = 'alfabetico') {
            const base = contingenciasParaCopiar();
            if (!base.length) {
                showToast('⚠️ No hay contingencias activas para copiar.', 'warning');
                return null;
            }

            const red = base.filter(c => tipoEfectivo(c) === 'red');
            const resto = base.filter(c => tipoEfectivo(c) !== 'red');

            const sortedRed = criterio === 'fecha'
                ? [...red].sort(cmpFechaDesc)
                : [...red].sort((a, b) => (a.zona || '').localeCompare(b.zona || ''));
            const sortedResto = [...resto].sort(cmpFechaDesc);

            let lines = [];
            lines.push('📌*CONTINGENCIAS*📌');
            lines.push('');

            // 1. Contingencias de red / comuna (formato breve: Comuna e ID)
            sortedRed.forEach(c => {
                lines.push(`📍 *${c.zona || 'Red'}* ${c.id}`);
            });

            // Salto de línea si existen contingencias de ambos tipos
            if (sortedRed.length > 0 && sortedResto.length > 0) {
                lines.push('');
            }

            // 2. Contingencias que no son de red (nacional / sistemas / otro)
            sortedResto.forEach(c => {
                const detalleLimpio = (c.detalle || '').replace(/\s+/g, ' ').replace(/[*]/g, '').replace(/\.+$/, '').trim();
                const textoMostrar = detalleLimpio || c.zona || 'Nacional';
                lines.push(`📍 *${textoMostrar}* ${c.id}`);
            });

            return lines.join('\n');
        }

        // ============================================================
        // COPIAR FORMATOS
        // ============================================================
        function copiarDetallado() {
            const texto = generarDetallado();
            if (!texto) return;
            navigator.clipboard.writeText(texto).then(() => {
                showToast('📋 Texto detallado copiado al portapapeles.', 'success');
            }).catch(() => {
                showToast('❌ Error al copiar.', 'error');
            });
        }

        function copiarBreve(criterio = 'alfabetico') {
            const texto = generarBreve(criterio);
            if (!texto) return;
            navigator.clipboard.writeText(texto).then(() => {
                const label = criterio === 'fecha' ? 'por fecha' : 'alfabético';
                showToast(`📋 Texto breve (${label}) copiado al portapapeles.`, 'success');
            }).catch(() => {
                showToast('❌ Error al copiar.', 'error');
            });
        }

        function toggleDropdownBreve(e) {

            if (!dropdownBreveWrapper) return;
            const isOpen = dropdownBreveWrapper.classList.toggle('open');
            btnCopyBreve.setAttribute('aria-expanded', isOpen ? 'true' : 'false');

                btnCopyBreve.setAttribute('aria-expanded', 'false');
            }
        }

        if (btnUndo) btnUndo.addEventListener('click', deshacer);

        bulkbar.querySelectorAll('[data-bulk-tipo]').forEach(b => b.addEventListener('click', () => bulkMarcarTipo(b.dataset.bulkTipo)));

                closeDropdownBreve();
                copiarBreve('fecha');
            });
        }

        document.addEventListener('click', (e) => {
            if (dropdownBreveWrapper && !dropdownBreveWrapper.contains(e.target)) {
                closeDropdownBreve();
            }
        });

        // Modal eventos
        const modalEditOverlay = document.getElementById('modal-edit-contingencia');
        let backdropDown = false;

        document.getElementById('modal-edit-close').addEventListener('click', cerrarEditorContingencia);
        document.getElementById('modal-edit-cancel').addEventListener('click', cerrarEditorContingencia);
        document.getElementById('modal-edit-save').addEventListener('click', guardarEdicionContingencia);

        modalEditOverlay.addEventListener('mousedown', (e) => {
            backdropDown = (e.target === modalEditOverlay);
        });
        modalEditOverlay.addEventListener('click', (e) => {
            if (e.target === modalEditOverlay && backdropDown) cerrarEditorContingencia();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeDropdownBreve();
                cerrarMenuTipo();
            }
            const modal = document.getElementById('modal-edit-contingencia');
            if (modal && modal.classList.contains('show')) {
                if (e.key === 'Escape') {
                    cerrarEditorContingencia();
                } else if ((e.ctrlKey || e.metaKey) && e.key === 's') {
                    e.preventDefault();
                    guardarEdicionContingencia();
                }
            }
            const tag = (e.target && e.target.tagName) || '';
            const escribiendo = tag === 'INPUT' || tag === 'TEXTAREA' || (e.target && e.target.isContentEditable);
            if ((e.ctrlKey || e.metaKey) && (e.key === 'z' || e.key === 'Z') && !escribiendo) {
                e.preventDefault();
                deshacer();
            }
        });

        // ============================================================
        // INIT (IPC)
        // ============================================================
        ipcRenderer.on('init-contingencias', (e, data) => {
            contingencias = (Array.isArray(data) ? data : []).map(c => Object.assign({}, c));
            aplicarOverrides();
            actualizarUI();
        });
        ipcRenderer.on('init-contingencias-overrides', (e, data) => {
            overrides = (data && typeof data === 'object') ? data : {};
            aplicarOverrides();
            actualizarUI();
        });

        // ============================================================
        // INICIO
        // ============================================================
        showToast('📡 Radar de Contingencias PRO cargado.', 'success', 2000);
    </script>
</body>
</html>
