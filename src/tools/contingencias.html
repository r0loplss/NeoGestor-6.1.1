<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <title>Radar de Contingencias PRO</title>
    <style>
        /* ============================================================
               ROOT – Tema oscuro consistente con la app
               ============================================================ */
        :root {
            --bg: #0f1117;
            --surface: #161b27;
            --surface2: #1c2333;
            --surface3: #232c3f;
            --border: rgba(255, 255, 255, 0.07);
            --border2: rgba(255, 255, 255, 0.12);
            --text: #e2e8f0;
            --muted: #8892a4;
            --faint: #4a5568;
            --primary: #3b82f6;
            --success: #22c55e;
            --warning: #f59e0b;
            --danger: #ef4444;
            --font: 'Segoe UI', system-ui, sans-serif;
            --radius: 5px;
        }

        /* ============================================================
               RESET Y ESTRUCTURA BASE
               ============================================================ */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
            background: var(--bg);
            font-family: var(--font);
            font-size: 13px;
            color: var(--text);
        }

        body {
            display: flex;
            flex-direction: column;
            border: 1px solid var(--border2);
            border-radius: 6px;
        }

        /* ============================================================
               HEADER (frameless + drag)
               ============================================================ */
        #hdr {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 0 8px;
            height: 32px;
            flex-shrink: 0;
            background: #0d1220;
            border-bottom: 1px solid var(--border);
            border-radius: 6px 6px 0 0;
            -webkit-app-region: drag;
            user-select: none;
        }

        #hdr-title {
            flex: 1;
            font-size: 11px;
            font-weight: 700;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .hbtn {
            -webkit-app-region: no-drag;
            background: none;
            border: none;
            cursor: pointer;
            color: var(--faint);
            font-size: 12px;
            padding: 2px 6px;
            border-radius: 3px;
            transition: all 0.15s;
            font-family: var(--font);
        }

        .hbtn:hover {
            color: var(--text);
            background: rgba(255, 255, 255, 0.08);
        }

        .hbtn.danger:hover {
            color: var(--danger);
        }

        /* ============================================================
               TOOLBAR
               ============================================================ */
        #toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            padding: 8px 12px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            flex-shrink: 0;
            align-items: center;
        }

        #toolbar .status {
            font-size: 11px;
            color: var(--muted);
            flex: 1;
        }

        #toolbar .status b {
            color: var(--text);
        }

        .tb-btn {
            padding: 5px 14px;
            background: var(--surface3);
            border: 1px solid var(--border);
            border-radius: 5px;
            color: var(--text);
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            font-family: var(--font);
            transition: all 0.15s;
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .tb-btn:hover {
            background: var(--surface2);
            border-color: var(--primary);
        }

        .tb-btn.copy-det {
            background: rgba(59, 130, 246, 0.15);
            border-color: var(--primary);
            color: #bfdbfe;
        }
        .tb-btn.copy-det:hover {
            background: rgba(59, 130, 246, 0.3);
            box-shadow: 0 2px 8px rgba(59, 130, 246, 0.35);
        }
        .tb-btn.copy-breve {
            background: rgba(34, 197, 94, 0.12);
            border-color: var(--success);
            color: #86efac;
        }
        .tb-btn.copy-breve:hover {
            background: rgba(34, 197, 94, 0.22);
            box-shadow: 0 2px 8px rgba(34, 197, 94, 0.3);
        }
        .tb-btn.danger {
            background: transparent;
            color: var(--danger);
            border: 1px solid rgba(239, 68, 68, 0.35);
        }
        .tb-btn.danger:hover {
            color: var(--danger);
            border-color: var(--danger);
            background: rgba(239, 68, 68, 0.12);
        }

        /* ============================================================
               CUERPO PRINCIPAL (scroll)
               ============================================================ */
        #main {
            flex: 1;
            overflow-y: auto;
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        ::-webkit-scrollbar {
            width: 9px;
            height: 9px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--faint);
            border-radius: 5px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--muted);
        }

        #main::-webkit-scrollbar {
            width: 9px;
            height: 9px;
        }
        #main::-webkit-scrollbar-thumb {
            background: var(--faint);
            border-radius: 5px;
        }
        #main::-webkit-scrollbar-thumb:hover {
            background: var(--muted);
        }

        /* ============================================================
               ÁREA DE CARGA DE TEXTO
               ============================================================ */
        .input-area {
            background: var(--surface);
            border: 1px dashed var(--border2);
            border-radius: 8px;
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-area .input-hdr {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .input-area .input-title {
            font-size: 12px;
            font-weight: 700;
            color: var(--text);
            letter-spacing: 0.2px;
        }

        .input-area .input-sub {
            font-size: 10px;
            color: var(--muted);
            margin-top: 1px;
        }

        .input-area textarea {
            width: 100%;
            min-height: 80px;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            font-size: 12px;
            font-family: var(--font);
            padding: 8px 10px;
            resize: vertical;
            outline: none;
            line-height: 1.5;
        }

        .input-area textarea:focus {
            border-color: var(--primary);
            background: var(--surface3);
        }

        .input-area .btn-row {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .input-area .btn-row .btn {
            padding: 6px 16px;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            font-size: 12px;
            font-family: var(--font);
            transition: all 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .input-area .btn-row .btn:hover {
            background: #2563eb;
            box-shadow: 0 2px 8px rgba(59, 130, 246, 0.35);
        }

        .input-area .btn-row .btn.secondary {
            background: var(--surface3);
            color: var(--text);
            border: 1px solid var(--border);
        }

        .input-area .btn-row .btn.secondary:hover {
            background: var(--surface2);
            box-shadow: none;
        }

        /* ============================================================
               LISTA DE CONTINGENCIAS
               ============================================================ */
        .empty-state {
            text-align: center;
            color: var(--faint);
            font-size: 13px;
            padding: 30px 0;
            border: 1px dashed var(--border2);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.01);
        }

        .c-card {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px 12px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            transition: border-color 0.15s, background 0.15s;
            border-left: 3px solid rgba(245, 158, 11, 0.6);
        }

        .c-card:hover {
            border-color: var(--border2);
            border-left-color: var(--warning);
            background: var(--surface3);
        }

        .c-card .c-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }

        .c-card .c-row .c-zona {
            font-size: 12px;
            font-weight: 700;
            color: var(--warning);
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .c-card .c-row .c-id {
            font-size: 11px;
            color: var(--text);
            cursor: pointer;
            padding: 2px 8px;
            border-radius: 4px;
            transition: 0.15s;
            background: rgba(255, 255, 255, 0.04);
            font-family: 'Consolas', 'Courier New', monospace;
            border: 1px solid var(--border);
        }

        .c-card .c-row .c-id:hover {
            background: rgba(59, 130, 246, 0.15);
            color: var(--primary);
            border-color: var(--primary);
        }

        .c-card .c-actions {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .c-card .c-btn-edit {
            background: none;
            border: none;
            color: var(--muted);
            cursor: pointer;
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 4px;
            transition: 0.15s;
        }

        .c-card .c-btn-edit:hover {
            color: var(--primary);
            background: rgba(59, 130, 246, 0.15);
        }

        .c-card .c-row .c-del {
            background: none;
            border: none;
            color: var(--faint);
            cursor: pointer;
            font-size: 13px;
            padding: 2px 6px;
            border-radius: 4px;
            transition: 0.15s;
        }

        .c-card .c-row .c-del:hover {
            color: var(--danger);
            background: rgba(239, 68, 68, 0.12);
        }

        .c-card .c-detalle {
            font-size: 11.5px;
            color: #f1f5f9;
            line-height: 1.45;
            background: rgba(0, 0, 0, 0.22);
            border-left: 2px solid var(--primary);
            padding: 5px 8px;
            border-radius: 0 4px 4px 0;
            margin-top: 2px;
            word-break: break-word;
        }

        .c-card .c-meta {
            font-size: 10px;
            color: var(--faint);
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        .c-card .c-meta .c-pops {
            color: var(--muted);
            background: rgba(34, 197, 94, 0.08);
            padding: 2px 8px;
            border-radius: 4px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            border: 1px solid rgba(34, 197, 94, 0.15);
        }

        .c-card .c-meta .c-inc {
            color: #cbd5e1;
            background: rgba(255, 255, 255, 0.05);
            padding: 2px 8px;
            border-radius: 4px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            border: 1px solid var(--border);
            font-family: 'Consolas', monospace;
        }

        .c-card .c-meta .c-contexto {
            color: var(--primary);
            font-style: italic;
            background: rgba(59, 130, 246, 0.08);
            padding: 2px 8px;
            border-radius: 4px;
            border: 1px solid rgba(59, 130, 246, 0.15);
        }

        /* ============================================================
               MODAL EDICIÓN CONTINGENCIA
               ============================================================ */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(2px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 14px;
        }
        .modal-overlay.show { display: flex; }
        .modal-box {
            background: var(--surface);
            border: 1px solid var(--border2);
            border-radius: 8px;
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 14px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            animation: modalIn 0.2s ease-out;
        }
        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        .modal-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12.5px;
            font-weight: 700;
            color: var(--text);
            border-bottom: 1px solid var(--border);
            padding-bottom: 6px;
        }
        .modal-title .close-modal {
            background: none;
            border: none;
            color: var(--faint);
            font-size: 13px;
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 3px;
        }
        .modal-title .close-modal:hover {
            color: var(--danger);
            background: rgba(239, 68, 68, 0.12);
        }
        .modal-field {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }
        .modal-field label {
            font-size: 10.5px;
            color: var(--muted);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        .modal-field input, .modal-field textarea {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 5px;
            color: var(--text);
            font-size: 12px;
            font-family: var(--font);
            padding: 6px 8px;
            outline: none;
            transition: border-color 0.15s;
        }
        .modal-field textarea {
            min-height: 80px;
            resize: vertical;
            line-height: 1.4;
        }
        .modal-field input:focus, .modal-field textarea:focus {
            border-color: var(--primary);
            background: var(--surface3);
        }
        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 6px;
        }

        /* ============================================================
               TOAST
               ============================================================ */
        #toast-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: none;
        }

        .toast {
            pointer-events: auto;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            color: #fff;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
            animation: toastIn 0.3s ease-out;
            max-width: 320px;
        }

        .toast.success {
            background: var(--success);
        }
        .toast.warning {
            background: var(--warning);
            color: #000;
        }
        .toast.error {
            background: var(--danger);
        }

        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ============================================================
               RESPONSIVE
               ============================================================ */
        @media (max-width: 500px) {
            #toolbar {
                flex-direction: column;
                align-items: stretch;
            }
            #toolbar .status {
                text-align: center;
            }
            .input-area .btn-row {
                flex-direction: column;
            }
            .input-area .btn-row .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <!-- ============================================================
    HEADER
    ============================================================ -->
    <div id="hdr">
        <span id="hdr-title">📡 Radar de Contingencias PRO</span>
        <button class="hbtn danger" id="btn-limpiar-todo" title="Limpiar todo">🗑</button>
        <button class="hbtn" onclick="ipcRenderer.send('minimize-tool','contingencias')" title="Minimizar">—</button>
        <button class="hbtn" onclick="ipcRenderer.send('close-tool','contingencias')">✕</button>
    </div>

    <!-- ============================================================
    CUERPO PRINCIPAL
    ============================================================ -->
    <div id="main">

        <!-- 1. Bloque de carga de datos -->
        <div class="input-area">
            <div class="input-hdr">
                <div>
                    <div class="input-title">⚡ Carga de datos</div>
                    <div class="input-sub">Pega aquí cualquier formato de contingencia (1 al 5)</div>
                </div>
            </div>
            <textarea id="raw-input" placeholder="Pega aquí el reporte de contingencias..."></textarea>
            <div class="btn-row">
                <button class="btn" id="btn-procesar">⚡ Escanear y Reemplazar Radar</button>
                <button class="btn secondary" id="btn-limpiar-input">🗑 Limpiar texto</button>
            </div>
        </div>

        <!-- 2. Casos en radar: / Copiar detallado / Copiar Breve / Limpiar -->
        <div id="toolbar">
            <span class="status" id="status-bar">Casos en Radar: <b id="count-actives">0</b></span>
            <button class="tb-btn copy-det" id="btn-copy-det">📋 Copiar Detallado</button>
            <button class="tb-btn copy-breve" id="btn-copy-breve">📋 Copiar Breve</button>
            <button class="tb-btn danger" id="btn-limpiar">🗑 Limpiar</button>
        </div>

        <!-- 3. Lista de contingencias cargadas -->
        <div id="list-container">
            <div class="empty-state">Esperando datos...</div>
        </div>

    </div>

    <!-- ============================================================
    MODAL EDICIÓN CONTINGENCIA
    ============================================================ -->
    <div class="modal-overlay" id="modal-edit-contingencia">
        <div class="modal-box">
            <div class="modal-title">
                <span>✏️ Editar Contingencia</span>
                <button class="close-modal" id="modal-edit-close" title="Cerrar">✕</button>
            </div>
            <div class="modal-field">
                <label>ID de Contingencia</label>
                <input type="text" id="edit-c-id" placeholder="1-XXXXXXXXXXXX" />
            </div>
            <div class="modal-field">
                <label>Zona / Comuna / Ámbito</label>
                <input type="text" id="edit-c-zona" placeholder="Nacional, Santiago, etc." />
            </div>
            <div class="modal-field">
                <label>Fecha y Hora de Apertura</label>
                <input type="text" id="edit-c-fecha" placeholder="DD-MM-YYYY HH:mm" />
            </div>
            <div class="modal-field">
                <label>Detalle / Descripción Puntual</label>
                <textarea id="edit-c-detalle" placeholder="Descripción clara del problema o contingencia..."></textarea>
            </div>
            <div class="modal-field">
                <label>POPs Afectados (opcional, separados por coma)</label>
                <input type="text" id="edit-c-pops" placeholder="Ej: SCL01, SCL02" />
            </div>
            <div class="modal-field">
                <label>Ticket INC (opcional)</label>
                <input type="text" id="edit-c-inc" placeholder="Ej: INC000009377141" />
            </div>
            <div class="modal-actions">
                <button class="tb-btn" id="modal-edit-cancel">Cancelar</button>
                <button class="btn" id="modal-edit-save" style="background:var(--primary);color:#fff;border:none;border-radius:5px;padding:6px 16px;cursor:pointer;font-weight:600;">💾 Guardar Cambios</button>
            </div>
        </div>
    </div>

    <!-- ============================================================
    TOAST CONTAINER
    ============================================================ -->
    <div id="toast-container"></div>

    <!-- ============================================================
    SCRIPT
    ============================================================ -->
    <script>
        const { ipcRenderer } = require('electron');

        function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }

        // ============================================================
        // ESTADO
        // ============================================================
        let contingencias = [];

        // ============================================================
        // REFERENCIAS DOM
        // ============================================================
        const rawInput = document.getElementById('raw-input');
        const btnProcesar = document.getElementById('btn-procesar');
        const btnLimpiarInput = document.getElementById('btn-limpiar-input');
        const btnLimpiarTodo = document.getElementById('btn-limpiar-todo');
        const btnLimpiar = document.getElementById('btn-limpiar');
        const btnCopyDet = document.getElementById('btn-copy-det');
        const btnCopyBreve = document.getElementById('btn-copy-breve');
        const listContainer = document.getElementById('list-container');
        const countActives = document.getElementById('count-actives');

        // ============================================================
        // TOAST
        // ============================================================
        function showToast(msg, tipo = 'success', duracion = 2500) {
            const container = document.getElementById('toast-container');
            const el = document.createElement('div');
            el.className = 'toast ' + tipo;
            el.textContent = msg;
            container.appendChild(el);
            setTimeout(() => {
                el.style.opacity = '0';
                el.style.transform = 'translateY(10px)';
                el.style.transition = 'opacity 0.3s, transform 0.3s';
                setTimeout(() => el.remove(), 400);
            }, duracion);
        }

        // ============================================================
        // FUNCIÓN ROBUSTA PARA PARSEAR FECHAS
        // ============================================================
        function parseFechaContingencia(fechaStr) {
            if (!fechaStr || typeof fechaStr !== 'string') return null;
            const match = fechaStr.trim().match(/(\d{1,2})[/-](\d{1,2})[/-](\d{4})(?:\s+(\d{1,2}):(\d{2})(?::(\d{2}))?)?/);
            if (!match) return null;

            const dia = parseInt(match[1], 10);
            const mes = parseInt(match[2], 10) - 1;
            const anio = parseInt(match[3], 10);
            const horas = match[4] ? parseInt(match[4], 10) : 0;
            const minutos = match[5] ? parseInt(match[5], 10) : 0;
            const segundos = match[6] ? parseInt(match[6], 10) : 0;

            if (isNaN(dia) || isNaN(mes) || isNaN(anio)) return null;
            return new Date(anio, mes, dia, horas, minutos, segundos);
        }

        function formatearFechaDisplay(fechaObj, originalStr) {
            if (!fechaObj || isNaN(fechaObj.getTime())) return originalStr || 'Fecha no especificada';
            const dia = String(fechaObj.getDate()).padStart(2, '0');
            const mes = String(fechaObj.getMonth() + 1).padStart(2, '0');
            const anio = fechaObj.getFullYear();
            const hora = String(fechaObj.getHours()).padStart(2, '0');
            const min = String(fechaObj.getMinutes()).padStart(2, '0');
            return `${dia}-${mes}-${anio} ${hora}:${min}`;
        }

        function calcularDiasTranscurridos(fechaObj) {
            if (!fechaObj || isNaN(fechaObj.getTime())) return '00 días';
            const ahora = new Date();
            const diffMs = ahora.getTime() - fechaObj.getTime();
            const dias = Math.max(0, Math.floor(diffMs / (1000 * 60 * 60 * 24)));
            if (dias === 1) return '01 día';
            return String(dias).padStart(2, '0') + ' días';
        }

        // ============================================================
        // FUNCIONES DE PROCESAMIENTO Y PARSER INTELIGENTE
        // ============================================================

        function limpiarZona(zonaRaw) {
            if (!zonaRaw || typeof zonaRaw !== 'string') return 'Nacional';
            let z = zonaRaw.trim();

            // 1. Quitar prefijos como "Comuna:", "Sector:", "Zona:", "Localidad:", "Distrito:", "Ciudad:"
            z = z.replace(/^(?:comuna|sector|zona|localidad|distrito|ciudad)\s*[:—–-]\s*/i, '');

            // 2. Si es placeholder genérico "XX", "N/A", "Desconocida", "Sin comuna", "Varias", "Por definir" -> "Nacional"
            if (/^(?:xx|n\/?a|desconocida|sin\s+comuna|por\s+definir|\?+)$/i.test(z)) {
                return 'Nacional';
            }

            // 3. Quitar sufijos de región como ", XIV Región", ", RM", ", III R", ", V Región", ", Región Metropolitana", etc.
            z = z.replace(/[,\s-]+(?:\b[IVXLCDM]+\b(?:\s*R\b|\s*Regi[oó]n\b)?|\bRM\b|\bRegi[oó]n\s+Metropolitana\b|\bR\.?M\.?\b|\bRegi[oó]n\b).*$/i, '');

            // 4. Quitar códigos de POP/sitio pegados al final (ej: "Curanilahue GVB013" -> "Curanilahue")
            z = z.replace(/\s+[A-Z]{2,3}[0-9]{1,4}\b.*$/i, '');

            // 5. Quitar paréntesis o acotaciones secundarias
            z = z.replace(/\s*\([^)]*\)/g, '');

            // 6. Quitar caracteres extraños o puntuación sobrante
            z = z.replace(/^[*#📍📌>–-]\s*/, '').replace(/[–—,;:\.\-]+$/, '').trim();

            if (!z || z.length < 2) return 'Nacional';

            // Capitalizar si viene todo en mayúsculas o minúsculas
            if (z === z.toUpperCase() || z === z.toLowerCase()) {
                z = z.toLowerCase().replace(/(?:^|\s|-)[a-záéíóúñ]/g, char => char.toUpperCase());
            }

            return z || 'Nacional';
        }

        function esDetalleGenerico(texto) {
            if (!texto || typeof texto !== 'string') return true;
            const t = texto.trim().toLowerCase();
            if (!t || t === '(sin detalle adicional)' || t === 'sin detalle' || t === 'incidencia operacional en curso') return true;
            const genericos = [
                'comunicación voz', 'comunicacion voz', 'problemas de cobertura', 'serv. voz y datos congestión',
                'serv. voz y datos congestion', 'servicio tv', 'canal premium no disponible', 'dificultad canal digital',
                'gestionar mis recargas', 'no puede recargar', 'servicio de recarga', 'activación de móviles',
                'activacion de moviles', 'sistemas de atencion', 'sistemas de atención', 'dificultad sistema de atención',
                'escalamiento a sistema', 'trabajo programado', 'entel', 'integración', 'integracion'
            ];
            return genericos.includes(t);
        }

        function extraerPOPs(texto) {
            if (!texto) return [];
            const regex = /\b([A-Z]{2,3}[0-9]{1,4})\b/g;
            const matches = texto.match(regex);
            if (!matches) return [];
            const stopWords = ['TEC', 'SITIO', 'NOMBRE', 'COMUNA', 'REGION', 'POP', 'LTE', '3G', '4G', '5G', 'INC', 'UID', 'ID', 'CRM', 'APP', 'OT', 'NC', 'OCC'];
            const pops = matches
                .filter(p => !stopWords.includes(p))
                .map(p => p.toUpperCase());
            return [...new Set(pops)].sort();
        }

        function extraerDetallePuntual(chunk, id, zona, inc) {
            if (!chunk) return 'Incidencia operacional en curso';
            const lines = chunk.split('\n').map(l => l.trim()).filter(l => l.length > 0);

            // 1. Alta prioridad: Líneas explícitas de contingencia preventiva o falla
            for (const line of lines) {
                if (/^CONTINGENCIA\s+PREVENTIVA\s*[-–:]/i.test(line)) return line.trim();
                if (/^CONTINGENCIA\s*[-–:]/i.test(line)) return line.trim();
                if (/^INCIDENCIA\s*[-–:]/i.test(line)) return line.trim();
                if (/^FALLA\s*[-–:]/i.test(line)) return line.trim();
            }

            // 2. Líneas descriptivas independientes en renglones posteriores (ej: "Dificultad para visualizar TNT Sports en applicativo HBO MAX")
            for (let i = 1; i < lines.length; i++) {
                const line = lines[i];
                if (/^INC\d+/i.test(line) && line.includes(' - ')) {
                    // Es una línea técnica de INC de red (ej: "INC000009408613 - Caída de Sitios...")
                    const fallaMatch = line.match(/(?:-\s*)([A-Za-záéíóúÁÉÍÓÚñÑ\s]+?)(?=\s+en\s+Comuna|\s+en\s+[A-Z]|\s+Causa:|\s+Lista\s+de|\s*$)/i);
                    const causaMatch = line.match(/Causa:\s*([^L\n]+?)(?=\s+Lista\s+de|\s+TEC|\s*$)/i);
                    const tipoFalla = fallaMatch ? fallaMatch[1].trim() : '';
                    let causa = causaMatch ? causaMatch[1].trim() : '';
                    if (/^\(causa por definir\)$/i.test(causa) || /^por definir$/i.test(causa)) causa = '';
                    if (tipoFalla && causa) return `${tipoFalla} — ${causa}`;
                    if (tipoFalla) return tipoFalla;
                    if (causa) return causa;
                    continue;
                }

                // Descartar renglones de sólo ID, sólo INC, sólo fechas, scripts de atención o derivación
                if (/^\s*INC\d+\s*$/i.test(line)) continue;
                if (/^\s*\d{1,2}[/-]\d{1,2}[/-]\d{4}/.test(line)) continue;
                if (/^Hola\s+\(/i.test(line) || /^Estimado\b/i.test(line) || /^Hola\s+[a-zA-Z]/i.test(line)) continue;
                if (/^Derivar\s+al\s+cliente/i.test(line)) continue;

                // Limpiar tabs y pipes
                const cleanLine = line.replace(/[\t|]+/g, ' ').replace(/^[*#📍📌>–-]\s*/, '').trim();
                if (cleanLine.length >= 8 && !cleanLine.startsWith('<') && !cleanLine.startsWith('INC000')) {
                    return cleanLine;
                }
            }

            // 3. Si sólo hay una línea (o no se encontró en renglones posteriores), examinar columnas tabuladas
            const candidates = [];
            for (const line of lines) {
                const parts = (line.includes('\t') ? line.split('\t') : line.split('|')).map(p => p.trim()).filter(p => p.length > 0);
                for (const part of parts) {
                    if (part === id || part.includes(id)) continue;
                    if (/^\d{1,2}[/-]\d{1,2}[/-]\d{4}/.test(part)) continue;
                    if (/^INC\d+/i.test(part)) continue;
                    if (/^POPs?:/i.test(part)) continue;
                    if (/^\d{1,2}\s+d[íi]as?/i.test(part)) continue;
                    if (/^(Abierto|Cerrado|En Proceso|Pendiente|Cancelado)$/i.test(part)) continue;
                    if (/^(Movil|Hogar|Movil\/Hogar|Fija|Empresas|Pyme)$/i.test(part)) continue;
                    if (/^(Nacional|RM|Santiago|Valparaíso|Concepción|Varias|Desconocida)$/i.test(part)) continue;
                    if (/^EJEC\.\s+/i.test(part) || /^EJECUTIVO\b/i.test(part) || /^INTEGRACI[ÓO]N\b/i.test(part)) continue;
                    if (/^Hola\s+\(/i.test(part) || /^Estimado\b/i.test(part) || /^Hola\s+[a-zA-Z]/i.test(part)) continue;
                    if (/^En estos momentos el servicio/i.test(part)) continue;
                    if (/^Derivar\s+al\s+cliente/i.test(part)) continue;
                    if (/^(Servicio TV|Comunicación Voz|Problemas de cobertura|Gestionar mis recargas|Escalamiento a sistema|Dificultad sistema de atención|Servicio de Recarga|Activación de móviles|Sistemas de Atencion|No puede recargar|Canal premium no disponible|Dificultad Canal Digital)$/i.test(part)) continue;
                    if (/^Serv\.\s+Voz/i.test(part) || /^Trabajo\s+Programado/i.test(part) || /^Entel$/i.test(part)) continue;

                    const clean = part.replace(/^[*#📍📌>–-]\s*/, '').trim();
                    if (clean.length >= 6 && !clean.startsWith('<')) {
                        candidates.push(clean);
                    }
                }
            }

            if (candidates.length > 0) {
                return candidates[0];
            }

            // 4. Si hay categorías de CRM concatenadas
            const catMatch = chunk.match(/(?:Gestionar mis recargas|Escalamiento a sistema|Dificultad sistema de atención|Servicio de Recarga|Activación de móviles|Sistemas de Atencion|Servicio TV|Canal premium no disponible|Dificultad Canal Digital)/gi);
            if (catMatch && catMatch.length > 0) {
                return [...new Set(catMatch)].join(' — ');
            }

            // 5. Buscar descripciones técnicas de red
            const redDesc = chunk.match(/(?:Lentitud en OT|Caída de Sitios|Corte de Energía|Corte Energía|Intermitencia|Corte de fibra|Corte de Fibra|Falla HW)/i);
            if (redDesc) return redDesc[0];

            return 'Incidencia operacional en curso';
        }

        function procesarContingencias(raw) {
            if (!raw || !raw.trim()) {
                showToast('⚠️ No hay texto para procesar.', 'warning');
                return false;
            }

            const defaultDate = "Fecha no especificada";
            const nuevasContingencias = [];

            // Dividir por ID 1-XXXXXXXXXXXX
            const chunks = raw.split(/(?=(?:^|\n)\s*1-\d{11,12}\b)/).map(c => c.trim()).filter(c => c.length > 0);

            if (chunks.length > 0 && chunks.some(c => /1-\d{11,12}/.test(c))) {
                chunks.forEach(chunk => {
                    const idMatch = chunk.match(/\b(1-\d{11,12})\b/);
                    if (!idMatch) return;
                    const id = idMatch[1];

                    // Fecha
                    const dateMatch = chunk.match(/(\d{1,2}[/-]\d{1,2}[/-]\d{4}(?:\s+\d{1,2}:\d{2}(?::\d{2})?)?)/);
                    let fechaRaw = dateMatch ? dateMatch[1] : defaultDate;
                    const dtObj = parseFechaContingencia(fechaRaw);
                    const fechaDisplay = dtObj ? formatearFechaDisplay(dtObj, fechaRaw) : fechaRaw;

                    // Zona
                    let zona = "Nacional";
                    const tabParts = chunk.split('\t').map(p => p.trim());
                    if (tabParts.length >= 7) {
                        const candidateZona = tabParts[6];
                        if (candidateZona && !/^\d+$/.test(candidateZona) && candidateZona.length < 45) {
                            zona = candidateZona;
                        }
                    } else if (chunk.includes('|')) {
                        const pipeParts = chunk.split('|').map(p => p.replace(/[*#📍📌]/g, '').trim());
                        if (pipeParts.length >= 2 && pipeParts[1]) {
                            zona = pipeParts[1];
                        }
                    } else if (dateMatch) {
                        const textAfterDate = chunk.substring(chunk.indexOf(dateMatch[1]) + dateMatch[1].length).trim();
                        const zonaMatch = textAfterDate.match(/^([a-zA-ZáéíóúÁÉÍÓÚñÑ\s]+?)(?=\t|Serv\.|Trabajo|INC|En estos|$)/);
                        if (zonaMatch && zonaMatch[1].trim()) {
                            zona = zonaMatch[1].trim();
                        }
                    }

                    // Sanitizar zona (eliminar prefijos, sufijos de región, POPs pegados)
                    zona = limpiarZona(zona);

                    // POPs
                    const pops = extraerPOPs(chunk);

                    // INC
                    const incMatch = chunk.match(/\b(INC\d{8,14})\b/i);
                    const inc = incMatch ? incMatch[1].toUpperCase() : '';

                    // Detalle puntual
                    const detalle = extraerDetallePuntual(chunk, id, zona, inc);

                    nuevasContingencias.push({
                        id,
                        zona: zona || 'Nacional',
                        inicio: fechaDisplay,
                        detalle: detalle || '',
                        pops: pops || [],
                        inc: inc || '',
                        textoCompleto: chunk
                    });
                });
            } else {
                const lineas = raw.split('\n');
                lineas.forEach(linea => {
                    if (!linea.trim()) return;
                    const idMatch = linea.match(/\b(1-\d{11,12})\b/);
                    if (!idMatch) return;
                    const id = idMatch[1];
                    let zona = "Nacional";
                    let fecha = defaultDate;
                    let detalle = '';

                    if (linea.includes('|')) {
                        const partes = linea.split('|').map(p => p.replace(/[*#📍📌]/g, '').trim());
                        if (partes.length >= 2 && partes[1]) zona = partes[1];
                        if (partes.length >= 3 && partes[2]) fecha = partes[2];
                        if (partes.length >= 4 && partes[3]) detalle = partes[3];
                    } else if (linea.includes('📍') || linea.includes('📌') || linea.includes('*')) {
                        let texto = linea.replace(id, '').replace(/[📍📌]/g, '').trim();
                        const starMatch = texto.match(/\*([^*]+)\*/);
                        if (starMatch) {
                            texto = starMatch[1].trim();
                        }
                        if (texto.includes('—')) {
                            const parts = texto.split('—').map(p => p.trim());
                            zona = parts[0] || 'Nacional';
                            detalle = parts.slice(1).join(' — ');
                        } else if (texto.includes('-') && !texto.toLowerCase().startsWith('contingencia')) {
                            const parts = texto.split('-').map(p => p.trim());
                            zona = parts[0] || 'Nacional';
                            detalle = parts.slice(1).join(' - ');
                        } else {
                            const comunas = ['santiago', 'valparaíso', 'valparaiso', 'concepción', 'concepcion', 'antofagasta', 'temuco', 'rancagua', 'talca', 'arica', 'iquique', 'puerto montt', 'coquimbo', 'la serena', 'chillán', 'chillan', 'calama', 'copiapó', 'copiapo', 'osorno', 'quillota', 'curicó', 'curico', 'punta arenas', 'los ángeles', 'los angeles', 'coronel', 'san antonio', 'melipilla', 'linares', 'ovalle', 'quillota', 'quilpué', 'quilpue', 'villa alemana', 'maipú', 'maipu', 'puente alto', 'la florida', 'las condes', 'providencia', 'ñuñoa', 'nunoa', 'san bernardo'];
                            const low = texto.toLowerCase();
                            if (comunas.some(c => low === c || low.startsWith(c + ' '))) {
                                zona = texto;
                                detalle = '';
                            } else if (low === 'nacional' || low === 'desconocida') {
                                zona = 'Nacional';
                                detalle = '';
                            } else {
                                zona = 'Nacional';
                                detalle = texto;
                            }
                        }
                    }

                    zona = limpiarZona(zona);
                    if (!detalle) detalle = extraerDetallePuntual(linea, id, zona, '');
                    const dtObj = parseFechaContingencia(fecha);
                    const fechaDisplay = dtObj ? formatearFechaDisplay(dtObj, fecha) : fecha;

                    nuevasContingencias.push({
                        id,
                        zona,
                        inicio: fechaDisplay,
                        detalle,
                        pops: extraerPOPs(linea),
                        inc: (linea.match(/\b(INC\d{8,14})\b/i) || [])[1] || '',
                        textoCompleto: linea
                    });
                });
            }

            if (!nuevasContingencias.length) {
                showToast('⚠️ No se encontraron contingencias válidas en el texto.', 'warning');
                return false;
            }

            contingencias = nuevasContingencias;

            // Ordenar por fecha descendente
            contingencias.sort((a, b) => {
                const da = parseFechaContingencia(a.inicio);
                const db = parseFechaContingencia(b.inicio);
                if (!da && !db) return 0;
                if (!da) return 1;
                if (!db) return -1;
                return db - da;
            });

            guardarYNotificar();
            actualizarUI();
            showToast(`✅ Radar actualizado: ${contingencias.length} casos activos.`, 'success');
            return true;
        }

        // ============================================================
        // ACTUALIZAR UI
        // ============================================================
        function actualizarUI() {
            countActives.textContent = contingencias.length;

            if (!contingencias.length) {
                listContainer.innerHTML =
                    `<div class="empty-state">No hay contingencias cargadas.<br><span style="opacity:0.5;font-size:10px;">Pega un reporte para comenzar</span></div>`;
                return;
            }

            let html = '';
            contingencias.forEach(c => {
                const fechaObj = parseFechaContingencia(c.inicio);
                const fechaDisplay = fechaObj ? formatearFechaDisplay(fechaObj, c.inicio) : (c.inicio || 'Sin fecha');
                const diasStr = calcularDiasTranscurridos(fechaObj);
                const pops = Array.isArray(c.pops) ? c.pops : extraerPOPs(c.textoCompleto || '');
                const detalle = (c.detalle || '').trim();
                const tieneDetalleRelevante = detalle && !esDetalleGenerico(detalle);

                html += `
                    <div class="c-card" data-id="${esc(c.id)}">
                        <div class="c-row">
                            <span class="c-zona">📍 ${esc(c.zona || 'Nacional')}</span>
                            <div class="c-actions">
                                <button class="c-btn-edit" data-action="edit" title="Editar contingencia">✏️</button>
                                <button class="c-del" data-action="del" title="Eliminar">✕</button>
                            </div>
                        </div>
                        <div class="c-row">
                            <span class="c-id" data-action="copy" title="Copiar ID">📋 ${esc(c.id)}</span>
                            <span class="c-meta">${esc(fechaDisplay)} | ${esc(diasStr)}</span>
                        </div>
                        ${tieneDetalleRelevante ? `<div class="c-detalle">${esc(detalle)}</div>` : ''}
                        ${pops.length ? `<div class="c-meta" style="margin-top:2px;"><span class="c-pops">📡 POPs: ${esc(pops.join(', '))}</span></div>` : ''}
                        ${c.inc ? `<div class="c-meta" style="margin-top:2px;"><span class="c-inc">🎫 ${esc(c.inc)}</span></div>` : ''}
                    </div>
                `;
            });
            listContainer.innerHTML = html;

            listContainer.querySelectorAll('[data-action="edit"]').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const id = btn.closest('.c-card').dataset.id;
                    abrirEditorContingencia(id);
                });
            });
            listContainer.querySelectorAll('[data-action="del"]').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    eliminar(btn.closest('.c-card').dataset.id);
                });
            });
            listContainer.querySelectorAll('[data-action="copy"]').forEach(span => {
                span.addEventListener('click', (e) => {
                    e.stopPropagation();
                    copiarId(span.closest('.c-card').dataset.id);
                });
            });
        }

        // ============================================================
        // EDITOR DE TARJETAS
        // ============================================================
        let editingIndex = -1;

        function abrirEditorContingencia(id) {
            const idx = contingencias.findIndex(c => c.id === id);
            if (idx === -1) return;
            editingIndex = idx;
            const c = contingencias[idx];

            document.getElementById('edit-c-id').value = c.id || '';
            document.getElementById('edit-c-zona').value = c.zona || 'Nacional';
            document.getElementById('edit-c-fecha').value = c.inicio || '';
            document.getElementById('edit-c-detalle').value = c.detalle || '';
            document.getElementById('edit-c-pops').value = (c.pops || []).join(', ');
            document.getElementById('edit-c-inc').value = c.inc || '';

            document.getElementById('modal-edit-contingencia').classList.add('show');
            document.getElementById('edit-c-detalle').focus();
        }

        function cerrarEditorContingencia() {
            document.getElementById('modal-edit-contingencia').classList.remove('show');
            editingIndex = -1;
        }

        function guardarEdicionContingencia() {
            if (editingIndex < 0 || !contingencias[editingIndex]) return;
            const c = contingencias[editingIndex];

            const newId = document.getElementById('edit-c-id').value.trim();
            const newZona = document.getElementById('edit-c-zona').value.trim() || 'Nacional';
            const newFecha = document.getElementById('edit-c-fecha').value.trim();
            const newDetalle = document.getElementById('edit-c-detalle').value.trim();
            const rawPops = document.getElementById('edit-c-pops').value;
            const newPops = rawPops.split(',').map(p => p.trim().toUpperCase()).filter(p => p.length > 0);
            const newInc = document.getElementById('edit-c-inc').value.trim().toUpperCase();

            if (!newId) {
                showToast('⚠️ El ID es obligatorio.', 'warning');
                return;
            }

            c.id = newId;
            c.zona = newZona;
            c.inicio = newFecha || c.inicio;
            c.detalle = newDetalle;
            c.pops = newPops;
            c.inc = newInc;

            guardarYNotificar();
            actualizarUI();
            cerrarEditorContingencia();
            showToast('✅ Contingencia modificada guardada.', 'success');
        }

        // ============================================================
        // FUNCIONES DE ACCIÓN
        // ============================================================
        function eliminar(id) {
            contingencias = contingencias.filter(c => c.id !== id);
            guardarYNotificar();
            actualizarUI();
            showToast('🗑 Contingencia eliminada.', 'success');
        }

        function copiarId(id) {
            navigator.clipboard.writeText(id).then(() => {
                showToast('📋 ID copiado.', 'success');
            }).catch(() => {});
        }

        function limpiarTodo() {
            if (!contingencias.length) {
                showToast('⚠️ No hay contingencias para limpiar.', 'warning');
                return;
            }
            if (confirm('¿Deseas limpiar todo el radar de contingencias?')) {
                contingencias = [];
                guardarYNotificar();
                actualizarUI();
                showToast('🗑 Radar limpiado.', 'success');
            }
        }

        function guardarYNotificar() {
            ipcRenderer.send('save-contingencias', contingencias);
            ipcRenderer.send('contingencias-updated', contingencias);
        }

        // ============================================================
        // FORMATOS DE COPIA
        // ============================================================

        function generarDetallado() {
            if (!contingencias.length) {
                showToast('⚠️ No hay contingencias para copiar.', 'warning');
                return null;
            }

            const conComuna = contingencias.filter(c =>
                c.zona && !['Desconocida', 'Nacional', 'Varias'].includes(c.zona)
            );
            const comunasUnicas = [...new Set(conComuna.map(c => c.zona))].sort();
            const totalComunas = comunasUnicas.length;
            const totalContingencias = contingencias.length;

            let lines = [];
            lines.push('📌 *CONTINGENCIAS ACTIVAS* ✍');
            lines.push('');
            lines.push(
                `🗺 *COMUNAS/DISTRITOS AFECTADOS (${totalComunas}) | CONTINGENCIAS ÚNICAS (${totalContingencias}) :*`
            );
            lines.push('');
            if (comunasUnicas.length > 0) {
                lines.push(`> *${comunasUnicas.join(', ')}*`);
            } else {
                lines.push(`> *Nacional / Sistemas de Atención*`);
            }
            lines.push('');
            lines.push('**Detalle ordenado de forma descendente por fecha de apertura** 👇🏻');
            lines.push('');

            const sorted = [...contingencias];
            sorted.sort((a, b) => {
                const da = parseFechaContingencia(a.inicio);
                const db = parseFechaContingencia(b.inicio);
                if (!da && !db) return 0;
                if (!da) return 1;
                if (!db) return -1;
                return db - da;
            });

            sorted.forEach(c => {
                const zona = c.zona || 'Nacional';
                const fechaObj = parseFechaContingencia(c.inicio);
                const fechaDisplay = fechaObj ? formatearFechaDisplay(fechaObj, c.inicio) : c.inicio;
                const diasStr = calcularDiasTranscurridos(fechaObj);
                const pops = Array.isArray(c.pops) ? c.pops : extraerPOPs(c.textoCompleto || '');
                const detalle = (c.detalle || '').trim();
                const tieneDetalleRelevante = detalle && !esDetalleGenerico(detalle);

                lines.push(`📍 ${c.id} | *${zona}* | ${fechaDisplay} | ${diasStr}`);
                if (pops.length > 0) {
                    lines.push(`> POP afectados: ${pops.join(', ')}`);
                    if (tieneDetalleRelevante) {
                        lines.push(`> Detalle: ${detalle}`);
                    }
                } else if (tieneDetalleRelevante) {
                    lines.push(`> ${detalle}`);
                } else {
                    lines.push(`> (Sin detalle adicional)`);
                }
                lines.push('');
            });

            return lines.join('\n');
        }

        function generarBreve() {
            if (!contingencias.length) {
                showToast('⚠️ No hay contingencias para copiar.', 'warning');
                return null;
            }

            const conComuna = contingencias.filter(c =>
                c.zona && !['Desconocida', 'Nacional', 'Varias'].includes(c.zona)
            );
            const sinComuna = contingencias.filter(c =>
                !c.zona || ['Desconocida', 'Nacional', 'Varias'].includes(c.zona)
            );

            // Ordenar comunas alfabéticamente
            const sortedConComuna = [...conComuna].sort((a, b) => a.zona.localeCompare(b.zona));

            // Ordenar no-red / sistemas por fecha descendente
            const sortedSinComuna = [...sinComuna].sort((a, b) => {
                const da = parseFechaContingencia(a.inicio);
                const db = parseFechaContingencia(b.inicio);
                if (!da && !db) return 0;
                if (!da) return 1;
                if (!db) return -1;
                return db - da;
            });

            let lines = [];
            lines.push('📌*CONTINGENCIAS*📌');
            lines.push('');

            // 1. Contingencias de red / comuna (formato breve estrictamente limpio: Comuna e ID)
            sortedConComuna.forEach(c => {
                lines.push(`📍 *${c.zona}* ${c.id}`);
            });

            // Salto de línea si existen contingencias de ambos tipos
            if (sortedConComuna.length > 0 && sortedSinComuna.length > 0) {
                lines.push('');
            }

            // 2. Contingencias que no son de red (sistemas / comerciales / nacional)
            sortedSinComuna.forEach(c => {
                const detalleLimpio = (c.detalle || '').replace(/\s+/g, ' ').replace(/[*]/g, '').trim();
                const textoMostrar = detalleLimpio || c.zona || 'Nacional';
                lines.push(`📍 *${textoMostrar}* ${c.id}`);
            });

            return lines.join('\n');
        }

        // ============================================================
        // COPIAR FORMATOS
        // ============================================================
        function copiarDetallado() {
            const texto = generarDetallado();
            if (!texto) return;
            navigator.clipboard.writeText(texto).then(() => {
                showToast('📋 Texto detallado copiado al portapapeles.', 'success');
            }).catch(() => {
                showToast('❌ Error al copiar.', 'error');
            });
        }

        function copiarBreve() {
            const texto = generarBreve();
            if (!texto) return;
            navigator.clipboard.writeText(texto).then(() => {
                showToast('📋 Texto breve copiado al portapapeles.', 'success');
            }).catch(() => {
                showToast('❌ Error al copiar.', 'error');
            });
        }

        // ============================================================
        // EVENTOS
        // ============================================================
        btnProcesar.addEventListener('click', () => {
            const raw = rawInput.value;
            if (raw.trim()) {
                const ok = procesarContingencias(raw);
                if (ok) rawInput.value = '';
            } else {
                showToast('⚠️ Pega un texto para escanear.', 'warning');
            }
        });

        btnLimpiarInput.addEventListener('click', () => {
            rawInput.value = '';
        });

        btnLimpiarTodo.addEventListener('click', limpiarTodo);
        btnLimpiar.addEventListener('click', limpiarTodo);
        btnCopyDet.addEventListener('click', copiarDetallado);
        btnCopyBreve.addEventListener('click', copiarBreve);

        // Modal eventos
        document.getElementById('modal-edit-close').addEventListener('click', cerrarEditorContingencia);
        document.getElementById('modal-edit-cancel').addEventListener('click', cerrarEditorContingencia);
        document.getElementById('modal-edit-save').addEventListener('click', guardarEdicionContingencia);
        document.getElementById('modal-edit-contingencia').addEventListener('click', (e) => {
            if (e.target === document.getElementById('modal-edit-contingencia')) cerrarEditorContingencia();
        });

        document.addEventListener('keydown', (e) => {
            const modal = document.getElementById('modal-edit-contingencia');
            if (modal && modal.classList.contains('show')) {
                if (e.key === 'Escape') {
                    cerrarEditorContingencia();
                } else if ((e.ctrlKey || e.metaKey) && e.key === 's') {
                    e.preventDefault();
                    guardarEdicionContingencia();
                }
            }
        });

        // ============================================================
        // INIT (IPC)
        // ============================================================
        ipcRenderer.on('init-contingencias', (e, data) => {
            contingencias = Array.isArray(data) ? data : [];
            actualizarUI();
        });

        // ============================================================
        // INICIO
        // ============================================================
        showToast('📡 Radar de Contingencias PRO cargado.', 'success', 2000);
    </script>
</body>
</html>
