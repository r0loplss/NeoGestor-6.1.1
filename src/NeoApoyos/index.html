<!DOCTYPE html>
<html lang="es" data-neo-theme="dark">
<head>
<meta charset="UTF-8" />
<title>NeoApoyos</title>
<style>
    :root {
        --neo-accent: #2fcbf1;
        --accent: var(--neo-accent);
        --accent-2: color-mix(in srgb, var(--neo-accent) 60%, #ffffff);
        --accent-soft: color-mix(in srgb, var(--neo-accent) 20%, transparent);
        --glass: linear-gradient(180deg, rgba(34,42,60,.74), rgba(18,24,36,.68));
        --glass-strong: linear-gradient(180deg, rgba(54,64,86,.9), rgba(30,38,54,.84));
        --glass-border: rgba(255,255,255,.14);
        --glass-hi: rgba(255,255,255,.34);
        --txt: #eaf1fb; --txt-dim: #a7b6cc; --txt-faint: #6b7a90;
        --radius: 20px; --radius-sm: 13px;
        --ease: cubic-bezier(.22, 1, .36, 1);
        --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }
    html[data-neo-theme="light"] {
        --glass: linear-gradient(180deg, rgba(255,255,255,.78), rgba(255,255,255,.62));
        --glass-strong: linear-gradient(180deg, rgba(255,255,255,.95), rgba(255,255,255,.84));
        --glass-border: rgba(20,30,50,.14); --glass-hi: rgba(255,255,255,.7);
        --txt: #16202e; --txt-dim: #4a5568; --txt-faint: #8a97ab;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; background: transparent; color: var(--txt); font-family: var(--font); -webkit-font-smoothing: antialiased; user-select: none; }
    .glass { background: var(--glass); -webkit-backdrop-filter: blur(20px) saturate(160%); backdrop-filter: blur(20px) saturate(160%); border: 1px solid var(--glass-border); box-shadow: 0 18px 50px rgba(0,0,0,.4), inset 0 1px 0 var(--glass-hi); }

    .edge { position: fixed; top: 0; bottom: 0; width: 3px; background: linear-gradient(180deg, transparent, var(--accent), transparent); opacity: .55; z-index: 40; }
    body:not(.right):not(.hidden) .edge { left: 0; right: auto; }
    body:not(.right).hidden .edge { right: 0; left: auto; }
    body.right:not(.hidden) .edge { right: 0; left: auto; }
    body.right.hidden .edge { left: 0; right: auto; }

    .dock { position: fixed; top: 9px; bottom: 9px; left: 9px; width: 78px; border-radius: var(--radius); padding: 8px 6px 6px; display: flex; flex-direction: column; gap: 6px; z-index: 60; -webkit-app-region: drag; transition: opacity .4s var(--ease); }
    body.right .dock { left: auto; right: 9px; }
    .dock.ghost { opacity: .18; }
    .dock::before { content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; background: linear-gradient(180deg, rgba(255,255,255,.10), transparent 20%); }

    .dock-crown { display: flex; align-items: center; gap: 6px; flex: 0 0 auto; }
    .dock-grip { height: 30px; flex: 1; display: flex; align-items: center; justify-content: center; color: var(--txt-faint); }
    .dock-grip span { width: 28px; height: 4px; border-radius: 4px; background: currentColor; opacity: .35; transition: opacity .15s; }
    .dock:hover .dock-grip span { opacity: .8; }

    .dock-tools { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; gap: 7px; align-items: flex-start; overflow-y: auto; overflow-x: hidden; padding: 2px; -webkit-app-region: no-drag; }
    body.right .dock-tools { align-items: flex-end; }
    .dock-tools::-webkit-scrollbar { width: 4px; }
    .dock-tools::-webkit-scrollbar-thumb { background: rgba(255,255,255,.18); border-radius: 4px; }
    .dock-tools::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,.32); }

    .tool { position: relative; width: 100%; height: 50px; flex: 0 0 auto; display: flex; align-items: center; justify-content: center; border: 1px solid transparent; border-radius: var(--radius-sm); background: transparent; color: var(--txt-dim); cursor: pointer; transition: background .18s, border-color .18s, color .18s; }
    .tool .tile { width: 38px; height: 38px; display: grid; place-items: center; font-size: 20px; border-radius: 12px; background: var(--glass-strong); border: 1px solid var(--glass-border); box-shadow: inset 0 1px 0 rgba(255,255,255,.25); }
    .tool:hover { background: var(--glass-strong); border-color: var(--glass-border); color: var(--txt); }
    .tool.active { color: var(--txt); background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 45%, transparent); }
    .tool.active .tile { background: linear-gradient(145deg, var(--accent), var(--accent-2)); color: #04121a; border-color: transparent; }

    .dock-foot { display: flex; flex-direction: column; gap: 6px; padding-top: 6px; border-top: 1px solid var(--glass-border); -webkit-app-region: no-drag; }
    .dock-btn { width: 100%; height: 42px; display: flex; align-items: center; justify-content: center; border: 1px solid transparent; border-radius: 12px; background: transparent; color: var(--txt-dim); cursor: pointer; font-size: 17px; transition: background .18s, color .18s, border-color .18s; }
    .dock-btn:hover { background: var(--glass-strong); border-color: var(--glass-border); color: var(--txt); }
    .dock-btn.on { color: var(--txt); background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 45%, transparent); }
    .dock-btn.danger:hover { color: #ffd7d7; background: rgba(239,68,68,.16); border-color: rgba(239,68,68,.35); }
    .dock-crown .dock-btn { width: 30px; height: 30px; border-radius: 10px; font-size: 13px; -webkit-app-region: no-drag; }

    .dock-resize { height: 12px; flex: 0 0 auto; display: flex; align-items: center; justify-content: center; cursor: ns-resize; -webkit-app-region: no-drag; color: var(--txt-faint); }
    .dock-resize span { width: 34px; height: 4px; border-radius: 4px; background: currentColor; opacity: .3; }
    .dock:hover .dock-resize span { opacity: .7; }
</style>
</head>
<body>
    <div class="edge" id="edge"></div>
    <aside class="dock glass" id="dock">
        <div class="dock-crown">
            <div class="dock-grip" title="Arrastrar para mover (se ancla a izquierda/derecha)"><span></span></div>
            <button class="dock-btn danger dock-x" id="btnExit" title="Cerrar NeoApoyos">✕</button>
        </div>
        <nav class="dock-tools" id="tools"></nav>
        <div class="dock-foot">
            <button class="dock-btn" id="btnNotes" title="Mis Notas">🗒️</button>
            <button class="dock-btn" id="btnSettings" title="Ajustes">⚙️</button>
            <button class="dock-btn" id="btnHide" title="Ocultar al borde">⤺</button>
        </div>
        <div class="dock-resize" id="resizeH" title="Arrastrar para ajustar la altura"><span></span></div>
    </aside>

    <script>
    (function () {
        'use strict';
        var ipc = require('electron').ipcRenderer;
        var TOOLS = [
            { id: 'contingencias', icon: '📡', name: 'Radar Contingencias', desc: 'Fallas masivas en tiempo real' },
            { id: 'trafico',       icon: '📶', name: 'Tráfico PRO',         desc: 'Analizador de consumos' },
            { id: 'tipificador-v2',icon: '⌨️', name: 'Tipificador V2',      desc: 'Tipificaciones Siebel' },
            { id: 'enlaces',       icon: '🔗', name: 'Mis Enlaces',         desc: 'Accesos y herramientas web' },
            { id: 'horarios',      icon: '📅', name: 'Turnos Web',          desc: 'Turnos, breaks y firma' },
            { id: 'occ',           icon: '🧮', name: 'Calculadora OCC',     desc: 'Cobros proporcionales' },
            { id: 'calculadora-dias', icon: '🗓️', name: 'Calculadora de Días', desc: 'Hitos de Plan Mandato' },
            { id: 'ciclos',        icon: '🔄', name: 'Cambio de Ciclo',     desc: 'Impacto de ciclo de facturación' },
            { id: 'fast',          icon: '⚡', name: 'Fast',                desc: 'Tarjetas y apuntes rápidos' }
        ];
        var dock = document.getElementById('dock');
        var toolsNav = document.getElementById('tools');
        var bodyEl = document.body;
        var toolBtns = {};
        var panelAbierto = null;

        TOOLS.forEach(function (t) {
            var b = document.createElement('button');
            b.className = 'tool'; b.dataset.tool = t.id;
            b.innerHTML = '<span class="tile">' + t.icon + '</span>';
            b.addEventListener('click', function () { ipc.send('toggle-tool', t.id); cerrarPaneles(); });
            b.addEventListener('mouseenter', function () { mostrarFlyout(b, t); });
            b.addEventListener('mouseleave', ocultarFlyout);
            toolsNav.appendChild(b); toolBtns[t.id] = b;
        });
        ['tool-opened', 'tool-restored', 'tool-focused'].forEach(function (ev) { ipc.on(ev, function (e, id) { if (toolBtns[id]) toolBtns[id].classList.add('active'); }); });
        ipc.on('tool-closed', function (e, id) { if (toolBtns[id]) toolBtns[id].classList.remove('active'); });
        ipc.on('fast-docked-state', function (e, d) { if (toolBtns['fast']) toolBtns['fast'].classList.toggle('active', !!(d && d.visible)); });

        // Flyout (ventana overlay)
        function mostrarFlyout(btn, t) {
            var r = btn.getBoundingClientRect();
            try { ipc.send('apoyo-flyout', { show: true, icon: t.icon, name: t.name, desc: t.desc, sy: Math.round(r.top + window.screenY) }); } catch (e) {}
        }
        function ocultarFlyout() { try { ipc.send('apoyo-flyout', { show: false }); } catch (e) {} }
        toolsNav.addEventListener('scroll', ocultarFlyout, { passive: true });
        toolsNav.addEventListener('wheel', ocultarFlyout, { passive: true });

        // Paneles (ventanas propias)
        function abrirPanel(which) { ipc.send('apoyo-panel', { which: which }); ocultarFlyout(); }
        function cerrarPaneles() { if (panelAbierto) ipc.send('apoyo-panel', { which: null }); }
        function panelesAbiertos() { return panelAbierto !== null; }
        document.getElementById('btnNotes').addEventListener('click', function () { if (panelAbierto === 'notas') cerrarPaneles(); else abrirPanel('notas'); });
        document.getElementById('btnSettings').addEventListener('click', function () { if (panelAbierto === 'ajustes') cerrarPaneles(); else abrirPanel('ajustes'); });
        ipc.on('apoyo-panel-state', function (e, d) {
            panelAbierto = (d && d.which) || null;
            document.getElementById('btnNotes').classList.toggle('on', panelAbierto === 'notas');
            document.getElementById('btnSettings').classList.toggle('on', panelAbierto === 'ajustes');
        });
        window.addEventListener('keydown', function (e) { if (e.key === 'Escape') cerrarPaneles(); });

        // Lado / oculto
        ipc.on('apoyo-estado', function (e, s) { bodyEl.classList.toggle('right', !!(s && s.side === 'right')); bodyEl.classList.toggle('hidden', !!(s && s.hidden)); });

        // Tema (para el look del dock)
        var theme = { mode: 'dark', accent: '#2fcbf1' };
        var mq = null; try { mq = window.matchMedia('(prefers-color-scheme: dark)'); } catch (e) {}
        function resolver(m) { if (m === 'auto') return (mq && mq.matches) ? 'dark' : 'light'; return m === 'light' ? 'light' : 'dark'; }
        function aplicarTema() { document.documentElement.setAttribute('data-neo-theme', resolver(theme.mode)); document.documentElement.style.setProperty('--neo-accent', theme.accent); }
        ipc.on('neo-theme', function (e, t) { if (t) { theme.mode = t.mode || 'dark'; theme.accent = t.accent || theme.accent; aplicarTema(); } });

        // Ghost / auto-ocultar
        var ui = { ghost: false, autohide: false };
        var ghostT = null, hideT = null;
        function setGhost(on) { dock.classList.toggle('ghost', !!on); try { ipc.send('apoyo-fast-opacity', on ? 0.18 : 1); } catch (e) {} }
        function scheduleGhostOrHide() {
            clearTimeout(ghostT); clearTimeout(hideT);
            if (panelesAbiertos()) return;
            if (ui.autohide) { hideT = setTimeout(function () { try { ipc.send('apoyo-hide'); } catch (e) {} }, 400); return; }
            if (ui.ghost) { ghostT = setTimeout(function () { if (!panelesAbiertos()) setGhost(true); }, 1500); }
        }
        dock.addEventListener('mouseenter', function () { clearTimeout(ghostT); clearTimeout(hideT); setGhost(false); });
        dock.addEventListener('mouseleave', function () { ocultarFlyout(); scheduleGhostOrHide(); });
        window.addEventListener('blur', function () { if (ui.ghost && !ui.autohide && !panelesAbiertos()) { clearTimeout(ghostT); ghostT = setTimeout(function () { if (!panelesAbiertos()) setGhost(true); }, 1000); } });
        ipc.on('apoyo-config', function (e, cfg) { if (!cfg) return; if (cfg.theme) { theme.mode = cfg.theme.mode || 'dark'; theme.accent = cfg.theme.accent || theme.accent; aplicarTema(); } if (cfg.ui) { ui.ghost = !!cfg.ui.ghost; ui.autohide = !!cfg.ui.autohide; } });
        ipc.send('apoyo-config-request');
        try { if (mq) mq.addEventListener('change', function () { if (theme.mode === 'auto') aplicarTema(); }); } catch (e) {}

        // Controles
        document.getElementById('btnHide').addEventListener('click', function () { try { ipc.send('apoyo-hide'); } catch (e) {} });
        document.getElementById('btnExit').addEventListener('click', function () { ipc.send('apoyo-quit'); });

        // Altura (tirador inferior)
        var resizeH = document.getElementById('resizeH');
        resizeH.addEventListener('pointerdown', function (e) {
            e.preventDefault();
            try { resizeH.setPointerCapture(e.pointerId); } catch (err) {}
            var move = function (ev) { try { ipc.send('apoyo-resize-h', { h: ev.screenY - window.screenY }); } catch (err) {} };
            var up = function (ev) { resizeH.removeEventListener('pointermove', move); resizeH.removeEventListener('pointerup', up); try { if (ev && ev.pointerId != null) resizeH.releasePointerCapture(ev.pointerId); } catch (err) {} };
            resizeH.addEventListener('pointermove', move); resizeH.addEventListener('pointerup', up);
        });
    })();
    </script>
</body>
</html>
