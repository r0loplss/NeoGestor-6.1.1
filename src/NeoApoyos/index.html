<!DOCTYPE html>
<html lang="es" data-neo-theme="dark">
<head>
<meta charset="UTF-8" />
<title>NeoApoyos</title>
<style>
    /* ============================================================
       NEOAPOYOS v0.2 — Dock inteligente
       Ventana 78px (sin click-through). Crece bajo demanda.
       ============================================================ */
    :root {
        --neo-accent: #2fcbf1;
        --accent: var(--neo-accent);
        --accent-2: color-mix(in srgb, var(--neo-accent) 60%, #ffffff);
        --accent-soft: color-mix(in srgb, var(--neo-accent) 20%, transparent);

        --glass: linear-gradient(180deg, rgba(34,42,60,.74), rgba(18,24,36,.68));
        --glass-strong: linear-gradient(180deg, rgba(54,64,86,.9), rgba(30,38,54,.84));
        --glass-border: rgba(255,255,255,.14);
        --glass-hi: rgba(255,255,255,.34);

        --txt: #eaf1fb;
        --txt-dim: #a7b6cc;
        --txt-faint: #6b7a90;

        --radius: 20px;
        --radius-sm: 13px;
        --ease: cubic-bezier(.22, 1, .36, 1);
        --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }
    html[data-neo-theme="light"] {
        --glass: linear-gradient(180deg, rgba(255,255,255,.78), rgba(255,255,255,.62));
        --glass-strong: linear-gradient(180deg, rgba(255,255,255,.95), rgba(255,255,255,.84));
        --glass-border: rgba(20,30,50,.14);
        --glass-hi: rgba(255,255,255,.7);
        --txt: #16202e; --txt-dim: #4a5568; --txt-faint: #8a97ab;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; background: transparent; color: var(--txt); font-family: var(--font); -webkit-font-smoothing: antialiased; user-select: none; }

    .glass {
        background: var(--glass);
        -webkit-backdrop-filter: blur(20px) saturate(160%);
        backdrop-filter: blur(20px) saturate(160%);
        border: 1px solid var(--glass-border);
        box-shadow: 0 18px 50px rgba(0,0,0,.4), inset 0 1px 0 var(--glass-hi);
    }

    /* Filamento de borde (queda visible cuando el dock se oculta) */
    .edge { position: fixed; top: 0; bottom: 0; width: 3px; background: linear-gradient(180deg, transparent, var(--accent), transparent); opacity: .55; z-index: 40; }
    body:not(.right) .edge { left: 0; }
    body.right .edge { right: 0; }

    /* ============================================================
       BARRA
       ============================================================ */
    .dock {
        position: fixed; top: 9px; bottom: 9px; left: 9px; width: 78px;
        border-radius: var(--radius);
        padding: 8px 6px 6px;
        display: flex; flex-direction: column; gap: 6px;
        z-index: 60;
        -webkit-app-region: drag;
        transition: opacity .4s var(--ease);
    }
    body.right .dock { left: auto; right: 9px; }
    .dock.ghost { opacity: .18; }
    .dock::before { content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; background: linear-gradient(180deg, rgba(255,255,255,.10), transparent 20%); }

    .dock-grip { height: 16px; display: flex; align-items: center; justify-content: center; color: var(--txt-faint); flex: 0 0 auto; }
    .dock-grip span { width: 28px; height: 4px; border-radius: 4px; background: currentColor; opacity: .35; transition: opacity .15s; }
    .dock:hover .dock-grip span { opacity: .8; }

    .dock-tools { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; gap: 7px; align-items: flex-start; overflow-y: auto; overflow-x: hidden; padding: 2px; -webkit-app-region: no-drag; }
    body.right .dock-tools { align-items: flex-end; }
    .dock-tools::-webkit-scrollbar { width: 0; }

    .tool {
        position: relative; width: 100%; height: 50px; flex: 0 0 auto;
        display: flex; align-items: center; justify-content: center;
        border: 1px solid transparent; border-radius: var(--radius-sm);
        background: transparent; color: var(--txt-dim); cursor: pointer;
        transition: background .18s, border-color .18s, color .18s;
    }
    .tool .tile { width: 38px; height: 38px; display: grid; place-items: center; font-size: 20px; border-radius: 12px; background: var(--glass-strong); border: 1px solid var(--glass-border); box-shadow: inset 0 1px 0 rgba(255,255,255,.25); }
    .tool:hover { background: var(--glass-strong); border-color: var(--glass-border); color: var(--txt); }
    .tool.active { color: var(--txt); background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 45%, transparent); }
    .tool.active .tile { background: linear-gradient(145deg, var(--accent), var(--accent-2)); color: #04121a; border-color: transparent; }

    .dock-foot { display: flex; flex-direction: column; gap: 6px; padding-top: 6px; border-top: 1px solid var(--glass-border); -webkit-app-region: no-drag; }
    .dock-btn {
        width: 100%; height: 42px; display: flex; align-items: center; justify-content: center;
        border: 1px solid transparent; border-radius: 12px; background: transparent;
        color: var(--txt-dim); cursor: pointer; font-size: 17px;
        transition: background .18s, color .18s, border-color .18s;
    }
    .dock-btn:hover { background: var(--glass-strong); border-color: var(--glass-border); color: var(--txt); }
    .dock-btn.danger:hover { color: #ffd7d7; background: rgba(239,68,68,.16); border-color: rgba(239,68,68,.35); }

    .dock-resize { height: 12px; flex: 0 0 auto; display: flex; align-items: center; justify-content: center; cursor: ns-resize; -webkit-app-region: no-drag; color: var(--txt-faint); }
    .dock-resize span { width: 34px; height: 4px; border-radius: 4px; background: currentColor; opacity: .3; }
    .dock:hover .dock-resize span { opacity: .7; }

    /* Flyout en píldora (position: fixed → no lo recorta el scroll) */
    #flyout {
        position: fixed; z-index: 200; pointer-events: none;
        display: flex; align-items: center; gap: 10px;
        padding: 0 14px; border-radius: var(--radius-sm);
        background: var(--glass-strong);
        -webkit-backdrop-filter: blur(18px) saturate(160%); backdrop-filter: blur(18px) saturate(160%);
        border: 1px solid var(--glass-border);
        box-shadow: 0 14px 34px rgba(0,0,0,.45), inset 0 1px 0 var(--glass-hi);
        color: var(--txt);
        opacity: 0; transform: scaleX(.96); transform-origin: left center;
        transition: opacity .18s var(--ease), transform .18s var(--ease);
    }
    body.right #flyout { transform-origin: right center; }
    #flyout.show { opacity: 1; transform: none; }
    #flyout .f-icon { font-size: 19px; }
    #flyout .f-name { font-weight: 700; font-size: 13px; white-space: nowrap; }
    #flyout .f-desc { font-size: 10.5px; color: var(--txt-faint); white-space: nowrap; }

    /* ============================================================
       NOTAS
       ============================================================ */
    .notes { position: fixed; top: 9px; bottom: 9px; right: 9px; width: 340px; border-radius: var(--radius); padding: 16px; z-index: 90; display: flex; flex-direction: column; gap: 12px; opacity: 0; pointer-events: none; transition: transform .42s var(--ease), opacity .28s; }
    body.right .notes { right: auto; left: 9px; }
    body:not(.right) .notes:not(.open) { transform: translateX(-100%); }
    body.right .notes:not(.open) { transform: translateX(100%); }
    .notes.open { opacity: 1; pointer-events: auto; }
    .notes-head { display: flex; align-items: center; gap: 10px; }
    .notes-head b { font-size: 14px; }
    .notes-head .x { margin-left: auto; }
    .notes-tools { display: flex; gap: 8px; }
    .notes-tools input { flex: 1; min-width: 0; background: var(--glass-strong); border: 1px solid var(--glass-border); border-radius: 10px; color: var(--txt); font-family: inherit; font-size: 12px; padding: 8px 10px; outline: none; }
    .notes-tools input:focus { border-color: var(--accent); }
    .btn-new { padding: 8px 12px; border-radius: 10px; border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent); background: var(--accent-soft); color: var(--txt); cursor: pointer; font-family: inherit; font-size: 12px; font-weight: 600; white-space: nowrap; }
    .btn-new:hover { background: color-mix(in srgb, var(--accent) 30%, transparent); }
    .notes-list { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-right: 2px; }
    .note { border-radius: 13px; padding: 12px 14px; font-size: 12.5px; color: var(--txt-dim); background: var(--glass-strong); border: 1px solid var(--glass-border); }
    .note b { color: var(--txt); }
    .n-card { cursor: pointer; position: relative; }
    .n-card:hover { border-color: color-mix(in srgb, var(--accent) 40%, transparent); }
    .n-card .n-body { color: var(--txt-dim); font-size: 12px; margin-top: 4px; }
    .n-card .n-del { position: absolute; top: 8px; right: 8px; background: none; border: none; color: var(--txt-faint); cursor: pointer; font-size: 12px; }
    .n-card .n-del:hover { color: #ff8080; }
    .hint-mini { font-size: 10.5px; color: var(--txt-faint); }

    /* ============================================================
       AJUSTES
       ============================================================ */
    .settings { position: fixed; left: 9px; bottom: 9px; width: 340px; border-radius: 16px; padding: 14px; z-index: 95; display: none; flex-direction: column; gap: 12px; }
    body.right .settings { left: auto; right: 9px; }
    .settings.open { display: flex; }
    .settings .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .settings .cap { font-size: 10.5px; color: var(--txt-faint); letter-spacing: 1px; text-transform: uppercase; min-width: 52px; }
    .seg { display: inline-flex; border: 1px solid var(--glass-border); border-radius: 10px; overflow: hidden; }
    .seg button { padding: 6px 11px; border: none; background: transparent; color: var(--txt-dim); cursor: pointer; font-family: inherit; font-size: 12px; font-weight: 600; }
    .seg button.on { background: var(--accent); color: #04121a; }
    .swatch { width: 20px; height: 20px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: .18s; }
    .swatch:hover { transform: scale(1.12); }
    .swatch.on { border-color: var(--txt); box-shadow: 0 0 0 2px rgba(255,255,255,.25); }
    .sw-cyan { background: linear-gradient(145deg,#2fcbf1,#6ea8ff); }
    .sw-blue { background: linear-gradient(145deg,#3b82f6,#2563eb); }
    .sw-indigo { background: linear-gradient(145deg,#818cf8,#6366f1); }
    .sw-violet { background: linear-gradient(145deg,#a78bfa,#8b5cf6); }
    .sw-teal { background: linear-gradient(145deg,#2dd4bf,#14b8a6); }
    .chk { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--txt-dim); cursor: pointer; }
    .chk input { accent-color: var(--accent); }
    .preview { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 12px; background: var(--glass-strong); border: 1px solid var(--glass-border); }
    .preview .pv-chip { width: 26px; height: 26px; border-radius: 8px; background: linear-gradient(145deg, var(--accent), var(--accent-2)); }
    .preview .pv-btn { padding: 5px 12px; border-radius: 8px; background: var(--accent); color: #04121a; font-size: 12px; font-weight: 700; }
    .settings .actions { display: flex; gap: 8px; }
    .btn-soft { flex: 1; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--glass-border); background: transparent; color: var(--txt-dim); cursor: pointer; font-family: inherit; font-size: 12px; font-weight: 600; }
    .btn-soft:hover { background: var(--glass-strong); color: var(--txt); }
    .btn-quit { flex: 1; padding: 8px 12px; border-radius: 10px; border: 1px solid rgba(239,68,68,.35); background: rgba(239,68,68,.12); color: #ffd7d7; cursor: pointer; font-family: inherit; font-size: 12px; font-weight: 600; }
    .btn-quit:hover { background: rgba(239,68,68,.22); }
    .wc { width: 30px; height: 26px; border-radius: 8px; border: 1px solid var(--glass-border); background: var(--glass); color: var(--txt-dim); cursor: pointer; font-size: 12px; }
    .wc:hover { color: var(--txt); background: var(--glass-strong); }
</style>
</head>
<body>

    <div class="edge" id="edge"></div>

    <aside class="dock glass" id="dock">
        <div class="dock-grip" title="Arrastrar para mover (se ancla a izquierda/derecha)"><span></span></div>
        <nav class="dock-tools" id="tools"></nav>
        <div class="dock-foot">
            <button class="dock-btn" id="btnNotes" title="Mis Notas">🗒️</button>
            <button class="dock-btn" id="btnSettings" title="Ajustes">⚙️</button>
            <button class="dock-btn" id="btnHide" title="Ocultar al borde">⤺</button>
            <button class="dock-btn danger" id="btnExit" title="Cerrar NeoApoyos">✕</button>
        </div>
        <div class="dock-resize" id="resizeH" title="Arrastrar para ajustar la altura"><span></span></div>
    </aside>

    <aside class="notes glass" id="notesPanel">
        <div class="notes-head"><span style="font-size:16px">🗒️</span><b>Mis Notas</b><span class="hint-mini" id="notesCount"></span><button class="wc x" id="notesClose" title="Cerrar">✕</button></div>
        <div class="notes-tools">
            <input type="text" id="notesSearch" placeholder="Buscar nota..." />
            <button class="btn-new" id="notesNew" title="Nueva nota">＋ Nueva</button>
        </div>
        <div class="notes-list" id="notesList"></div>
    </aside>

    <div class="settings glass" id="settingsPanel">
        <div class="row">
            <span class="cap">Tema</span>
            <div class="seg" id="segTheme">
                <button data-mode="light">☀️ Claro</button>
                <button data-mode="auto">🖥️ Auto</button>
                <button data-mode="dark" class="on">🌙 Nocturno</button>
            </div>
        </div>
        <div class="row">
            <span class="cap">Tono</span>
            <div class="swatch sw-cyan on" data-accent="#2fcbf1" title="Cian"></div>
            <div class="swatch sw-blue" data-accent="#3b82f6" title="Azul"></div>
            <div class="swatch sw-indigo" data-accent="#818cf8" title="Índigo"></div>
            <div class="swatch sw-violet" data-accent="#a78bfa" title="Violeta"></div>
            <div class="swatch sw-teal" data-accent="#2dd4bf" title="Turquesa"></div>
        </div>
        <div class="preview"><span class="pv-chip"></span><span class="pv-btn">Acento</span><span class="hint-mini">así se verá en las herramientas</span></div>
        <div class="row">
            <span class="cap">Barra</span>
            <label class="chk"><input type="checkbox" id="chkGhost"> Atenuar al estar inactiva</label>
            <label class="chk"><input type="checkbox" id="chkAuto"> Auto-ocultar al borde</label>
        </div>
        <div class="row">
            <span class="cap">Lado</span>
            <div class="seg" id="segSide">
                <button data-side="left" class="on">⬅️ Izquierda</button>
                <button data-side="right">Derecha ➡️</button>
            </div>
        </div>
        <div class="actions">
            <button class="btn-soft" id="btnReset">↺ Restablecer</button>
            <button class="btn-quit" id="btnQuit">Salir</button>
        </div>
    </div>

    <script>
    (function () {
        'use strict';
        var ipc = require('electron').ipcRenderer;

        var TOOLS = [
            { id: 'contingencias', icon: '📡', name: 'Radar Contingencias', desc: 'Fallas masivas en tiempo real' },
            { id: 'trafico',       icon: '📶', name: 'Tráfico PRO',         desc: 'Analizador de consumos' },
            { id: 'tipificador-v2',icon: '⌨️', name: 'Tipificador V2',      desc: 'Tipificaciones Siebel' },
            { id: 'enlaces',       icon: '🔗', name: 'Mis Enlaces',         desc: 'Accesos y herramientas web' },
            { id: 'horarios',      icon: '📅', name: 'Turnos Web',          desc: 'Turnos, breaks y firma' },
            { id: 'occ',           icon: '🧮', name: 'Calculadora OCC',     desc: 'Cobros proporcionales' },
            { id: 'calculadora-dias', icon: '🗓️', name: 'Calculadora de Días', desc: 'Hitos de Plan Mandato' },
            { id: 'ciclos',        icon: '🔄', name: 'Cambio de Ciclo',     desc: 'Impacto de ciclo de facturación' },
            { id: 'fast',          icon: '⚡', name: 'Fast',                desc: 'Tarjetas y apuntes rápidos' }
        ];

        var dock = document.getElementById('dock');
        var toolsNav = document.getElementById('tools');
        var notesPanel = document.getElementById('notesPanel');
        var settingsPanel = document.getElementById('settingsPanel');
        var bodyEl = document.body;
        var toolBtns = {};

        // ---- Herramientas ----
        TOOLS.forEach(function (t) {
            var b = document.createElement('button');
            b.className = 'tool';
            b.dataset.tool = t.id;
            b.innerHTML = '<span class="tile">' + t.icon + '</span>';
            b.addEventListener('click', function () { ipc.send('toggle-tool', t.id); });
            b.addEventListener('mouseenter', function () { mostrarFlyout(b, t); });
            b.addEventListener('mouseleave', ocultarFlyout);
            toolsNav.appendChild(b);
            toolBtns[t.id] = b;
        });
        ['tool-opened', 'tool-restored', 'tool-focused'].forEach(function (ev) {
            ipc.on(ev, function (e, id) { if (toolBtns[id]) toolBtns[id].classList.add('active'); });
        });
        ipc.on('tool-closed', function (e, id) { if (toolBtns[id]) toolBtns[id].classList.remove('active'); });

        // ---- Flyout (ventana overlay separada; no redimensiona el dock) ----
        function mostrarFlyout(btn, t) {
            var r = btn.getBoundingClientRect();
            try { ipc.send('apoyo-flyout', { show: true, icon: t.icon, name: t.name, desc: t.desc, sy: Math.round(r.top + window.screenY) }); } catch (e) {}
        }
        function ocultarFlyout() { try { ipc.send('apoyo-flyout', { show: false }); } catch (e) {} }

        // ---- Estados de ancho de la ventana ----
        var panelState = false;
        function setWidth(state) { try { ipc.send('apoyo-set-width', state); } catch (e) {} }
        function panelesAbiertos() { return notesPanel.classList.contains('open') || settingsPanel.classList.contains('open'); }
        dock.addEventListener('mouseenter', function () { dock.classList.remove('ghost'); });
        dock.addEventListener('mouseleave', function () { ocultarFlyout(); scheduleGhostOrHide(); });

        // ---- Ghost / Auto-ocultar ----
        var ui = { ghost: false, autohide: false };
        var ghostT = null, hideT = null;
        function scheduleGhostOrHide() {
            clearTimeout(ghostT); clearTimeout(hideT);
            if (panelesAbiertos()) return;
            if (ui.autohide) { hideT = setTimeout(function () { try { ipc.send('apoyo-hide'); } catch (e) {} }, 400); return; }
            if (ui.ghost) { ghostT = setTimeout(function () { if (!panelesAbiertos()) dock.classList.add('ghost'); }, 1500); }
        }
        dock.addEventListener('mouseenter', function () { clearTimeout(ghostT); clearTimeout(hideT); dock.classList.remove('ghost'); });
        [notesPanel, settingsPanel].forEach(function (p) {
            p.addEventListener('mouseenter', function () { clearTimeout(ghostT); clearTimeout(hideT); dock.classList.remove('ghost'); });
            p.addEventListener('mouseleave', scheduleGhostOrHide);
        });

        // ---- Notas (datos reales) ----
        var notes = [], notesFiltro = '';
        function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
        function renderNotas() {
            var list = document.getElementById('notesList');
            var countEl = document.getElementById('notesCount');
            if (countEl) countEl.textContent = notes.length + '/10';
            var q = notesFiltro.toLowerCase();
            var vis = notes.filter(function (n) { return !q || (n.content || '').toLowerCase().indexOf(q) !== -1; });
            if (!vis.length) { list.innerHTML = '<div class="hint-mini" style="padding:6px 2px;">' + (notes.length ? 'Sin resultados.' : 'Sin notas. Pulsá ＋ Nueva.') + '</div>'; return; }
            list.innerHTML = '';
            vis.forEach(function (n) {
                var raw = (n.content || '').replace(/<[^>]+>/g, '').trim();
                var title = (raw.split('\n')[0] || '').trim().slice(0, 30) || 'Nota';
                var bodyTxt = raw.replace(/\s+/g, ' ').trim().slice(0, 150);
                var card = document.createElement('div');
                card.className = 'note n-card';
                card.innerHTML = '<b>' + esc(title) + '</b><div class="n-body">' + esc(bodyTxt || 'Sin contenido') + '</div><button class="n-del" title="Eliminar">✕</button>';
                card.addEventListener('click', function () { ipc.send('open-note', n.id); });
                card.querySelector('.n-del').addEventListener('click', function (e) { e.stopPropagation(); if (confirm('¿Eliminar esta nota?')) ipc.send('note-delete', n.id); });
                list.appendChild(card);
            });
        }
        ipc.on('notes-updated', function (e, d) { notes = d || []; renderNotas(); });
        ipc.on('note-limit-reached', function () { toast('Límite de 10 notas alcanzado.'); });
        document.getElementById('notesSearch').addEventListener('input', function (e) { notesFiltro = e.target.value; renderNotas(); });
        document.getElementById('notesNew').addEventListener('click', function () { ipc.send('note-create'); });
        try { notes = ipc.sendSync('get-vault-notes') || []; } catch (e) {}
        renderNotas();

        function toast(msg) {
            var t = document.createElement('div');
            t.className = 'note'; t.textContent = msg;
            t.style.cssText = 'position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:400;padding:8px 14px;';
            document.body.appendChild(t);
            setTimeout(function () { t.remove(); }, 2600);
        }

        // ---- Paneles ----
        function abrirNotas() { notesPanel.classList.add('open'); setWidth('panel'); }
        function cerrarNotas() { notesPanel.classList.remove('open'); if (!settingsPanel.classList.contains('open')) setWidth('bar'); }
        document.getElementById('btnNotes').addEventListener('click', function () { abrirNotas(); });
        document.getElementById('notesClose').addEventListener('click', cerrarNotas);
        document.getElementById('btnSettings').addEventListener('click', function () { settingsPanel.classList.toggle('open'); setWidth(settingsPanel.classList.contains('open') ? 'panel' : 'bar'); });

        // ---- Tema / tono / opciones ----
        var theme = { mode: 'dark', accent: '#2fcbf1' };
        function resolver(modo) { if (modo === 'auto') { try { return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; } catch (e) { return 'dark'; } } return modo === 'light' ? 'light' : 'dark'; }
        function aplicarTema() {
            document.documentElement.setAttribute('data-neo-theme', resolver(theme.mode));
            document.documentElement.style.setProperty('--neo-accent', theme.accent);
            document.querySelectorAll('#segTheme button').forEach(function (b) { b.classList.toggle('on', b.dataset.mode === theme.mode); });
            document.querySelectorAll('.swatch').forEach(function (s) { s.classList.toggle('on', s.dataset.accent === theme.accent); });
        }
        ipc.on('neo-theme', function (e, t) { if (t) { theme.mode = t.mode || 'dark'; theme.accent = t.accent || theme.accent; aplicarTema(); } });
        ipc.on('apoyo-estado', function (e, s) { bodyEl.classList.toggle('right', !!(s && s.side === 'right')); document.querySelectorAll('#segSide button').forEach(function (b) { b.classList.toggle('on', b.dataset.side === (s && s.side)); }); });
        ipc.on('apoyo-config', function (e, cfg) {
            if (!cfg) return;
            if (cfg.theme) { theme.mode = cfg.theme.mode || 'dark'; theme.accent = cfg.theme.accent || theme.accent; }
            if (cfg.ui) { ui.ghost = !!cfg.ui.ghost; ui.autohide = !!cfg.ui.autohide; }
            document.getElementById('chkGhost').checked = ui.ghost;
            document.getElementById('chkAuto').checked = ui.autohide;
            aplicarTema();
        });
        ipc.send('apoyo-config-request');

        document.getElementById('segTheme').addEventListener('click', function (e) { var b = e.target.closest('button[data-mode]'); if (!b) return; theme.mode = b.dataset.mode; aplicarTema(); ipc.send('neo-theme-set', theme); });
        document.querySelectorAll('.swatch').forEach(function (s) { s.addEventListener('click', function () { theme.accent = s.dataset.accent; aplicarTema(); ipc.send('neo-theme-set', theme); }); });
        document.getElementById('chkGhost').addEventListener('change', function (e) { ui.ghost = e.target.checked; ipc.send('apoyo-ui-set', ui); });
        document.getElementById('chkAuto').addEventListener('change', function (e) { ui.autohide = e.target.checked; ipc.send('apoyo-ui-set', ui); });
        document.getElementById('segSide').addEventListener('click', function (e) { var b = e.target.closest('button[data-side]'); if (!b) return; ipc.send('apoyo-set-side', b.dataset.side); });
        document.getElementById('btnReset').addEventListener('click', function () { theme = { mode: 'dark', accent: '#2fcbf1' }; aplicarTema(); ipc.send('neo-theme-set', theme); });
        document.getElementById('btnQuit').addEventListener('click', function () { ipc.send('apoyo-quit'); });
        document.getElementById('btnExit').addEventListener('click', function () { ipc.send('apoyo-quit'); });
        document.getElementById('btnHide').addEventListener('click', function () { try { ipc.send('apoyo-hide'); } catch (e) {} });
        // Ghost al perder foco (clic en otra ventana/monitor)
        window.addEventListener('blur', function () { if (ui.ghost && !ui.autohide && !panelesAbiertos()) { clearTimeout(ghostT); ghostT = setTimeout(function () { if (!panelesAbiertos()) dock.classList.add('ghost'); }, 1000); } });
        // reintenta el matchMedia cuando cambia el sistema (modo auto)
        try { window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () { if (theme.mode === 'auto') aplicarTema(); }); } catch (e) {}

        // ---- Altura (tirador inferior, sin loops) ----
        var resizeH = document.getElementById('resizeH');
        resizeH.addEventListener('pointerdown', function (e) {
            e.preventDefault();
            try { resizeH.setPointerCapture(e.pointerId); } catch (err) {}
            var move = function (ev) { try { ipc.send('apoyo-resize-h', { h: ev.screenY - window.screenY }); } catch (err) {} };
            var up = function (ev) { resizeH.removeEventListener('pointermove', move); resizeH.removeEventListener('pointerup', up); try { if (ev && ev.pointerId != null) resizeH.releasePointerCapture(ev.pointerId); } catch (err) {} };
            resizeH.addEventListener('pointermove', move);
            resizeH.addEventListener('pointerup', up);
        });
    })();
    </script>
</body>
</html>
