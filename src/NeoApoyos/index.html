<!DOCTYPE html>
<html lang="es" data-neo-theme="dark">
<head>
<meta charset="UTF-8" />
<title>NeoApoyos</title>
<style>
    /* ============================================================
       NEOAPOYOS v0.1 — Barra lateral (dock)
       - Ancho FIJO 78px. Al pasar el mouse se ensancha SOLO el botón.
       - Ventana transparente + click-through.
       - Se puede mover (arrastrando) y anclar a izquierda o derecha.
       ============================================================ */

    :root {
        --neo-accent: #2fcbf1;
        --accent: var(--neo-accent);
        --accent-2: color-mix(in srgb, var(--neo-accent) 60%, #ffffff);
        --accent-soft: color-mix(in srgb, var(--neo-accent) 20%, transparent);

        --glass: linear-gradient(180deg, rgba(34,42,60,.72), rgba(18,24,36,.66));
        --glass-strong: linear-gradient(180deg, rgba(54,64,86,.88), rgba(30,38,54,.82));
        --glass-border: rgba(255,255,255,.14);
        --glass-hi: rgba(255,255,255,.34);

        --txt: #eaf1fb;
        --txt-dim: #a7b6cc;
        --txt-faint: #6b7a90;

        --radius: 20px;
        --radius-sm: 13px;
        --dock-w: 78px;
        --ease: cubic-bezier(.22, 1, .36, 1);
        --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }
    html[data-neo-theme="light"] {
        --glass: linear-gradient(180deg, rgba(255,255,255,.72), rgba(255,255,255,.58));
        --glass-strong: linear-gradient(180deg, rgba(255,255,255,.94), rgba(255,255,255,.82));
        --glass-border: rgba(20,30,50,.14);
        --glass-hi: rgba(255,255,255,.7);
        --txt: #16202e;
        --txt-dim: #4a5568;
        --txt-faint: #8a97ab;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; background: transparent; color: var(--txt); font-family: var(--font); -webkit-font-smoothing: antialiased; user-select: none; }

    .glass {
        background: var(--glass);
        -webkit-backdrop-filter: blur(20px) saturate(160%);
        backdrop-filter: blur(20px) saturate(160%);
        border: 1px solid var(--glass-border);
        box-shadow: 0 18px 50px rgba(0,0,0,.40), inset 0 1px 0 var(--glass-hi), inset 0 -1px 0 rgba(255,255,255,.05);
    }

    /* ============================================================
       BARRA
       ============================================================ */
    .dock {
        position: fixed; left: 12px; top: 12px; bottom: 12px;
        width: var(--dock-w);
        border-radius: var(--radius);
        padding: 12px 10px;
        display: flex; flex-direction: column; gap: 12px;
        overflow: visible;
        z-index: 60;
        -webkit-app-region: drag;                 /* toda la barra es arrastrable */
    }
    body.right .dock { left: auto; right: 12px; }
    .dock::before { content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; background: linear-gradient(180deg, rgba(255,255,255,.10), transparent 22%); }
    body.collapsed .dock { display: none; }

    .dock-brand { display: flex; align-items: center; gap: 10px; padding: 2px 2px 6px; }
    body.right .dock-brand { flex-direction: row-reverse; }
    .brand-tile {
        width: 40px; height: 40px; flex: 0 0 auto; display: grid; place-items: center;
        border-radius: 12px; font-weight: 800; font-size: 18px; color: #04121a;
        background: linear-gradient(145deg, var(--accent), var(--accent-2));
        box-shadow: 0 6px 18px var(--accent-soft), inset 0 1px 0 rgba(255,255,255,.6);
    }
    .brand-text { display: flex; flex-direction: column; line-height: 1.15; white-space: nowrap; overflow: hidden; opacity: 0; max-width: 0; transform: translateX(-6px); transition: .3s var(--ease); }
    .brand-text b { font-size: 14px; letter-spacing: .2px; }
    .brand-text small { font-size: 10px; color: var(--txt-faint); text-transform: uppercase; letter-spacing: 1px; }
    .dock:hover .brand-text { opacity: 1; max-width: 190px; transform: none; }

    .dock-tools { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; overflow: visible; padding: 2px; flex: 1; }
    body.right .dock-tools { align-items: flex-end; }

    .tool {
        position: relative; width: calc(var(--dock-w) - 20px); height: 52px; flex: 0 0 auto;
        display: flex; align-items: center; padding: 0 8px;
        border: 1px solid transparent; border-radius: var(--radius-sm);
        background: transparent; color: var(--txt-dim); cursor: pointer;
        font-family: inherit; font-size: 13px; text-align: left;
        transition: width .30s var(--ease), background .2s, border-color .2s, transform .2s var(--ease), color .2s;
        z-index: 1; -webkit-app-region: no-drag;
    }
    body.right .tool { flex-direction: row-reverse; }
    .tool .tile { width: 36px; height: 36px; flex: 0 0 auto; display: grid; place-items: center; font-size: 19px; border-radius: 11px; background: var(--glass-strong); border: 1px solid var(--glass-border); box-shadow: inset 0 1px 0 rgba(255,255,255,.25); transition: transform .25s var(--ease); }
    .tool .lbl { white-space: nowrap; overflow: hidden; opacity: 0; max-width: 0; transform: translateX(-8px); transition: .28s var(--ease); font-weight: 600; letter-spacing: .2px; }
    body.right .tool .lbl { transform: translateX(8px); }
    .tool .lbl small { display: block; font-weight: 500; font-size: 10.5px; color: var(--txt-faint); }

    /* Hover: SOLO el botón se ensancha (sale de la barra). La barra NO cambia. */
    .tool:hover {
        width: 244px; background: var(--glass-strong); border-color: var(--glass-border); color: var(--txt);
        z-index: 70; box-shadow: 0 14px 34px rgba(0,0,0,.45), inset 0 1px 0 var(--glass-hi);
    }
    .tool:hover .tile { transform: scale(1.06); }
    .tool:hover .lbl { opacity: 1; max-width: 180px; transform: none; margin-left: 12px; }
    body.right .tool:hover { transform: translateX(-2px); }
    body.right .tool:hover .lbl { margin-left: 0; margin-right: 12px; }
    body:not(.right) .tool:hover { transform: translateX(2px); }

    .tool.active { color: var(--txt); background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 45%, transparent); }
    .tool.active::before { content: ''; position: absolute; left: -10px; top: 50%; transform: translateY(-50%); width: 4px; height: 26px; border-radius: 4px; background: linear-gradient(var(--accent), var(--accent-2)); box-shadow: 0 0 14px var(--accent); }
    body.right .tool.active::before { left: auto; right: -10px; }
    .tool.active .tile { background: linear-gradient(145deg, var(--accent), var(--accent-2)); color: #04121a; border-color: transparent; }

    .dock-foot { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; padding-top: 8px; border-top: 1px solid var(--glass-border); }
    body.right .dock-foot { align-items: flex-end; }
    .dock-btn {
        position: relative; width: calc(var(--dock-w) - 20px); height: 44px;
        display: flex; align-items: center; padding: 0 8px;
        border: 1px solid transparent; border-radius: 12px; background: transparent;
        color: var(--txt-dim); cursor: pointer; font-family: inherit; font-size: 12.5px; font-weight: 600; text-align: left;
        transition: width .3s var(--ease), background .2s, color .2s, border-color .2s, transform .2s var(--ease);
        -webkit-app-region: no-drag;
    }
    body.right .dock-btn { flex-direction: row-reverse; }
    .dock-btn .ic { width: 30px; height: 30px; flex: 0 0 auto; display: grid; place-items: center; font-size: 16px; }
    .dock-btn .lbl { white-space: nowrap; overflow: hidden; opacity: 0; max-width: 0; transform: translateX(-8px); transition: .28s var(--ease); }
    body.right .dock-btn .lbl { transform: translateX(8px); }
    .dock-btn:hover { width: 244px; background: var(--glass-strong); border-color: var(--glass-border); color: var(--txt); z-index: 70; box-shadow: 0 14px 34px rgba(0,0,0,.45), inset 0 1px 0 var(--glass-hi); }
    .dock-btn:hover .lbl { opacity: 1; max-width: 180px; transform: none; margin-left: 10px; }
    body.right .dock-btn:hover .lbl { margin-left: 0; margin-right: 10px; }
    body:not(.right) .dock-btn:hover { transform: translateX(2px); }
    body.right .dock-btn:hover { transform: translateX(-2px); }
    .dock-btn.danger:hover { color: #ffd7d7; background: rgba(239,68,68,.16); border-color: rgba(239,68,68,.35); }

    /* Mango para mover */
    .dock-handle { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); width: 26px; height: 16px; display: grid; place-items: center; color: var(--txt-faint); font-size: 10px; letter-spacing: 1px; opacity: .5; pointer-events: none; }
    .dock:hover .dock-handle { opacity: .9; }

    .reopen { position: fixed; left: 12px; top: 50%; transform: translateY(-50%); width: 44px; height: 52px; border-radius: 14px; z-index: 80; display: none; place-items: center; cursor: pointer; color: var(--txt); font-size: 18px; -webkit-app-region: no-drag; }
    body.right .reopen { left: auto; right: 12px; }
    body.collapsed .reopen { display: grid; animation: popIn .3s var(--ease); }
    @keyframes popIn { from { opacity: 0; transform: translateY(-50%) scale(.85); } to { opacity: 1; transform: translateY(-50%) scale(1); } }

    /* ============================================================
       PANEL DE NOTAS
       ============================================================ */
    .notes { position: fixed; top: 12px; bottom: 12px; right: 12px; width: 340px; border-radius: var(--radius); padding: 16px; z-index: 90; display: flex; flex-direction: column; gap: 12px; transform: translateX(120%); opacity: 0; transition: transform .42s var(--ease), opacity .3s; }
    body.right .notes { right: 100px; transform: translateX(120%); }
    .notes.open { transform: none; opacity: 1; }
    .notes-head { display: flex; align-items: center; gap: 10px; }
    .notes-head b { font-size: 14px; }
    .notes-head .x { margin-left: auto; }
    .note { border-radius: 13px; padding: 12px 14px; font-size: 12.5px; color: var(--txt-dim); background: var(--glass-strong); border: 1px solid var(--glass-border); box-shadow: inset 0 1px 0 rgba(255,255,255,.18); }
    .note b { color: var(--txt); }
    .note .meta { font-size: 10px; color: var(--txt-faint); margin-top: 6px; letter-spacing: .4px; }
    .notes textarea { width: 100%; min-height: 84px; resize: vertical; border-radius: 12px; padding: 10px 12px; background: rgba(0,0,0,.22); border: 1px solid var(--glass-border); color: var(--txt); font-family: inherit; font-size: 12.5px; outline: none; }
    html[data-neo-theme="light"] .notes textarea { background: rgba(255,255,255,.6); }
    .notes textarea:focus { border-color: color-mix(in srgb, var(--accent) 55%, transparent); }
    .hint-mini { font-size: 10.5px; color: var(--txt-faint); }
    .notes-tools { display: flex; gap: 8px; }
    .notes-tools input { flex: 1; min-width: 0; background: var(--glass-strong); border: 1px solid var(--glass-border); border-radius: 10px; color: var(--txt); font-family: inherit; font-size: 12px; padding: 8px 10px; outline: none; }
    .notes-tools input:focus { border-color: var(--accent); }
    .btn-new { padding: 8px 12px; border-radius: 10px; border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent); background: var(--accent-soft); color: var(--txt); cursor: pointer; font-family: inherit; font-size: 12px; font-weight: 600; white-space: nowrap; }
    .btn-new:hover { background: color-mix(in srgb, var(--accent) 30%, transparent); }
    .notes-list { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-right: 2px; }
    .n-card { cursor: pointer; position: relative; }
    .n-card:hover { border-color: color-mix(in srgb, var(--accent) 40%, transparent); }
    .n-card .n-body { color: var(--txt-dim); font-size: 12px; margin-top: 4px; }
    .n-card .n-del { position: absolute; top: 8px; right: 8px; background: none; border: none; color: var(--txt-faint); cursor: pointer; font-size: 12px; }
    .n-card .n-del:hover { color: #ff8080; }

    /* ============================================================
       AJUSTES
       ============================================================ */
    .settings { position: fixed; left: 108px; bottom: 12px; width: 312px; border-radius: 16px; padding: 14px; z-index: 95; display: none; flex-direction: column; gap: 12px; }
    body.right .settings { left: auto; right: 108px; }
    .settings.open { display: flex; }
    .settings .row { display: flex; align-items: center; gap: 10px; }
    .settings .row .cap { font-size: 10.5px; color: var(--txt-faint); letter-spacing: 1px; text-transform: uppercase; min-width: 46px; }
    .seg { display: inline-flex; border: 1px solid var(--glass-border); border-radius: 10px; overflow: hidden; }
    .seg button { padding: 6px 12px; border: none; background: transparent; color: var(--txt-dim); cursor: pointer; font-family: inherit; font-size: 12px; font-weight: 600; }
    .seg button.on { background: var(--accent); color: #04121a; }
    .swatch { width: 20px; height: 20px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: .18s; }
    .swatch:hover { transform: scale(1.12); }
    .swatch.on { border-color: var(--txt); box-shadow: 0 0 0 2px rgba(255,255,255,.25); }
    .sw-cyan { background: linear-gradient(145deg,#2fcbf1,#6ea8ff); }
    .sw-violet { background: linear-gradient(145deg,#a78bfa,#8b5cf6); }
    .sw-emerald { background: linear-gradient(145deg,#34d399,#10b981); }
    .sw-amber { background: linear-gradient(145deg,#fbbf24,#f59e0b); }
    .sw-rose { background: linear-gradient(145deg,#fb7185,#f43f5e); }
    .btn-quit { margin-top: 2px; padding: 8px 12px; border-radius: 10px; border: 1px solid rgba(239,68,68,.35); background: rgba(239,68,68,.12); color: #ffd7d7; cursor: pointer; font-family: inherit; font-size: 12.5px; font-weight: 600; }
    .btn-quit:hover { background: rgba(239,68,68,.22); }
    .wc { width: 30px; height: 26px; border-radius: 8px; border: 1px solid var(--glass-border); background: var(--glass); color: var(--txt-dim); cursor: pointer; font-size: 12px; }
    .wc:hover { color: var(--txt); background: var(--glass-strong); }
</style>
</head>
<body>

    <aside class="dock glass" id="dock">
        <div class="dock-handle">⠿</div>
        <div class="dock-brand">
            <div class="brand-tile">N</div>
            <div class="brand-text"><b>NeoApoyos</b><small>Modo Apoyo · v0.1</small></div>
        </div>
        <nav class="dock-tools" id="tools"></nav>
        <div class="dock-foot">
            <button class="dock-btn" id="btnNotes" title="Notas"><span class="ic">🗒️</span><span class="lbl">Mis Notas</span></button>
            <button class="dock-btn" id="btnSettings" title="Ajustes"><span class="ic">⚙️</span><span class="lbl">Ajustes</span></button>
            <button class="dock-btn danger" id="btnClose" title="Cerrar barra"><span class="ic">✕</span><span class="lbl">Cerrar barra</span></button>
        </div>
    </aside>

    <button class="reopen glass" id="reopen" title="Mostrar barra">☰</button>

    <aside class="notes glass" id="notesPanel">
        <div class="notes-head">
            <span style="font-size:16px">🗒️</span><b>Mis Notas</b>
            <span class="hint-mini" id="notesCount" style="margin-left:6px;"></span>
            <button class="wc x" id="notesClose" title="Cerrar">✕</button>
        </div>
        <div class="notes-tools">
            <input type="text" id="notesSearch" placeholder="Buscar nota..." />
            <button class="btn-new" id="notesNew" title="Nueva nota">＋ Nueva</button>
        </div>
        <div class="notes-list" id="notesList"></div>
    </aside>

    <div class="settings glass" id="settingsPanel">
        <div class="row">
            <span class="cap">Tema</span>
            <div class="seg" id="segTheme">
                <button data-mode="light">☀️ Claro</button>
                <button data-mode="dark" class="on">🌙 Nocturno</button>
            </div>
        </div>
        <div class="row">
            <span class="cap">Tono</span>
            <div class="swatch sw-cyan on" data-accent="#2fcbf1"></div>
            <div class="swatch sw-violet" data-accent="#a78bfa"></div>
            <div class="swatch sw-emerald" data-accent="#34d399"></div>
            <div class="swatch sw-amber" data-accent="#fbbf24"></div>
            <div class="swatch sw-rose" data-accent="#fb7185"></div>
        </div>
        <button class="btn-quit" id="btnQuit">Salir de NeoApoyos</button>
    </div>

    <script>
    (function () {
        'use strict';
        var ipc = require('electron').ipcRenderer;

        var TOOLS = [
            { id: 'contingencias', icon: '📡', name: 'Radar Contingencias', desc: 'Fallas masivas en tiempo real' },
            { id: 'trafico',       icon: '📶', name: 'Tráfico PRO',         desc: 'Analizador de consumos' },
            { id: 'tipificador-v2',icon: '⌨️', name: 'Tipificador V2',      desc: 'Tipificaciones Siebel' },
            { id: 'enlaces',       icon: '🔗', name: 'Mis Enlaces',         desc: 'Accesos y herramientas web' },
            { id: 'horarios',      icon: '📅', name: 'Turnos Web',          desc: 'Turnos, breaks y firma' },
            { id: 'occ',           icon: '🧮', name: 'Calculadora OCC',     desc: 'Cobros proporcionales' },
            { id: 'calculadora-dias', icon: '🗓️', name: 'Calculadora de Días', desc: 'Hitos de Plan Mandato' },
            { id: 'ciclos',        icon: '🔄', name: 'Cambio de Ciclo',     desc: 'Impacto de ciclo de facturación' },
            { id: 'fast',          icon: '⚡', name: 'Fast',                desc: 'Tarjetas y apuntes rápidos' }
        ];

        var dock = document.getElementById('dock');
        var toolsNav = document.getElementById('tools');
        var notesPanel = document.getElementById('notesPanel');
        var settingsPanel = document.getElementById('settingsPanel');
        var reopen = document.getElementById('reopen');
        var bodyEl = document.body;
        var toolBtns = {};

        TOOLS.forEach(function (t) {
            var b = document.createElement('button');
            b.className = 'tool';
            b.dataset.tool = t.id;
            b.innerHTML = '<span class="tile">' + t.icon + '</span>' +
                          '<span class="lbl">' + t.name + '<small>' + t.desc + '</small></span>';
            b.addEventListener('click', function () { ipc.send('toggle-tool', t.id); });
            toolsNav.appendChild(b);
            toolBtns[t.id] = b;
        });

        ['tool-opened', 'tool-restored', 'tool-focused'].forEach(function (ev) {
            ipc.on(ev, function (e, id) { if (toolBtns[id]) toolBtns[id].classList.add('active'); });
        });
        ipc.on('tool-closed', function (e, id) { if (toolBtns[id]) toolBtns[id].classList.remove('active'); });

        // Lado (izquierda/derecha) según la posición de la ventana
        ipc.on('apoyo-bounds', function (e, b) {
            var right = (b.x + b.width / 2) > (b.screenW / 2);
            bodyEl.classList.toggle('right', right);
        });

        // Notas (datos reales)
        document.getElementById('btnNotes').addEventListener('click', function () { notesPanel.classList.add('open'); });
        document.getElementById('notesClose').addEventListener('click', function () { notesPanel.classList.remove('open'); });

        var notes = [], notesFiltro = '';
        function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
        function renderNotas() {
            var list = document.getElementById('notesList');
            var countEl = document.getElementById('notesCount');
            if (countEl) countEl.textContent = notes.length + '/10';
            var q = notesFiltro.toLowerCase();
            var vis = notes.filter(function (n) { return !q || (n.content || '').toLowerCase().indexOf(q) !== -1; });
            if (!vis.length) {
                list.innerHTML = '<div class="hint-mini" style="padding:6px 2px;">' + (notes.length ? 'Sin resultados.' : 'Sin notas. Pulsá ＋ Nueva.') + '</div>';
                return;
            }
            list.innerHTML = '';
            vis.forEach(function (n) {
                var raw = (n.content || '').replace(/<[^>]+>/g, '').trim();
                var title = (raw.split('\n')[0] || '').trim().slice(0, 30) || 'Nota';
                var body = raw.replace(/\s+/g, ' ').trim().slice(0, 150);
                var card = document.createElement('div');
                card.className = 'note n-card';
                card.innerHTML = '<b>' + esc(title) + '</b><div class="n-body">' + esc(body || 'Sin contenido') + '</div><button class="n-del" title="Eliminar">✕</button>';
                card.addEventListener('click', function () { ipc.send('open-note', n.id); });
                card.querySelector('.n-del').addEventListener('click', function (e) {
                    e.stopPropagation();
                    if (confirm('¿Eliminar esta nota?')) ipc.send('note-delete', n.id);
                });
                list.appendChild(card);
            });
        }
        ipc.on('notes-updated', function (e, d) { notes = d || []; renderNotas(); });
        document.getElementById('notesSearch').addEventListener('input', function (e) { notesFiltro = e.target.value; renderNotas(); });
        document.getElementById('notesNew').addEventListener('click', function () { ipc.send('note-create'); });
        try { notes = ipc.sendSync('get-vault-notes') || []; } catch (e) {}
        renderNotas();

        // Ajustes
        document.getElementById('btnSettings').addEventListener('click', function () { settingsPanel.classList.toggle('open'); });
        document.getElementById('btnQuit').addEventListener('click', function () { ipc.send('apoyo-quit'); });

        var themeState = { mode: 'dark', accent: '#2fcbf1' };
        function aplicarTemaLocal() {
            document.documentElement.setAttribute('data-neo-theme', themeState.mode);
            document.documentElement.style.setProperty('--neo-accent', themeState.accent);
            var seg = document.querySelectorAll('#segTheme button');
            for (var i = 0; i < seg.length; i++) seg[i].classList.toggle('on', seg[i].dataset.mode === themeState.mode);
            var sw = document.querySelectorAll('.swatch');
            for (var j = 0; j < sw.length; j++) sw[j].classList.toggle('on', sw[j].dataset.accent === themeState.accent);
        }
        ipc.on('neo-theme', function (e, t) { if (t) { themeState.mode = t.mode === 'light' ? 'light' : 'dark'; themeState.accent = t.accent || themeState.accent; aplicarTemaLocal(); } });
        ipc.send('neo-theme-request');

        document.getElementById('segTheme').addEventListener('click', function (e) {
            var b = e.target.closest('button[data-mode]'); if (!b) return;
            themeState.mode = b.dataset.mode; aplicarTemaLocal();
            ipc.send('neo-theme-set', themeState);
        });
        Array.prototype.forEach.call(document.querySelectorAll('.swatch'), function (s) {
            s.addEventListener('click', function () {
                themeState.accent = s.dataset.accent; aplicarTemaLocal();
                ipc.send('neo-theme-set', themeState);
            });
        });

        // Cerrar / reabrir
        document.getElementById('btnClose').addEventListener('click', function () { bodyEl.classList.add('collapsed'); });
        reopen.addEventListener('click', function () { bodyEl.classList.remove('collapsed'); });

        // Click-through: solo la barra y los paneles capturan el mouse
        function esInteractivo(x, y) {
            var el = document.elementFromPoint(x, y);
            if (!el) return false;
            return !!(dock.contains(el) || notesPanel.contains(el) || settingsPanel.contains(el) || reopen.contains(el));
        }
        var lastIgnore = true;
        function setIgnore(v) { if (v !== lastIgnore) { lastIgnore = v; try { ipc.send('apoyo-ignore-mouse', v); } catch (e) {} } }
        document.addEventListener('mousemove', function (e) { setIgnore(!esInteractivo(e.clientX, e.clientY)); });
        document.addEventListener('mouseleave', function () { setIgnore(true); });
        window.addEventListener('blur', function () { setIgnore(true); });
    })();
    </script>
</body>
