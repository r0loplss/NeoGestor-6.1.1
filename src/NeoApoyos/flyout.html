<!DOCTYPE html>
<html data-neo-theme="dark">
<head>
<meta charset="UTF-8">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; font-family: 'Segoe UI', system-ui, sans-serif; }
    #f {
        position: absolute; inset: 0; display: flex; align-items: center; gap: 10px; padding: 0 14px;
        border-radius: 13px;
        background: linear-gradient(180deg, rgba(54,64,86,.93), rgba(30,38,54,.87));
        -webkit-backdrop-filter: blur(18px) saturate(160%); backdrop-filter: blur(18px) saturate(160%);
        border: 1px solid rgba(255,255,255,.14);
        box-shadow: 0 14px 34px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.3);
        color: #eaf1fb;
    }
    html[data-neo-theme="light"] #f {
        background: linear-gradient(180deg, rgba(255,255,255,.96), rgba(255,255,255,.86));
        border-color: rgba(20,30,50,.14); color: #16202e;
    }
    #f .ic { font-size: 19px; flex: 0 0 auto; }
    #f .tx { min-width: 0; display: flex; flex-direction: column; }
    #f .nm { font-weight: 700; font-size: 13px; white-space: nowrap; }
    #f .ds { font-size: 10.5px; color: #8a97ab; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body>
<div id="f"><span class="ic"></span><span class="tx"><span class="nm"></span><span class="ds"></span></span></div>
<script>
    const { ipcRenderer } = require('electron');
    ipcRenderer.on('flyout-data', (e, d) => {
        d = d || {};
        document.querySelector('.ic').textContent = d.icon || '';
        document.querySelector('.nm').textContent = d.name || '';
        document.querySelector('.ds').textContent = d.desc || '';
    });
</script>
</body>
</html>
