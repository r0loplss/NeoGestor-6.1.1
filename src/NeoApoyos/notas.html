<!DOCTYPE html>
<html lang="es" data-neo-theme="dark">
<head>
<meta charset="UTF-8" />
<title>Mis Notas</title>
<style>
    :root {
        --neo-accent: #2fcbf1;
        --accent: var(--neo-accent);
        --accent-2: color-mix(in srgb, var(--neo-accent) 60%, #ffffff);
        --accent-soft: color-mix(in srgb, var(--neo-accent) 20%, transparent);
        --glass: linear-gradient(180deg, rgba(34,42,60,.78), rgba(18,24,36,.72));
        --glass-strong: linear-gradient(180deg, rgba(54,64,86,.92), rgba(30,38,54,.86));
        --glass-border: rgba(255,255,255,.14);
        --glass-hi: rgba(255,255,255,.34);
        --txt: #eaf1fb; --txt-dim: #a7b6cc; --txt-faint: #6b7a90;
        --ease: cubic-bezier(.22, 1, .36, 1);
    }
    html[data-neo-theme="light"] {
        --glass: linear-gradient(180deg, rgba(255,255,255,.82), rgba(255,255,255,.68));
        --glass-strong: linear-gradient(180deg, rgba(255,255,255,.96), rgba(255,255,255,.86));
        --glass-border: rgba(20,30,50,.14); --glass-hi: rgba(255,255,255,.7);
        --txt: #16202e; --txt-dim: #4a5568; --txt-faint: #8a97ab;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; background: transparent; color: var(--txt); font-family: 'Segoe UI', system-ui, sans-serif; -webkit-font-smoothing: antialiased; user-select: none; }
    .panel {
        position: absolute; inset: 0; display: flex; flex-direction: column; gap: 12px; padding: 16px; border-radius: 18px;
        background: var(--glass);
        -webkit-backdrop-filter: blur(20px) saturate(160%); backdrop-filter: blur(20px) saturate(160%);
        border: 1px solid var(--glass-border);
        box-shadow: 0 18px 50px rgba(0,0,0,.45), inset 0 1px 0 var(--glass-hi);
        -webkit-app-region: drag;
    }
    .head { display: flex; align-items: center; gap: 10px; -webkit-app-region: no-drag; }
    .head b { font-size: 14px; }
    .count { font-size: 10.5px; color: var(--txt-faint); }
    .x { margin-left: auto; }
    .tools { display: flex; gap: 8px; -webkit-app-region: no-drag; }
    .tools input { flex: 1; min-width: 0; background: var(--glass-strong); border: 1px solid var(--glass-border); border-radius: 10px; color: var(--txt); font-family: inherit; font-size: 12px; padding: 8px 10px; outline: none; }
    .tools input:focus { border-color: var(--accent); }
    .btn-new { padding: 8px 12px; border-radius: 10px; border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent); background: var(--accent-soft); color: var(--txt); cursor: pointer; font-family: inherit; font-size: 12px; font-weight: 600; white-space: nowrap; }
    .btn-new:hover { background: color-mix(in srgb, var(--accent) 30%, transparent); }
    .list { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-right: 2px; -webkit-app-region: no-drag; }
    .note { border-radius: 13px; padding: 12px 14px; font-size: 12.5px; color: var(--txt-dim); background: var(--glass-strong); border: 1px solid var(--glass-border); }
    .note b { color: var(--txt); }
    .n-card { cursor: pointer; position: relative; }
    .n-card:hover { border-color: color-mix(in srgb, var(--accent) 40%, transparent); }
    .n-card .n-body { color: var(--txt-dim); font-size: 12px; margin-top: 4px; }
    .n-card .n-del { position: absolute; top: 8px; right: 8px; background: none; border: none; color: var(--txt-faint); cursor: pointer; font-size: 12px; }
    .n-card .n-del:hover { color: #ff8080; }
    .hint-mini { font-size: 10.5px; color: var(--txt-faint); }
    .wc { width: 30px; height: 26px; border-radius: 8px; border: 1px solid var(--glass-border); background: var(--glass); color: var(--txt-dim); cursor: pointer; font-size: 12px; }
    .wc:hover { color: var(--txt); background: var(--glass-strong); }
</style>
</head>
<body>
<div class="panel">
    <div class="head"><span style="font-size:16px">🗒️</span><b>Mis Notas</b><span class="count" id="count"></span><button class="wc x" id="close" title="Cerrar">✕</button></div>
    <div class="tools">
        <input type="text" id="search" placeholder="Buscar nota..." />
        <button class="btn-new" id="new" title="Nueva nota">＋ Nueva</button>
    </div>
    <div class="list" id="list"></div>
</div>
<script>
(function () {
    'use strict';
    var ipc = require('electron').ipcRenderer;
    var notes = [], filtro = '';
    function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
    function render() {
        var list = document.getElementById('list');
        document.getElementById('count').textContent = notes.length + '/10';
        var q = filtro.toLowerCase();
        var vis = notes.filter(function (n) { return !q || (n.content || '').toLowerCase().indexOf(q) !== -1; });
        if (!vis.length) { list.innerHTML = '<div class="hint-mini" style="padding:6px 2px;">' + (notes.length ? 'Sin resultados.' : 'Sin notas. Pulsá ＋ Nueva.') + '</div>'; return; }
        list.innerHTML = '';
        vis.forEach(function (n) {
            var raw = (n.content || '').replace(/<[^>]+>/g, '').trim();
            var title = (raw.split('\n')[0] || '').trim().slice(0, 30) || 'Nota';
            var bodyTxt = raw.replace(/\s+/g, ' ').trim().slice(0, 150);
            var card = document.createElement('div');
            card.className = 'note n-card';
            card.innerHTML = '<b>' + esc(title) + '</b><div class="n-body">' + esc(bodyTxt || 'Sin contenido') + '</div><button class="n-del" title="Eliminar">✕</button>';
            card.addEventListener('click', function () { ipc.send('open-note', n.id); });
            card.querySelector('.n-del').addEventListener('click', function (e) { e.stopPropagation(); if (confirm('¿Eliminar esta nota?')) ipc.send('note-delete', n.id); });
            list.appendChild(card);
        });
    }
    ipc.on('notes-updated', function (e, d) { notes = d || []; render(); });
    ipc.on('note-limit-reached', function () { toast('Límite de 10 notas alcanzado.'); });
    document.getElementById('search').addEventListener('input', function (e) { filtro = e.target.value; render(); });
    document.getElementById('new').addEventListener('click', function () { ipc.send('note-create'); });
    document.getElementById('close').addEventListener('click', function () { ipc.send('apoyo-panel', { which: null }); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') ipc.send('apoyo-panel', { which: null }); });
    try { notes = ipc.sendSync('get-vault-notes') || []; } catch (e) {}
    render();
    function toast(msg) {
        var t = document.createElement('div'); t.className = 'note'; t.textContent = msg;
        t.style.cssText = 'position:absolute;left:50%;bottom:16px;transform:translateX(-50%);padding:8px 14px;';
        document.body.appendChild(t); setTimeout(function () { t.remove(); }, 2600);
    }
})();
</script>
</body>
</html>
